# The local stack of the MVP: Postgres, WireMock stand-ins for the A2A agents the orchestrator drives,
# and (profile `app`) the whole system: the orchestrator, the web UI, an edge proxy on one origin and
# the default agent, adam-coder (ADR 0014), with its own mocks, a git server and a CI stand-in, and two more
# agents that are only a folder each, a chat and a researcher, served by adam-agent from the coder's image.
# Everything binds to 127.0.0.1 and nothing here is a real secret. Start with dev/README.md, "Test it locally".
#
#   docker compose --profile app up --build            # the whole system -> http://127.0.0.1:8080
#   docker compose up -d --wait                        # infrastructure + mocks only (fast, nothing is built)
#   dev/e2e-all.sh                                     # every scenario against a running `app` stack
#
# Needs Docker Compose v2. compose.live.yaml needs v2.24.4 or newer (it uses the `!override` tag). The `app` profile
# pulls the coder image (about 2.9 GB, linux/amd64 only, run under emulation on an ARM machine) and builds
# the orchestrator, the web UI, the git server, `mock-ci` and `mock-mcp-search`; the first build takes several minutes.
#
# The `app` profile is offline and deterministic: the model, GitHub and CI are scripts. `dev/coder-e2e.sh`
# turns one chat message into a pull request, and the job ends `done` when the coder's own checks passed on
# the pushed commit and the mock CI has reported it green (the coder is gated on both). The coder is the
# first entry of dev/agents.yaml, so it is the default agent. `chat` and `researcher` answer in role on a scripted
# model (`mock-model`), the researcher through a mock web search; `dev/agents-e2e.sh` asserts it, and a fourth agent is
# a folder under dev/agents/ and about a dozen lines here (dev/README.md, "Add a fourth agent by writing a folder").
# The other agents need only the default profile: `docker compose up -d --wait` starts no coder.
#
# Other profiles (each is opt-in, none is part of `app`):
#
#   split        two workers beside the orchestrator as a control plane (ADR 0015); `dev/split-e2e.sh`
#                kills the worker that holds a task and checks that the other one finishes it:
#                  ORCHESTRATOR_ROLE=control-plane docker compose --profile app --profile split up -d --build --wait
#                `orchestrator` is `all` (its own dispatcher) unless ORCHESTRATOR_ROLE says otherwise; the
#                workers are always `worker`, with a 5 s lease so a killed one is replaced within seconds.
#   smee         forwards GitHub webhooks from smee.io to the orchestrator, for going live from a laptop.
#                Needs SMEE_URL (.env.example); smee.io is a third party that sees every payload.
#   local-agent  a second orchestrator, built with the Cargo feature `agent-local`, that hosts an `echo`
#                agent in its own process, with a database of its own (ADR 0015): http://127.0.0.1:8095.
#
# compose.live.yaml (an override, `-f compose.yaml -f compose.live.yaml`) points the coder at a real model
# and a real GitHub, reading .env (copy .env.example): dev/README.md, "Going live".
name: another-agentic-system

x-wiremock: &wiremock
  image: wiremock/wiremock:3.13.2 # verified 2026-09-29 (Docker Hub registry API); newest 3.x stable
  # Every stub of these mocks fills its answer in from the request (JSON-RPC id, task id, host).
  command: ["--global-response-templating", "--disable-banner"]
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

# The orchestrator image and environment, shared by the `orchestrator` service and the split workers.
# YAML merge keys are shallow, so the environment is an anchor of its own that a service extends.
x-orchestrator: &orchestrator
  build:
    context: ./orchestrator
  image: another-agentic-system/orchestrator:dev
  volumes:
    - ./dev/orchestrator.yaml:/etc/orchestrator/config.yaml:ro
    - ./dev/agents.yaml:/etc/orchestrator/agents.yaml:ro
  depends_on:
    postgres:
      condition: service_healthy
    mock-agent:
      condition: service_healthy
    mock-agent-releases:
      condition: service_healthy
    mock-verifier:
      condition: service_healthy
    mock-registry:
      condition: service_healthy

x-orchestrator-env: &orchestrator-env
  # Every setting is a key of dev/orchestrator.yaml (ADR 0034, docs/api/config.md), read from here: the surfaces, the agents file and
  # the platform's agent registry, the title model (the scripted `mock-model`), the thread tools' address, the MCP and webhook
  # settings, the log format. What stays a variable is the secrets, which the file names by reference (`{ env: NAME }`), and the
  # `tokenEnv` variables of the agents file and of the MCP tokens file. Each value below is a dummy, for local development only.
  ORCH_CONFIG_FILE: /etc/orchestrator/config.yaml
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/orch
  AGENT_REGISTRY_AGENT_TOKEN: dev-registry-agent-token # sent to every agent the registry lists; the mocks accept any token
  MOCK_AGENT_TOKEN: dev-mock-token # named by `tokenEnv` in dev/agents.yaml; the mocks accept any token
  CODER_A2A_TOKEN: dev-coder-token # named by `tokenEnv` in dev/agents.yaml; must equal A2A_BEARER_TOKENS of `coder`
  CHAT_A2A_TOKEN: dev-chat-token # the same for `chat` ...
  RESEARCHER_A2A_TOKEN: dev-researcher-token # ... and for `researcher`
  # The HMAC key of the thread tools' tokens: EVERY role gets it (a worker mints the grant it sends with a message, the control
  # plane serves the endpoint). A real deployment sets its own key (.env.example, `openssl rand -hex 32`).
  THREAD_TOOLS_SECRET: ${THREAD_TOOLS_SECRET:-dev-thread-tools-secret-0123456789abcdef0123456789abcdef} # local development only
  # No ORCH_SURFACES and no AUTH_DEV_USER: the surfaces are in the file, and the identity comes from the `edge` proxy, as it does
  # from oauth2-proxy. The legacy chat API surface was removed on 2026-09-30: naming `chat-api` stops the orchestrator at startup
  # (see orchestrator/bin/orchestrator/README.md).

# The adam-rs image of every agent that is adam: the coder, and the agents that are only a folder (adam-agent).
# One image, pinned ONCE here by tag AND digest, and the tag is the adam-rs commit in dev/coder/UPSTREAM, which
# dev/coder/check-vendored.sh asserts. linux/amd64 only, about 2.9 GB. Verified 2026-10-02 (ghcr API, anonymous pull, HTTP 200):
# `coder:sha-c0f12dd` is one linux/amd64 manifest (2.92 GB of compressed layers, thirteen layers), uid 10001, entrypoint `tini -- adam-coder`,
# label org.opencontainers.image.revision c0f12dd1dd6240acece51c7452e98c6648486276, and the digest below is the sha-256 of the manifest the
# registry returned (its Docker-Content-Digest). The image sets NO `MCP_ALLOW_STDIO` (it ships `github-mcp-server` for the coder, but also
# `adam-agent`, which must refuse local processes): the coder's deployment sets it, compose.live.yaml does. `adam-agent` ships INSIDE this
# image beside `adam-coder` (adam-rs ADR 0005): there is no second image to pull, and a service that serves a folder is this image with
# another entrypoint.
x-adam-image: &adam-image ghcr.io/vymalo/another-adam-rs/coder:sha-c0f12dd@sha256:7a0768dce9a8cb27d1e84c9c5eebe7815ee2f3ab6c56466c87a17114aebdf2ad

# What every agent that is a folder shares (`chat`, `researcher`, and the one you add: dev/README.md, "Add a fourth
# agent by writing a folder"). YAML merge keys are shallow: a service that needs more `depends_on` repeats the list.
x-adam-agent: &adam-agent
  profiles: [app]
  image: *adam-image
  # The image has no arm64 variant: name the platform so an ARM machine runs it under emulation.
  platform: linux/amd64
  entrypoint: ["tini", "--", "adam-agent"]
  depends_on:
    agents-postgres:
      condition: service_healthy
    mock-model:
      condition: service_healthy
  healthcheck:
    # Plain TCP connect: the image is not guaranteed to ship curl.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
    interval: 3s
    timeout: 3s
    retries: 30
    start_period: 10s

x-adam-agent-env: &adam-agent-env
  # One database for all of them: runs are scoped by the agent's name (adam-rs, bin/adam-agent/README.md).
  DATABASE_URL: postgres://postgres:postgres@agents-postgres:5432/agents
  MODEL_BASE_URL: http://mock-model:8080/v1
  MODEL_API_KEY: mock-api-key # dummy: the mock accepts anything
  ADAM_AGENT_DIR: /etc/adam/agent # the folder each service mounts there: its name, card, instructions, tools
  # Development only. Plain http between containers, on purpose: the thread's own tools (`thread-tools/v1`, the
  # orchestrator at http://orchestrator:8080, announced in every message since adam-rs d411249, whose card lists it) and the
  # MCP servers a folder names (the researcher's mock web search).
  MCP_ALLOW_INSECURE: "true"

services:
  postgres:
    image: postgres:16.15-alpine # CI uses postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local development only
      POSTGRES_DB: orch
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates `orch_test` on first start, the database `cargo test` expects (see orchestrator/README.md).
      - ./dev/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orch"]
      interval: 5s
      timeout: 3s
      retries: 12

  # A fake A2A 1.0 coding agent. The script is chosen by a keyword in the message text.
  mock-agent:
    <<: *wiremock
    ports:
      - "127.0.0.1:${MOCK_AGENT_PORT:-8081}:8080"
    volumes:
      - ./dev/wiremock/agent/mappings:/home/wiremock/mappings:ro
      - ./dev/wiremock/agent/__files:/home/wiremock/__files:ro

  # The same agent, declaring the release-channels extension: the UI's release picker.
  mock-agent-releases:
    <<: *wiremock
    ports:
      - "127.0.0.1:${MOCK_AGENT_RELEASES_PORT:-8082}:8080"
    volumes:
      - ./dev/wiremock/agent-releases/mappings:/home/wiremock/mappings:ro
      - ./dev/wiremock/agent-releases/__files:/home/wiremock/__files:ro

  # A fake A2A 1.0 verifier agent (ADR 0018): it answers a request to review a commit with a `verdict`
  # artifact, findings for a commit of forty `a` and a pass for any other. `verifier` and
  # `mock-coder-verified` in dev/agents.yaml use it; dev/verifier-e2e.sh drives it.
  mock-verifier:
    <<: *wiremock
    ports:
      - "127.0.0.1:${MOCK_VERIFIER_PORT:-8083}:8080"
    volumes:
      - ./dev/wiremock/verifier/mappings:/home/wiremock/mappings:ro
      - ./dev/wiremock/verifier/__files:/home/wiremock/__files:ro

  # The platform's agent registry (agent-registry/v1, ADR 0022) as a WireMock stub: a linkset that lists one agent,
  # `platform-coder`, at the card of `mock-agent-releases`. The orchestrator reads it (AGENT_REGISTRY_URL); dev/registry-e2e.sh
  # changes it through WireMock's admin API (adds an agent, makes it answer 503) and checks the picker follows.
  mock-registry:
    <<: *wiremock
    ports:
      - "127.0.0.1:${MOCK_REGISTRY_PORT:-8084}:8080"
    volumes:
      - ./dev/wiremock/registry/mappings:/home/wiremock/mappings:ro
      - ./dev/wiremock/registry/__files:/home/wiremock/__files:ro

  orchestrator:
    <<: *orchestrator
    profiles: [app]
    # The anchor's volumes are replaced, not merged: the configuration and the agents file again, and the MCP tokens.
    volumes:
      - ./dev/orchestrator.yaml:/etc/orchestrator/config.yaml:ro
      - ./dev/agents.yaml:/etc/orchestrator/agents.yaml:ro
      - ./dev/mcp-tokens.yaml:/etc/orchestrator/mcp-tokens.yaml:ro
    environment:
      <<: *orchestrator-env
      # `all` (control plane and dispatcher in one process) unless the split profile is in use, where
      # ORCHESTRATOR_ROLE=control-plane leaves the delivery to the workers. A process override: it wins over
      # `server.role` and logs at info. The instance id stays the default ($HOSTNAME-<uuid>).
      ORCH_ROLE: ${ORCHESTRATOR_ROLE:-all}
      # The routes this service mounts (the AG-UI routes, the MCP server at /mcp, the thread tools, the two CI webhooks) are
      # `server.surfaces` of dev/orchestrator.yaml, with the hosts they accept and the files they read. Here are the secrets
      # they are signed or opened with (named there by `{ env: NAME }`); the workers serve no routes and are not given them.
      WEBHOOK_GENERIC_SECRETS: dev-webhook-secret-0123456789abcdef0123 # local development only
      WEBHOOK_GITHUB_SECRETS: dev-webhook-secret-0123456789abcdef0123 # local development only; the secret `mock-ci` signs with
      MCP_TOKEN_DEV: dev-mcp-token-0123456789abcdef0123456789 # named by `tokenEnv` in dev/mcp-tokens.yaml; dummy: a real deployment keeps this in a secret
      # The chat, for the web_url of start_job: `server.publicUrl` says the edge's own port (8080). Another EDGE_PORT sets the
      # variable, which wins over the file (with a warning); unset, it is empty, and an empty variable is not set.
      ORCH_PUBLIC_URL: ${EDGE_PORT:+http://127.0.0.1:${EDGE_PORT}}
    # No `depends_on` for `coder`: the agent card is read when a thread is delegated, never at boot, and a
    # coder that is down leaves it first in the list and fails the thread like any agent that is down.
    # No healthcheck of its own: the distroless image has no shell or curl. `edge` probes /readyz through the proxy.

  # Two workers for the `split` profile: the dispatcher and a probes-and-metrics port, no API. The instance
  # id is the service name, so `lease_owner` in the outbox says which worker holds a task
  # (dev/split-e2e.sh reads it). A 5 s lease (the binary's minimum is 3) lets the survivor take a killed
  # worker's task over within seconds instead of 30. No published port and no healthcheck, like `orchestrator`.
  # The workers read the same dev/orchestrator.yaml. The 5 s lease is `dispatcher.outboxLeaseSecs`, one key a profile cannot
  # change in a file, so it stays the variable OUTBOX_LEASE_SECS (a warning at startup names it; ADR 0034, open question 44).
  orchestrator-worker-1:
    <<: *orchestrator
    profiles: [split]
    environment:
      <<: *orchestrator-env
      ORCH_ROLE: worker
      ORCH_INSTANCE_ID: orchestrator-worker-1
      OUTBOX_LEASE_SECS: "5"

  orchestrator-worker-2:
    <<: *orchestrator
    profiles: [split]
    environment:
      <<: *orchestrator-env
      ORCH_ROLE: worker
      ORCH_INSTANCE_ID: orchestrator-worker-2
      OUTBOX_LEASE_SECS: "5"

  web:
    profiles: [app]
    build:
      context: . # the API types are generated from docs/api/chat-api.yaml
      dockerfile: web/Dockerfile
    image: another-agentic-system/web:dev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Stands in for oauth2-proxy: one origin, /api/* to the orchestrator, everything else to the web UI,
  # and a fixed X-Auth-Request-Email. It authenticates nobody: never expose it, never use it in production.
  edge:
    profiles: [app]
    image: caddy:2.11.4-alpine # verified 2026-09-29 (Docker Hub registry API)
    ports:
      - "127.0.0.1:${EDGE_PORT:-8080}:8080"
    volumes:
      - ./dev/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      orchestrator:
        condition: service_started
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  # ---------------------------------------------------------------- the default agent --
  # adam-coder (vymalo/another-adam-rs), the first entry of dev/agents.yaml (ADR 0014), wired to
  # mocks vendored byte for byte from the same adam-rs commit (dev/coder/UPSTREAM, checked by
  # dev/coder/check-vendored.sh): the model is a script that ends in a pull request. Every
  # credential below is a dummy and every host is inside the compose network.

  coder-postgres:
    profiles: [app]
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local development only
      POSTGRES_DB: coder
    volumes:
      - coder-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coder"]
      interval: 5s
      timeout: 3s
      retries: 12

  # OpenAI-compatible model endpoint with two scripts, chosen by the request's model: `mock-coder`
  # (the coder, with an SSE twin of each stub for the streamed calls it makes) and `mock-opencode` (the OpenCode the coder starts).
  # An off-script request is a 404.
  # Journal: http://127.0.0.1:8091/__admin/requests (and /unmatched).
  mock-openai:
    <<: *wiremock
    profiles: [app]
    ports:
      - "127.0.0.1:${MOCK_OPENAI_PORT:-8091}:8080"
    volumes:
      - ./dev/coder/wiremock/mock-openai/mappings:/home/wiremock/mappings:ro
      - ./dev/coder/wiremock/mock-openai/__files:/home/wiremock/__files:ro

  # The GitHub REST subset the coder uses: list and open pull requests, create a repository (`POST /orgs/{o}/repos`, `scratch`
  # is an organisation), and trade a GitHub App's JWT for an installation token (dev/compose.github-app.yaml).
  # Journal: http://127.0.0.1:8092/__admin/requests
  mock-github:
    <<: *wiremock
    profiles: [app]
    ports:
      - "127.0.0.1:${MOCK_GITHUB_PORT:-8092}:8080"
    volumes:
      - ./dev/coder/wiremock/mock-github/mappings:/home/wiremock/mappings:ro
      - ./dev/coder/wiremock/mock-github/__files:/home/wiremock/__files:ro

  # The GitHub MCP server's streamable HTTP endpoint, as the coder reads GitHub through it (adam-rs ADR 0009): `initialize`,
  # `tools/list` (the twelve read tools of the coder's allow-list) and `tools/call` of `get_me` and `list_branches`, behind a
  # bearer. The production coder starts the real server as a child process (the `mcp.json` of its folder); this stack points the
  # coder at this mock instead (dev/coder/coder-agent/mcp.json, mounted over the folder's, see `coder`), so no GitHub and no
  # second binary are needed. The default script of the coder's model calls `list_branches` once, and dev/coder-e2e.sh asserts it.
  # Endpoint and journal: http://127.0.0.1:8085/mcp, http://127.0.0.1:8085/__admin/requests
  mock-github-mcp:
    <<: *wiremock
    profiles: [app]
    ports:
      - "127.0.0.1:${MOCK_GITHUB_MCP_PORT:-8085}:8080"
    volumes:
      - ./dev/coder/wiremock/mock-github-mcp/mappings:/home/wiremock/mappings:ro

  # A git remote over smart HTTP, seeded with local/sandbox.git and local/library.git. It accepts any credentials, or none.
  # A repository of an owner in AUTO_CREATE_OWNERS is made, empty, the first time anything asks for it: what a repository that
  # was just created on GitHub is like (`create_repository` of the coder, answered by mock-github with a clone URL here).
  # `/__repos/` lists what it holds, as JSON (mock-ci reads it).
  # From the host: http://127.0.0.1:8093/local/sandbox.git. From the coder: http://git-server:8080/local/sandbox.git.
  git-server:
    profiles: [app]
    build:
      context: ./dev/coder/git-server
    image: another-agentic-system/git-server:dev
    environment:
      AUTO_CREATE_OWNERS: scratch
    ports:
      - "127.0.0.1:${GIT_SERVER_PORT:-8093}:8080"
    volumes:
      - git-data:/srv/git

  # A stand-in for the CI of the repository (dev/mock-ci, ADR 0017): polls git-server for `agent/*` branches
  # and posts a signed GitHub-shaped check_run named `mock-ci/build` for each new commit through the edge
  # (which passes /webhooks/* on without an identity): `success`, or `failure` when the commit message
  # contains CI_FAIL. MOCK_CI_SHAPE=github-workflow posts a workflow_run, `generic` the generic body to
  # /webhooks/ci. The coder's entry in dev/agents.yaml requires CI and names the check that counts
  # (`mock-ci/build`), so a job ends `done` when this has reported its commit. The secret is read from
  # the environment and never put on a command line.
  mock-ci:
    profiles: [app]
    build:
      context: ./dev/mock-ci
    image: another-agentic-system/mock-ci:dev
    environment:
      GIT_SERVER_URL: http://git-server:8080
      # `<owner>/*` is every repository of that owner, found through git-server's `/__repos/` on every pass (a repository the
      # coder created on request is watched as soon as it exists). local/library is not watched on purpose: it is seeded and
      # only read, and dev/workspace-e2e.sh tells from git-server's log whether anything asked for it.
      MOCK_CI_REPOS: "local/sandbox scratch/*"
      WEBHOOK_URL: http://edge:8080
      WEBHOOK_SECRET: dev-webhook-secret-0123456789abcdef0123 # WEBHOOK_GITHUB_SECRETS / WEBHOOK_GENERIC_SECRETS of `orchestrator`
      MOCK_CI_SHAPE: ${MOCK_CI_SHAPE:-github}
    depends_on:
      git-server:
        condition: service_healthy
      edge:
        condition: service_healthy

  # A mock web-search MCP server (dev/mock-mcp-search, dev/README.md "Mock web search (MCP)"): streamable HTTP at
  # http://mock-mcp-search:8080/mcp, one tool `web_search` with an icon, answering the canned results of
  # dev/mock-mcp-search/results.json, so that an agent that searches the web, and a web search attached to a chat,
  # run offline. It requires `Authorization: Bearer dev-search-token`. From the host: http://127.0.0.1:8096/mcp
  # (dev/check-agent-mocks.sh probes it; GET /__journal lists the calls it has had).
  mock-mcp-search:
    profiles: [app]
    build:
      context: ./dev/mock-mcp-search
    image: another-agentic-system/mock-mcp-search:dev
    environment:
      MOCK_MCP_TOKEN: dev-search-token # local development only
    ports:
      - "127.0.0.1:${MOCK_MCP_SEARCH_PORT:-8096}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  # adam-coder, the default agent, from the image pinned once at the top of this file (`x-adam-image`: the tag is the
  # adam-rs commit in dev/coder/UPSTREAM, which dev/coder/check-vendored.sh asserts). Since adam-rs 7b2d8f9 the
  # coder reads its agent folder (instructions, card) at startup from ADAM_AGENT_DIR, the mount below, and falls back to
  # the copy in the image only when it is unset; its card and its name are "Coder", and "hi" gets a greeting that says
  # its name, not a request for a task. Since 31df660 a new
  # task continues the task it references (A2A referenceTaskIds: the coder keeps its repositories and branch), the
  # coder has `run_command` (look around without using a check cycle), bash, a default base branch and a
  # missing-toolchain report; since e9bfea3 a stop without a pull request is a question and it works only on a
  # repository the person named; since ae540e9 it reports its checks as a `checks` artifact. Since f882b91 the same
  # image also carries `adam-agent`, which the two services below run (nothing of the coder changed). Since d411249 the coder asks
  # with Choices: its card lists A2UI v0.9.1, `ui-catalog/v1` and `thread-tools/v1`, so the orchestrator sends it the screen's catalog
  # and the address of the thread's own tools (`MCP_ALLOW_INSECURE` below), and `ask_user` may carry several questions at once
  # that the person answers as one form (dev/choices-e2e.sh; dev/README.md, "Choices"). `adam-agent` lists the same extensions.
  # Since cf6ddbb the coder reports its work as steps (`steps/v1`: a step per tool call, OpenCode a sub-agent step with its own steps
  # under it) and streams its model calls and says each answer as it is written (`text-stream/v1`); its card lists both, the
  # orchestrator activates what it lists, and `adam-agent` lists them too (dev/coder-e2e.sh; dev/README.md, "Steps and live text").
  # Since 1021836 the coder needs no repository to start: it builds in a scratch project and publishes it when the person names a
  # repository, asks the person before another repository joins its workspace (`request_repository`) and, for the owners of
  # `CREATE_REPO_OWNERS`, before it creates one (`create_repository`): both questions are forms when the screen's catalog is there.
  # It reads GitHub over MCP (read only: the `mcp.json` of its folder, here the mock `mock-github-mcp`), and it holds the credential
  # of its own installation: a token (`GITHUB_TOKEN`), or a GitHub App (`GITHUB_APP_*`, dev/compose.github-app.yaml). Neither ever
  # goes through the orchestrator, A2A or the log (dev/workspace-e2e.sh; dev/README.md, "Workspaces").
  # Since d56dd94 a tool call's step carries its `input` and its `output` (steps/v1, redacted and cut; an MCP tool's `title` is its label),
  # the instructions tell the coder what the person sees (working notes beside the steps, one self-contained answer, Markdown), and a
  # run may work in its repository's devcontainer (DEVCONTAINER_RUNTIME, off unless set: nothing here sets it). The image sets no
  # MCP_ALLOW_STDIO any more: this offline coder reads GitHub over http (the mock `mcp.json` below), so it needs none.
  #
  # What the coder says and offers is the folder mounted at /etc/adam/agent (ADAM_AGENT_DIR): dev/coder/agent, vendored
  # from bin/adam-coder/agent upstream (dev/coder/UPSTREAM). It is read once, at startup, so a change to it needs a
  # restart, not a build: edit dev/coder/agent/instructions.md (or point CODER_AGENT_DIR at a copy) and run
  # `docker compose --profile app up -d coder` (dev/README.md, "Change what the coder says"). The folder must be
  # readable by uid 10001 (chmod -R a+rX).
  coder:
    profiles: [app]
    image: *adam-image # pinned once, at the top of this file
    # The image has no arm64 variant: name the platform so an ARM machine runs it under emulation
    # instead of refusing to pull.
    platform: linux/amd64
    depends_on:
      coder-postgres:
        condition: service_healthy
      mock-openai:
        condition: service_healthy
      mock-github:
        condition: service_healthy
      mock-github-mcp:
        condition: service_healthy
      git-server:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@coder-postgres:5432/coder
      MODEL_BASE_URL: http://mock-openai:8080/v1
      MODEL_API_KEY: mock-api-key # dummy: the mock accepts anything
      MODEL: mock-coder # the coder's script
      OPENCODE_MODEL: mock-opencode # OpenCode's script
      GITHUB_API_URL: http://mock-github:8080
      # Dummy. An installation is a token OR a GitHub App, never both: dev/compose.github-app.yaml turns this one off (empty) and
      # gives the coder an App (GITHUB_APP_*) that mock-github trades JWTs for tokens. MOCK_GITHUB_TOKEN=bad-token makes mock-github answer 401.
      GITHUB_TOKEN: ${MOCK_GITHUB_TOKEN-dev-github-token}
      A2A_BEARER_TOKENS: dev-coder-token # the orchestrator sends it as CODER_A2A_TOKEN
      # The card advertises this URL and the orchestrator posts to it, so it is the compose name,
      # not 127.0.0.1: an orchestrator on the host cannot use this coder.
      PUBLIC_URL: http://coder:8080/
      WORKSPACE_ROOT: /work
      # Development only: repositories on git-server, over plain http. Never set these in production.
      ALLOWED_REPO_HOSTS: git-server
      ALLOW_LOCAL_REPOS: "true"
      # The coder may create repositories for this owner, after the person agrees (mock-github makes `scratch` an organisation, and
      # git-server makes the repository, empty, on first use). Unset, `create_repository` is off.
      CREATE_REPO_OWNERS: scratch
      # The mounted folder below: what the coder says and offers, read at startup. Unset, it would use the copy in the image.
      ADAM_AGENT_DIR: /etc/adam/agent
      # Development only. Every message the orchestrator sends carries the address of the thread's own tools
      # (`thread-tools/v1`, THREAD_TOOLS_URL: http://orchestrator:8080), and that is an MCP server over plain http on
      # another host, which the coder reaches only when it is allowed on purpose. Without it the coder asks in text.
      MCP_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${CODER_PORT:-8090}:8080"
    volumes:
      - coder-work:/work
      # Read-only. CODER_AGENT_DIR points the mount at a copy (dev/agent-folder-e2e.sh does).
      - ${CODER_AGENT_DIR:-./dev/coder/agent}:/etc/adam/agent:ro
      # The folder's mcp.json starts the real github-mcp-server (a child process, in the image); this stack reads GitHub through
      # mock-github-mcp instead. This file goes over the folder's mcp.json, so a folder in CODER_AGENT_DIR must have one (a copy
      # of dev/coder/agent does). compose.live.yaml drops this mount: live, the shipped mcp.json runs.
      - ./dev/coder/coder-agent/mcp.json:/etc/adam/agent/mcp.json:ro
    healthcheck:
      # Plain TCP connect: the image is not guaranteed to ship curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  # ---------------------------------------------- agents that are only a folder --
  # adam-agent (vymalo/another-adam-rs, bin/adam-agent) serves ONE agent from the folder mounted at /etc/adam/agent:
  # instructions, card, skills and the tools of an `mcp.json`. It is the coder's image with another entrypoint
  # (`x-adam-agent`), so an agent is a folder of dev/agents/<id>/agent and the dozen lines of a service below, never a build.
  # Each folder is read once, at startup (a change needs a restart: `docker compose --profile app up -d <id>`), and must
  # be readable by uid 10001 (chmod -R a+rX). All of them share ONE database: runs are scoped by the agent's name.
  # `chat` and `researcher` are agents 2 and 3 of dev/agents.yaml; dev/agents-e2e.sh asserts each answers in its role.

  agents-postgres:
    profiles: [app]
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local development only
      POSTGRES_DB: agents
    volumes:
      - agents-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agents"]
      interval: 5s
      timeout: 3s
      retries: 12

  # The model of those agents: an OpenAI-compatible WireMock with one script per model name, in
  # dev/wiremock/model/mappings (not vendored: ours). `mock-persona` answers `Hi! I'm <name>. <summary>.`, built from the
  # first two lines of the instructions the agent rendered into its system prompt (`Your name is ...` and
  # `In one sentence: ...`), so it works for any folder that follows that convention; `mock-researcher` calls
  # `search__web_search` with the person's words, then answers with the first link of the results. An off-script request
  # is a 404. The agents stream their model calls (adam-rs cf6ddbb), so each of the first two scripts has an SSE twin (`*-stream.json`,
  # the same matchers plus `"stream": true`, one priority above). Journal: http://127.0.0.1:8094/__admin/requests (and /unmatched).
  mock-model:
    <<: *wiremock
    profiles: [app]
    ports:
      - "127.0.0.1:${MOCK_MODEL_PORT:-8094}:8080"
    volumes:
      - ./dev/wiremock/model/mappings:/home/wiremock/mappings:ro

  # A casual chat: greets and talks in plain words, no tools of its own, no repository talk.
  chat:
    <<: *adam-agent
    environment:
      <<: *adam-agent-env
      MODEL: mock-persona # greets from the persona lines of the folder
      A2A_BEARER_TOKENS: dev-chat-token # the orchestrator sends it as CHAT_A2A_TOKEN
      PUBLIC_URL: http://chat:8080/ # what the card advertises and the orchestrator posts to: the compose name
    ports:
      - "127.0.0.1:${CHAT_PORT:-8097}:8080"
    volumes:
      - ${CHAT_AGENT_DIR:-./dev/agents/chat/agent}:/etc/adam/agent:ro # read-only; CHAT_AGENT_DIR points the mount at a copy

  # A researcher: searches the web through the MCP server its folder names (agent/mcp.json: `search`, the mock web search)
  # and answers with the sources it found, and, when the screen's catalog has `Cards` and `Mermaid` (adam-rs c13ddf1), shows
  # them as cards and a graph beside its words (dev/cards-e2e.sh; dev/README.md, "Cards and Mermaid"). The folder holds the server's URL and the NAME of the token (`${SEARCH_MCP_TOKEN}`
  # in its headers); the value is this service's environment. The mock is plain http on the compose network, which a
  # deployment must allow on purpose (MCP_ALLOW_INSECURE: development only, set in `x-adam-agent-env`). A worker connects the
  # server at startup, so it waits for `mock-mcp-search` to be healthy.
  researcher:
    <<: *adam-agent
    depends_on:
      agents-postgres:
        condition: service_healthy
      mock-model:
        condition: service_healthy
      mock-mcp-search:
        condition: service_healthy
    environment:
      <<: *adam-agent-env
      MODEL: mock-researcher # calls search__web_search, then names the first source
      A2A_BEARER_TOKENS: dev-researcher-token # the orchestrator sends it as RESEARCHER_A2A_TOKEN
      PUBLIC_URL: http://researcher:8080/
      SEARCH_MCP_TOKEN: dev-search-token # the bearer token of mock-mcp-search
    ports:
      - "127.0.0.1:${RESEARCHER_PORT:-8098}:8080"
    volumes:
      - ${RESEARCHER_AGENT_DIR:-./dev/agents/researcher/agent}:/etc/adam/agent:ro

  # ------------------------------------------------------------- smee (opt-in) --
  # GitHub cannot reach a laptop, so `--profile smee` forwards its webhooks from smee.io (a public relay,
  # a THIRD PARTY that sees every payload, headers included) to the orchestrator. Start it only with a
  # channel of your own in SMEE_URL (.env, dev/README.md "Going live"); without one the container says so
  # and exits. It never reaches the `edge`, which injects an identity: `smee-proxy` is a Caddy of its
  # own that passes `POST /webhooks/github` to the orchestrator, signature-checked there, and nothing else.

  smee-proxy:
    profiles: [smee]
    image: caddy:2.11.4-alpine # the `edge` image
    volumes:
      - ./dev/Caddyfile.smee:/etc/caddy/Caddyfile:ro
    depends_on:
      orchestrator:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  # smee-client 5.0.0 (npm) on the node image, both pinned (dev/smee/Dockerfile): the project publishes no image.
  smee:
    profiles: [smee]
    build:
      context: ./dev/smee
    image: another-agentic-system/smee:dev
    environment:
      SMEE_URL: ${SMEE_URL:-} # read from .env; never put it on a command line
      SMEE_TARGET: http://smee-proxy:8081/webhooks/github
    depends_on:
      smee-proxy:
        condition: service_healthy
    restart: "on-failure:3"

  # ---------------------------------------------------------- local-agent (optional) --
  # The orchestrator with an agent INSIDE it (ADR 0015): built with the Cargo feature `agent-local`
  # (the image then links the adam-rs runtime: a long build) and given dev/agents.local-echo.yaml, whose
  # one agent, `echo`, repeats the message back. It has a Postgres of its own, so it never shares a log or
  # an outbox with `orchestrator`, and it serves no web UI: drive it with dev/try-thread.sh
  #   BASE_URL=http://127.0.0.1:8095 AGENT_ID=echo dev/try-thread.sh hello
  # The identity is AUTH_DEV_USER (development only, the orchestrator logs a warning), because no edge
  # stands in front of it. The port is published on 127.0.0.1 only.

  local-postgres:
    profiles: [local-agent]
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local development only
      POSTGRES_DB: orch
    volumes:
      - local-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orch"]
      interval: 5s
      timeout: 3s
      retries: 12

  orchestrator-local:
    profiles: [local-agent]
    build:
      context: ./orchestrator
      args:
        ORCH_FEATURES: agent-local
    image: another-agentic-system/orchestrator:dev-local
    depends_on:
      local-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@local-postgres:5432/orch
      AGENTS_FILE: /etc/orchestrator/agents.yaml
      AUTH_DEV_USER: dev@example.com
      LOG_FORMAT: text
    volumes:
      - ./dev/agents.local-echo.yaml:/etc/orchestrator/agents.yaml:ro
    ports:
      - "127.0.0.1:${ORCH_LOCAL_PORT:-8095}:8080"

volumes:
  postgres-data:
  coder-postgres-data:
  agents-postgres-data:
  git-data:
  coder-work:
  local-postgres-data:
