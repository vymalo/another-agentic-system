openapi: 3.1.0
info:
  title: another-agentic-system chat API
  version: 0.1.0
  description: |
    The only interface between the chat surface (web/) and the orchestrator
    (ADR 0009: the UI is swappable). Everything a user sees in a thread is derived
    from the thread's append-only event log (an Event, below); the UI renders it,
    it never invents state.

    Authentication ([ADR 0033](../decisions/0033-the-orchestrator-is-an-oauth2-resource-server.md)):
    the orchestrator is an OAuth2 resource server behind oauth2-proxy. With `auth.mode: jwt` the
    identity is the `Authorization: Bearer <JWT>` the proxy forwards (or a client's own token),
    validated against the issuer's keys; a request without a valid token gets 401 with
    `WWW-Authenticate: Bearer`, and 503 (`Retry-After`) while the keys cannot be fetched (fail
    closed, and `/readyz` with it). With the default `auth.mode: proxy_header` the orchestrator
    trusts `X-Auth-Request-Email` set by the proxy and rejects requests without it with 401.
    Local development may set `AUTH_DEV_USER` to inject a fixed identity (`proxy_header` only);
    it must be refused when unset.

    DPoP ([ADR 0054](../decisions/0054-the-web-holds-its-own-tokens-dpop-bound-in-indexeddb.md), RFC 9449):
    when `auth.dpop` is configured a request may carry `Authorization: DPoP <token>` and exactly one
    `DPoP` proof instead, for a token bound to the client's key (`cnf.jkt`). The proof is `typ` `dpop+jwt`,
    `ES256` or `EdDSA`, signed by the public `jwk` of its header, with `htm` the method, `htu` the public URL
    without query and fragment (one of `auth.dpop.publicOrigins` and the request's path), `iat` within 60
    seconds past and 5 ahead, a `jti` not seen within that window, and `ath` the hash of the token. A token
    that is bound to a key is **refused as a `Bearer`**. A refusal is 401 with
    `WWW-Authenticate: DPoP error="invalid_dpop_proof", algs="ES256 EdDSA"` (the proof) or
    `DPoP error="invalid_token", algs="ES256 EdDSA"` (the token, its binding, or a bound token sent as a
    bearer); a request with no credential gets both `Bearer realm="orchestrator"` and `DPoP algs="ES256 EdDSA"`.
    Without `auth.dpop` the `DPoP` scheme is refused and nothing else changes. `getPublicAuth` says where a
    browser signs in.

    Authorization ([ADR 0033](../decisions/0033-the-orchestrator-is-an-oauth2-resource-server.md),
    [`config.md`](config.md#roles-and-permissions)): who a person is says what they may do. The
    roles of the credential (the token's roles claim) map, by `auth.roles`, to the permissions
    `agent.read`, `agent.invoke`, `thread.read`, `thread.write`, `thread.share`, `thread.delete`, `artifact.read` and `admin`; a role
    the configuration does not define grants nothing, and a person with no defined role gets
    `auth.defaultRole`. `getMe` says what the caller's roles grant. **Nobody reads another person's
    thread** ([ADR 0039](../decisions/0039-nobody-reads-another-persons-thread.md)): every permission
    over threads is over the caller's own, for every role, `admin` included, which is operational and
    gives no access to what people wrote. The answers, everywhere below: **404** for a thread that is
    not the caller's (it is the answer for one that does not exist, so existence never leaks);
    **403** for a permission their roles lack (`code: forbidden`, whatever is asked for, so it says
    nothing of what exists), for an agent their roles do not name, and, for a person whose roles
    grant nothing at all, for every operation but `getMe` (`code: no_access`). A `Thread` carries its
    `owner`, the caller's own address.

    Sharing ([ADR 0040](../decisions/0040-thread-sharing-by-revocable-link.md)): the one way a person
    reads another person's thread is a link its owner made. `shareThread`, `rotateThreadShare` and
    `unshareThread` are the owner's (`thread.share`, except taking a link down, which needs only
    ownership); `getSharedThread` and `getSharedArtifact` are for a signed-in reader of `internal` (or
    `public`) links, `getPublicSharedThread` and `getPublicSharedArtifact` for **anybody**, outside
    the identity layer, for `public` links only, with `Authorization` ignored, rate limited (429 with
    `Retry-After`), `Cache-Control: no-store` and `X-Robots-Tag: noindex, nofollow`. **Every way a link can
    fail to be a readable one is the same 404, with the same body**: an unknown token, a bad MAC, a
    private or revoked thread, a cap that was lowered, a file that is not the thread's. A reader is
    read-only and never sees the owner's address (the owner is "the owner").

    Deleting ([ADR 0043](../decisions/0043-deleting-a-thread-erases-it.md)): `deleteThread` erases the
    caller's own thread, the threads made from it by an edit, their files and their links. It needs
    `thread.delete`, which **is not `thread.write`** (a person who may only read may still erase their own
    data), and is refused with a 409 `thread_active` while the thread works.

    Interaction (start a thread, send a message, answer a question, follow a
    thread live) is AG-UI ([ADR 0012](../decisions/0012-ag-ui-user-facing-protocol.md)):
    the `/agui/*` operations below, with the mapping, the connect binding and
    the `vymalo.*` schemas in [`agui.md`](agui.md). Their request and event
    schemas are the vendored AG-UI 1.0 JSON Schema, referenced by file. The
    thread list, thread details, cancel, the agent list and health stay REST.

    Removed: the legacy REST interaction operations (`createThread`, `postMessage`,
    `listEvents`, `streamEvents`) were deprecated on 2026-09-29 and removed on 2026-09-30
    ([ADR 0012](../decisions/0012-ag-ui-user-facing-protocol.md)). `ORCH_SURFACES=chat-api` is
    now a startup error. No operation returns an `Event` any more; the `Event` schemas below
    describe the append-only log that AG-UI projects, which the goldens under
    [`examples/`](examples/README.md) pin.
servers:
  - url: /
security:
  - bearerToken: []
  - dpopToken: []
  - proxyIdentity: []
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      summary: Liveness
      responses:
        "200": { description: Process is up }
        "503": { description: Shutting down }
  /readyz:
    get:
      operationId: getReady
      security: []
      summary: Readiness (database reachable, migrations applied)
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /api/me:
    get:
      operationId: getMe
      summary: Who the caller is, and what their roles let them do
      description: |
        The caller's identity (`user` is the key of what they own: the e-mail, lower-cased), the roles
        that count (the roles of the credential that `auth.roles` defines, or `auth.defaultRole` when
        none is), what those roles grant (`permissions`, each with its `scope` where it has one) and
        the agents `agent.read` and `agent.invoke` are about (`["*"]` for every agent). A client uses it
        to show what its person may do and to hide what they may not; **it is never a check**: the
        orchestrator enforces every request whatever a client shows. It is the one operation that
        answers a person whose roles grant nothing (`roles` and `permissions` are then empty), so that
        a client can say why every other operation is a 403. Never cached.
      responses:
        "401": { $ref: "#/components/responses/Problem" }
        "200":
          description: The caller
          headers: { Cache-Control: { description: "`no-store`", schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
  /api/agents:
    get:
      operationId: listAgents
      summary: Agents the user can target
      description: |
        Only the agents the caller's roles may read (`agent.read` and the agents of their roles); the
        first of them is the one `getMe`'s `invoke` names first, which clients preselect.

        The agents the deployment lists (`AGENTS_FILE`, `source: static`) and, when it reads one,
        the agents of the platform's registry (`source: registry`, [ADR 0022](../decisions/0022-platform-provisions-agents-system-discovers-them.md)).
        The list is read now, on every request: an agent added to the registry shows on the next
        request, and one it removed is gone. For each, the orchestrator reads the live agent card;
        `releases` is present only when the card advertises the release-channels extension (ADR 0008).
        Listed in display order, the static agents first; the first is the default target, which
        clients preselect. An agent whose card cannot be read stays in its place. A registry that
        cannot be read lists none of its agents (fail closed) and the static agents stay.
      responses:
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "No role of the caller holds `agent.read` (`code: forbidden`), or their roles grant nothing (`code: no_access`)", $ref: "#/components/responses/Problem" }
        "200":
          description: Agent list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Agent" } }
  /api/registry:
    get:
      operationId: getRegistry
      summary: Whether each source of agents could be read
      description: |
        How each source of the agent list answered on a read made now
        ([ADR 0022](../decisions/0022-platform-provisions-agents-system-discovers-them.md)): the
        deployment's own list (`static`, always `ok`) and, when the deployment reads one, the
        platform's registry (`platform`). A client reads it beside `listAgents` to say that the
        list is incomplete: a registry that cannot be read lists none of its agents (fail closed),
        and `listAgents` alone cannot tell "the platform has none" from "the platform cannot be
        reached". No agent card is read, and neither a URL nor a credential is in the answer.
        Never cached. It is about the agent list, so it takes `agent.read`.
      responses:
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "No role of the caller holds `agent.read` (`code: forbidden`), or their roles grant nothing (`code: no_access`)", $ref: "#/components/responses/Problem" }
        "200":
          description: One status per source, in the order the sources are read
          headers: { Cache-Control: { description: "`no-store`", schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registry" }
  /api/config:
    get:
      operationId: getConfig
      summary: The public subset of the orchestrator's configuration, for the web
      description: |
        The `ui` section of the configuration file ([`config.md`](config.md#get-apiconfig),
        [ADR 0034](../decisions/0034-one-yaml-configuration-secrets-by-reference.md)): every key
        with its effective value, defaults filled in, and nothing else of the file. Behind the
        identity layer like every `/api/*` route (401 without an identity). It changes only when
        the process restarts. A client treats a missing key as its default and ignores a key it
        does not know, so the section grows additively.
      responses:
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "The caller's roles grant nothing (`code: no_access`)", $ref: "#/components/responses/Problem" }
        "200":
          description: The public configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicConfig" }
  /api/tool-servers:
    get:
      operationId: listToolServers
      summary: The MCP servers a person may attach to a conversation
      description: |
        The servers the deployment offers for attaching ([ADR 0024](../decisions/0024-mcp-tools-attached-per-conversation.md),
        the `toolServers` section of [`config.md`](config.md)), in the order the deployment lists them: what
        the picker shows. A person cannot enter a URL; this list is the deployment's. **Neither a URL nor
        a header nor a credential is in it**, nor the allow-list of a server's tools, nor its timeout: the
        orchestrator calls the server for the agent and holds what it needs. `icon` is a `data:` URI the
        screen draws as it is; an icon at a URL is never offered, and a client never fetches one
        (open question 38). `agents` says which agents the server may be attached for, and is absent when
        it may be attached for every agent: a thread whose agent is not listed is refused (`putThreadTools`, 422).
        An empty list is a deployment with nothing to attach. Never cached. It takes `thread.write`, as
        attaching does.
      responses:
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "No role of the caller holds `thread.write` (`code: forbidden`), or their roles grant nothing (`code: no_access`)", $ref: "#/components/responses/Problem" }
        "200":
          description: The servers, in the deployment's order
          headers: { Cache-Control: { description: "`no-store`", schema: { type: string } } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ToolServer" }
  /api/threads:
    get:
      operationId: listThreads
      summary: List the caller's threads, newest first or in their own order
      description: |
        The caller's own threads, and nobody else's: there is no listing of another person's threads or of
        everyone's, for any role ([ADR 0039](../decisions/0039-nobody-reads-another-persons-thread.md)).
        A request that carries an `owner` parameter, whatever its value, is a **400** (`owner is not
        supported (ADR 0039)`); until 2026-10-03 it was the administrators' way to list others' threads.

        **Order** ([ADR 0042](../decisions/0042-the-thread-list-is-the-owners.md)). `recent` (the default) is a flat
        list, `id` descending (ids sort by creation). `rail` is the order the person made of their list: the threads of
        the list's own level (the ones with no `nestedUnder`), the pinned first, then the rest, each by the place
        `arrangeThread` gave it (a new thread is on top; ties newest first), then the archived ones by when they were
        archived, newest first; and each is **followed by the threads nested under it**, newest first. With `rail`,
        `limit` counts the threads of the list's own level, so a page never splits a block, and `before` is the id of
        the last of them. `before` names a thread of the caller's: an unknown one, another person's, one nested under
        another (with `rail`) or one the `archived` filter does not list as a block (with `rail`) has no page after it:
        an empty list.

        **Archived.** `exclude` (the default) leaves the archived out: with `rail`, a block archived by its parent goes
        with it, and a child archived alone is left out of its parent's block; with `recent`, each row by its own state.
        `only` lists the archived: with `rail`, the archived threads of the list's own level, each with all its
        children, and the threads archived while their parent is not, each on its own; with `recent`, the archived rows.
        `include` lists everything: with `rail`, the archived blocks last. Until 2026-10-03 the list had no archived
        threads, so the default changes nothing for a client that never archives.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: before, in: query, description: "Cursor: thread id to page before", schema: { type: string } }
        - name: branches
          in: query
          description: |
            `include`: list the threads made by an edit of a message too ([ADR 0029](../decisions/0029-forking-a-thread-copies-its-log.md)).
            Without it they are left out: an edit is a branch of a conversation the list already shows
            (`listBranches` says where its siblings are), and `limit` counts the threads listed. A thread made by
            "fork from here" is a conversation of its own and is always listed.
          schema: { type: string, enum: [include] }
        - name: order
          in: query
          description: "`recent` (the default): newest first, flat. `rail`: the person's own order, blocks of a thread and the threads nested under it ([ADR 0042](../decisions/0042-the-thread-list-is-the-owners.md))"
          schema: { type: string, enum: [recent, rail], default: recent }
        - name: archived
          in: query
          description: "`exclude` (the default): the threads that are not archived. `only`: the archived ones. `include`: all of them"
          schema: { type: string, enum: [exclude, only, include], default: exclude }
      responses:
        "400": { description: "`limit` out of range, `before` not a thread id, `branches` not `include`, `order` not `recent` or `rail`, `archived` not `exclude`, `only` or `include`, or an `owner` parameter (not supported: ADR 0039)", $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "No role of the caller holds `thread.read`, or their roles grant nothing", $ref: "#/components/responses/Problem" }
        "200":
          description: Threads
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Thread" } }
  /api/threads/{threadId}:
    parameters: [ { $ref: "#/components/parameters/ThreadId" } ]
    get:
      operationId: getThread
      summary: One thread
      description: "A thread the caller may read: their own. Another person's is a 404, the answer for one that does not exist, whatever the caller's roles (ADR 0039). A thread that is shared has `share`, with the link (`url`), and the response is then `Cache-Control: no-store`."
      responses:
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "No role of the caller holds `thread.read`, or their roles grant nothing", $ref: "#/components/responses/Problem" }
        "200":
          description: Thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: patchThread
      summary: Rename a thread, or write its description
      description: |
        Changes what a person writes about the thread, in any state of the thread, finished ones
        included (a title and a description label the conversation, not a job). At least one of two
        members is given:

        * `title`: the thread's new title. Trimmed, then one line of 1 to 200 characters with no
          control character. A rename is logged as a `thread_titled` event (`source: user`) and is
          final: nothing else replaces a title a person wrote. Renaming to the title the thread has
          from the person already writes nothing.
        * `description`: the thread's description ([ADR 0035](../decisions/0035-utility-model-tasks.md)):
          what the conversation is about now, in a sentence or two. Trimmed, then one line of 0 to
          500 characters with no control character; **an empty one clears it**. It is logged as a
          `thread_described` event (`source: user`) and is final, an empty one included: the model is
          never asked for this thread's description again, and one it had in flight is dropped.
          Writing the description the thread has from the person already writes nothing.

        Both are checked before either is written, so a 400 changes nothing. A member other than
        these two is a 400, so that a client that thinks it can change more learns it cannot. The
        caller's own threads only (`thread.write`): someone else's is a 404 indistinguishable from one that
        does not exist, whatever the caller's roles. Everything else about the thread is as `getThread` says.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadPatch" }
      responses:
        "401": { $ref: "#/components/responses/Problem" }
        "200":
          description: The thread, with what was changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { description: "No role of theirs holds `thread.write`, or their roles grant nothing", $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteThread
      summary: Delete a thread, and erase it
      description: |
        Deletes the caller's thread **and every thread made from it by an edit, transitively** (an edit is a branch of
        the conversation that the list does not show, so deleting only the visible one would leave copies the person
        can no longer see or erase), and **erases** them ([ADR 0043](../decisions/0043-deleting-a-thread-erases-it.md)):

        * the log, the outbox, the agent binding, the watches and the timers are deleted, in one transaction;
        * the share goes with the row: **every link to the thread, a signed-in reader's and a public one, is a 404 from
          that moment**, and a stream open on it, the owner's or a reader's, ends (the client reconnects and is told
          the thread is not found);
        * the files of the thread and of its edits are erased from the artifact store right after, or within a
          sweep of the orchestrator's workers when the store is down (the answer does not wait for a sweep: the log is
          gone, and so is anything that referred to a file);
        * **forks are kept**: a fork is a conversation of its own (`forkedFrom` has no `threadId` any more) and, when
          it was nested under the deleted thread, takes its place in the caller's list, in the section (pinned,
          archived) and the order it had.

        A thread that works is **refused, 409 `thread_active`**: it is `queued`, `working` or `verifying`, or an agent
        its job asked is still running (the same goes for an edit of it). Deleting would cascade the unsent request to
        stop the agent away, and the agent would go on working, perhaps pushing to a repository. Stop it
        (`cancelThread`), wait for a terminal state on the stream (stopping is a request, not a state: the thread ends when
        the agent reports it), and delete it. A `blocked` thread, which waits for the person, can be deleted.

        Needs `thread.delete` and the thread to be the caller's, **not `thread.write`**. A deployment can withhold it
        (a legal hold, for instance); the people of such a role are erased by the operator. **What stays out of reach**,
        and is not promised away: the A2A agent's own store of its context, the model provider that saw the
        conversation, backups until they expire and, in a build that hosts an agent in-process, the agent's journal
        rows for the context. A second `DELETE` is a 404.
      responses:
        "204": { description: "The thread, and its edits, are deleted: their log is gone, their links are 404, their files are erased or on their way" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "No role of the caller holds `thread.delete` (`code: forbidden`, whatever the id), or their roles grant nothing (`code: no_access`)", $ref: "#/components/responses/Problem" }
        "404": { description: "The thread does not exist, was deleted already, its id is not a UUID, or it is not the caller's (one answer for all, an administrator's included)", $ref: "#/components/responses/Problem" }
        "409": { description: "`code: thread_active`: the thread, or an edit of it, is `queued`, `working` or `verifying`, or has a running ask. Stop it, wait for it to end, then delete it", $ref: "#/components/responses/Problem" }
        "503": { description: "The thread kept changing under the delete (`Retry-After`), or storage is unavailable: nothing was deleted, try again", $ref: "#/components/responses/Problem" }
  /api/threads/{threadId}/rail:
    parameters: [ { $ref: "#/components/parameters/ThreadId" } ]
    patch:
      operationId: arrangeThread
      summary: Pin, archive, move or eject a thread in the caller's list
      description: |
        Changes how the caller's own list shows one thread ([ADR 0042](../decisions/0042-the-thread-list-is-the-owners.md)):
        a change of the thread's row, **written to no event** of its log (the log is the conversation, which a fork
        copies, an export carries and the readers of a share see: none of them sees or inherits it), so `version`,
        `updatedAt` and the thread's events do not change. At least one member is given, and an unknown one is a 400:

        * `pinned`: `true` pins the thread and puts it **on top of the pinned**; `false` unpins it and puts it **on top
          of the rest**. Pinning a thread that is pinned writes nothing.
        * `archived`: `true` archives the thread (it leaves the list `listThreads` gives by default and is listed with
          `archived=only`), `false` brings it back **in the place it had**. Archiving does not touch a share: the link
          keeps working, and `share` stays on the thread.
        * `nested`: `false` **ejects** a thread nested under another (a fork made nested under its parent): it becomes a
          thread of the list's own level, **right after the block it left** (on top of the unpinned when that block is
          pinned or archived). Its `forkedFrom` is untouched: ejecting is display grouping, not history. A thread that
          is not nested has nothing to eject. `nested: true` is a **422**: nesting a thread by moving it is not built.
        * `place`: where a thread of the list's own level goes among the caller's: `"top"` (on top of its section),
          `{"before": id}` or `{"after": id}` (right before, or right after, that thread). The server makes the place;
          a client never sends a key. The anchor must be a thread of the caller's that is on the list's own level, not
          archived and not the thread itself, else **422** `bad_anchor`; a client that gets it reads the list again. With
          `nested: false` the place is where the ejected thread goes. A thread nested under another is not pinned and
          not placed: **422** `nested_row` (eject it first, or give `nested: false` with the place).

        Changing a row to the state it already has is a 200 that writes nothing. Two arrangements at once may leave two
        threads of one place: they are ordered newest first, and nothing errors. It needs the thread to be the caller's
        and `thread.read`, **not `thread.write`**: it changes nothing in the conversation and nobody else sees it, the
        way taking a share down needs only ownership. Another person's thread is a **404** indistinguishable from one
        that does not exist, whatever the caller's roles.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadArrangement" }
      responses:
        "401": { $ref: "#/components/responses/Problem" }
        "200":
          description: The thread as it is now, with `pinned`, `archived` and `nestedUnder` where they hold
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
        "400": { description: "A body that is not an object, with none of the members, with a member this API does not know, or with a value that is not of the member's type (a `place` that is not `top`, `before` or `after` an id, an id that is not a thread id)", $ref: "#/components/responses/Problem" }
        "403": { description: "No role of the caller holds `thread.read` (`code: forbidden`), or their roles grant nothing (`code: no_access`)", $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { description: "`code: bad_anchor`: the thread to place it by is gone, archived, nested under another, another person's or the thread itself. `code: nested_row`: a thread nested under another cannot be pinned or placed without being ejected. And, with no code, `nested: true`", $ref: "#/components/responses/Problem" }
  /api/threads/{threadId}/tools:
    parameters: [ { $ref: "#/components/parameters/ThreadId" } ]
    put:
      operationId: putThreadTools
      summary: Set the MCP servers attached to a thread
      description: |
        Sets the whole set of [MCP servers attached to the thread](../decisions/0024-mcp-tools-attached-per-conversation.md),
        in any state of the thread, finished ones included (a thread is a conversation: the set applies to the next message
        sent to the agent). `servers` lists the ids, from `listToolServers`, that should be attached afterwards. What differs
        from what the thread has is logged as a `tools_attached` and a `tools_detached` event (attributed to the person); the
        same set writes nothing and is still a 200, so the call is idempotent. The agent is told the attached servers it may
        use (`attached` of the [`thread-tools/v1`](thread-tools-v1.md#the-attached-member) message) and finds their tools on
        the thread's endpoint; an agent whose card does not list `thread-tools/v1` gets nothing, which a client says before the
        person sends (the capabilities document).

        Anyone who may act on the thread (`thread.write`) may attach, the servers the deployment offers for the thread's agent
        (their `agents`). A server the thread has already is not checked again: a deployment that stopped listing it leaves the
        thread its attachment, and a person can detach it. A thread that is not the caller's is a **404** indistinguishable from
        one that does not exist, whatever their roles.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadToolsRequest" }
      responses:
        "401": { $ref: "#/components/responses/Problem" }
        "200":
          description: The set after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadTools" }
        "400": { description: "A body that is not exactly an object with a `servers` array of strings, or an id that is not `^[a-z0-9][a-z0-9-]{0,30}$`", $ref: "#/components/responses/Problem" }
        "403": { description: "No role of theirs holds `thread.write`, or their roles grant nothing", $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { description: "A server the deployment does not list, or does not offer for the thread's agent, or more than 16 servers; the detail names the server's id, never a URL", $ref: "#/components/responses/Problem" }
  /api/threads/{threadId}/export:
    parameters: [ { $ref: "#/components/parameters/ThreadId" } ]
    get:
      operationId: exportThread
      summary: The whole thread as one JSON file, to share with a developer
      description: |
        Everything the orchestrator holds about the thread, as a versioned `ThreadExport`
        document: the thread, its full job ledger (the gate, the attempt, the pushed commit, what
        each source said), the agent binding and the complete event log. Every card and line of
        the chat is derived from that log. Authorised exactly like `getThread` (`thread.read`): a thread
        the caller may not read is a 404 indistinguishable from one that does not exist.

        The response is an attachment (`Content-Disposition: attachment;
        filename="thread-<id>.json"`) and is never cached. It contains what the people and the
        agents wrote in the thread (messages, artifacts, findings, CI summaries) and the owner's
        e-mail address (`thread.owner`, and the `actor` of the owner's messages); it holds no credential the
        orchestrator uses (no bearer token, webhook secret or database URL is ever in the log).
        Read it before sharing it: a person can paste anything into a chat.
      responses:
        "401": { $ref: "#/components/responses/Problem" }
        "200":
          description: The thread export
          headers:
            Content-Disposition: { description: "`attachment; filename=\"thread-<id>.json\"`", schema: { type: string } }
            Cache-Control: { description: "`no-store`", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadExport" }
        "403": { description: "No role of the caller holds `thread.read`, or their roles grant nothing", $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/threads/{threadId}/cancel:
    parameters: [ { $ref: "#/components/parameters/ThreadId" } ]
    post:
      operationId: cancelThread
      summary: Cancel the thread's running work (A2A tasks/cancel on the target)
      responses:
        "401": { $ref: "#/components/responses/Problem" }
        "202": { description: Cancellation requested; the outcome arrives as events }
        "403": { description: "No role of theirs holds `thread.write`, or their roles grant nothing", $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/threads/{threadId}/fork:
    parameters: [ { $ref: "#/components/parameters/ThreadId" } ]
    post:
      operationId: forkThread
      summary: Fork a thread from a point, or branch it by editing a message
      description: |
        Makes a new thread that begins as a copy of this one ([ADR 0029](../decisions/0029-forking-a-thread-copies-its-log.md)):
        the parent's events up to a cut, with the same `seq`, then a `thread_forked` event, then the new thread's own.
        The parent is not changed. The fork has its own A2A context, the parent's title (a person's rename of the
        parent stays theirs in the fork), the deployment's gate for its agent, and the same owner.

        * `after` (a `seq`): **fork from here**. The cut is the end of the turn that holds that event: the last event
          before the next message or action of a person, or the end of the log. The fork is `done`, a finished job:
          its next message starts the next job and is sent to its agent with the earlier conversation in front of it.
          A turn that is still going on (the thread is `queued`, `working` or `verifying`, and nothing follows the
          event) cannot be copied: 409, `code: turn_open`. With `target`, this is also "continue with another agent".
        * `after` with `text` (and `messageId`): the fork **is made with its first message**
          ([ADR 0042](../decisions/0042-the-thread-list-is-the-owners.md), decision 8). The copy, `thread_forked`, the message and
          the next job's start are one transaction, as for a new thread, so the fork is `queued` at once and its agent is told
          the conversation it continues together with the message; nothing exists if any part is refused. This route carries
          no mentions and no UI catalog: the AG-UI run (`runAgent`, `forwardedProps["vymalo.fork"]`) does, and is what the
          web sends. A repeat with the same `id`, the same `after` and the same message answers the fork it made (200) and
          writes no second message; the same `id` with another message or cut is a 409.
        * `replace` (the `seq` of a person's message) with the new `text`: **edit**. The cut is the event before that
          message, which may be 0; the fork then holds the new message, the next job's start and its delegation to
          the agent, and is `queued`. The thread is a branch of the one it was made from: it is left out of
          `listThreads` unless asked for, and `listBranches` finds its siblings. A conversation holds at most 256
          threads, its first thread and the threads made from it this way: the 256th edit is a 409.

        `target` names the agent and release the fork talks to (the parent's when absent), validated as for a new
        thread. `id` is a UUID the caller chose for the new thread: a repeat of the request with the same `id` answers
        the fork it made (200) and writes nothing; the id of another thread is a 409. The caller's own threads only;
        someone else's is a 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForkRequest" }
      responses:
        "401": { $ref: "#/components/responses/Problem" }
        "201":
          description: The fork
          headers:
            Location: { description: "`/api/threads/<id>`", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
        "200":
          description: The fork this request's `id` named, made by an earlier request
          headers:
            Location: { description: "`/api/threads/<id>`", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
        "400": { description: "The body is not JSON or not a `ForkRequest`: both or neither of `after` and `replace`, `messageId` without `text`, `replace` without `text`, an empty or too long text, a `messageId` longer than 256 bytes, an unknown agent or release, an unknown member, a thread that is too long to fork", $ref: "#/components/responses/Problem" }
        "403": { description: "No role of theirs holds `thread.write`, or their roles do not name the target agent (`agent.invoke`)", $ref: "#/components/responses/Problem" }
        "404": { description: "The thread is missing, its id is not a UUID, or the caller may not read it (one answer for all three)", $ref: "#/components/responses/Problem" }
        "409": { description: "`code: turn_open`: the turn to copy is still going on, try again when it has ended; or `id` is another thread's (for `after` with `text`: any thread but the fork this very request made), or the conversation has 256 branches already", $ref: "#/components/responses/Problem" }
        "422": { description: "`after` or `replace` is not an event of the thread, or `replace` is not a message of a person", $ref: "#/components/responses/Problem" }
        "502": { description: "The target agent could not be reached to validate the release", $ref: "#/components/responses/Problem" }
        "503": { description: "Storage is unavailable, or the agent registry cannot say whether the target exists; retry after the number of seconds in the Retry-After header", $ref: "#/components/responses/Problem" }
  /api/threads/{threadId}/branches:
    parameters: [ { $ref: "#/components/parameters/ThreadId" } ]
    get:
      operationId: listBranches
      summary: The messages of a thread that have other versions
      description: |
        The conversation this thread is a branch of ([ADR 0029](../decisions/0029-forking-a-thread-copies-its-log.md)):
        threads made from one another by an edit of a message. `points` are the messages **of this thread** that have
        other versions, in the order they come, each with every version (the original first, then the edits in the
        order they were made) and which of them is this thread's, so that a client can show `‹ 2 / 3 ›` under the
        message and move between the threads. Everything of a thread up to its cut is its parent's, so it shows the
        parent's versions there. A thread made by "fork from here" is not a version of anything: it starts a
        conversation of its own. `root` is the thread the conversation started from. A thread that was never
        edited has no points. Authorised like `getThread`.
      responses:
        "401": { $ref: "#/components/responses/Problem" }
        "200":
          description: The branches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branches" }
        "403": { description: "No role of the caller holds `thread.read`, or their roles grant nothing", $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/threads/{threadId}/artifacts/{sha256}:
    parameters:
      - { $ref: "#/components/parameters/ThreadId" }
      - { $ref: "#/components/parameters/Sha256" }
    get:
      operationId: getArtifact
      summary: A file an agent handed over, from the artifact store
      description: |
        The content of a file of the thread ([ADR 0032](../decisions/0032-files-from-agents-live-in-an-artifact-store.md)):
        the `file` of an `artifact` event, `href` of the projected artifact. `sha256` is the content's hash in 64
        lowercase hexadecimal digits, and the file belongs to the thread in the path: no thread reaches another's by
        hash. Authorised by the permission `artifact.read` ([ADR 0033](../decisions/0033-the-orchestrator-is-an-oauth2-resource-server.md))
        over the thread: the thread's owner, and nobody else ([ADR 0039](../decisions/0039-nobody-reads-another-persons-thread.md)).
        Another person's thread, a thread that does not exist, a hash the thread holds no
        file for, a hash that is not 64 lowercase hex digits and a deployment with no artifact store are all the same 404;
        a caller whose roles hold no `artifact.read` gets a 403 (`code: forbidden`), whatever they ask for.

        The body is **streamed** from the store. `Content-Type` is the type the worker kept (it sniffed it: an image
        whose bytes disagree with its declared type is `application/octet-stream`).

        * **Inline** (no `download`, or `download=0`): only for the preview types, `image/png`, `image/jpeg`,
          `image/gif`, `image/webp`, `image/svg+xml`, `text/plain` and `application/json` (the last two with
          `; charset=utf-8`), with `Content-Disposition: inline; filename="…"`. An SVG is **sanitized** first
          (`orch-svg-clean`: no script, no `foreignObject`, no external reference, no event handler); one that is larger
          than 2 MiB or cannot be sanitized is sent as an attachment instead. **Every other type is an attachment
          only.**
        * **Download** (`download=1`): `Content-Disposition: attachment; filename="…"`, the original bytes. The file
          name is the agent's, cleaned: one name with no path, no control or direction character, a printable ASCII
          fallback in `filename` and the real name as `filename*=UTF-8''…` (RFC 6266, RFC 5987); a file without a
          usable name is `artifact-<8 hex digits of the hash>`.

        Every response, inline or not, carries `X-Content-Type-Options: nosniff`, `Content-Security-Policy:
        default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox`, `Cache-Control: private,
        max-age=31536000, immutable` (the URL is the content's hash) and `ETag: "<sha256>"`.
      parameters:
        - name: download
          in: query
          required: false
          description: "`1` (or `true`) sends the file as an attachment; `0`, `false` or absent shows a preview type inline. Any other value is a 400."
          schema: { type: string, enum: ["0", "1", "false", "true"] }
      responses:
        "401": { $ref: "#/components/responses/Problem" }
        "200":
          description: The file
          headers:
            Content-Type: { description: "The kept media type", schema: { type: string } }
            Content-Length: { description: "The size in bytes (the sanitized size for an inline SVG)", schema: { type: integer } }
            Content-Disposition: { description: "`inline; filename=\"…\"` or `attachment; filename=\"…\"`, with `filename*` for a name that is not ASCII", schema: { type: string } }
            X-Content-Type-Options: { description: "`nosniff`", schema: { type: string } }
            Content-Security-Policy: { description: "`default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox`", schema: { type: string } }
            Cache-Control: { description: "`private, max-age=31536000, immutable`", schema: { type: string } }
            ETag: { description: "`\"<sha256>\"`", schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { description: "No role of the caller holds `artifact.read`, or their roles grant nothing", $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/threads/{threadId}/share:
    parameters: [ { $ref: "#/components/parameters/ThreadId" } ]
    put:
      operationId: shareThread
      summary: Share a thread by a link, or change who may read it
      description: |
        Shares one of the caller's threads ([ADR 0040](../decisions/0040-thread-sharing-by-revocable-link.md)): `internal`
        (signed-in people who have the link) or `public` (anybody who has it), read-only for them. A first share draws a
        nonce; a widening or a narrowing keeps it, so the link is the same. The same `visibility` as the thread has is
        the current link and writes nothing. Logged as a `thread_shared` event, in the commit that sets the thread's row.
        Needs `thread.share`, over the caller's own thread, within the deployment's cap (`sharing.mode`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadShareRequest" }
      responses:
        "200":
          description: The link
          headers: { Cache-Control: { description: "`no-store`", schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadShareLink" }
        "400": { description: "The body is not exactly `{visibility}`, or `visibility` is not `internal` or `public` (`private` included: stop sharing with `unshareThread`)", $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "No role of the caller holds `thread.share` (`code: forbidden`), or the deployment's cap is `disabled` (`code: sharing_disabled`)", $ref: "#/components/responses/Problem" }
        "404": { description: "The thread is missing, its id is not a UUID, or it is not the caller's (one answer for all three, an administrator's included)", $ref: "#/components/responses/Problem" }
        "409": { description: "`code: over_cap`: `visibility` is above the deployment's cap (`public` under `internal`)", $ref: "#/components/responses/Problem" }
    delete:
      operationId: unshareThread
      summary: Take a link down
      description: |
        Stops sharing: the thread is private again, the nonce is gone, so the old link is a 404 from that moment and a
        stream open on it ends; sharing again makes a new link, a revoked one never comes back. Logged as a
        `thread_unshared` event. **Needs only ownership**: it is never refused for the deployment's cap or for a missing
        `thread.share`, so an owner can always take a link down. A thread that is not shared is left as it is: 204.
      responses:
        "204": { description: "The thread is private" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { description: "The thread is missing, its id is not a UUID, or it is not the caller's", $ref: "#/components/responses/Problem" }
  /api/threads/{threadId}/share/rotate:
    parameters: [ { $ref: "#/components/parameters/ThreadId" } ]
    post:
      operationId: rotateThreadShare
      summary: A new link for a shared thread
      description: |
        Draws a new nonce, so the old link is a 404 from now on and the thread stays shared at the visibility it had
        ([ADR 0040](../decisions/0040-thread-sharing-by-revocable-link.md)). Logged as a `thread_shared` event with a new
        `nonce_sha256`. Needs `thread.share`, over the caller's own thread.
      responses:
        "200":
          description: The new link
          headers: { Cache-Control: { description: "`no-store`", schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadShareLink" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "No role of the caller holds `thread.share` (`code: forbidden`), or the cap is `disabled` (`code: sharing_disabled`)", $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: "`code: not_shared`: the thread is private; share it first", $ref: "#/components/responses/Problem" }
  /api/shared/{token}:
    parameters: [ { $ref: "#/components/parameters/ShareToken" } ]
    get:
      operationId: getSharedThread
      summary: A shared thread, for a signed-in reader
      description: |
        The thread a link names, as a **signed-in** person is given it ([ADR 0040](../decisions/0040-thread-sharing-by-revocable-link.md)):
        the reader projection, with no owner, no parent and no tools. Served when the thread is effectively `internal` or
        `public`. Needs `thread.read` at any scope (the link is the grant): no role, `admin` included, reads a thread
        through it that the link does not name, and a reader acts on nothing. The thread's events come by
        `connectSharedThread`. A reader who is the thread's owner is told so (`isOwner`). Never cached.
      responses:
        "200":
          description: The shared thread
          headers:
            Cache-Control: { description: "`no-store`", schema: { type: string } }
            X-Robots-Tag: { description: "`noindex, nofollow`", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedThread" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "No role of the caller holds `thread.read`, or their roles grant nothing", $ref: "#/components/responses/Problem" }
        "404": { description: "**Every** way a link can fail: an unknown or malformed token, a bad MAC, a private or revoked thread, a cap that was lowered. One answer, one body", $ref: "#/components/responses/Problem" }
  /api/shared/{token}/artifacts/{sha256}:
    parameters:
      - { $ref: "#/components/parameters/ShareToken" }
      - { $ref: "#/components/parameters/Sha256" }
    get:
      operationId: getSharedArtifact
      summary: A file of a shared thread, for a signed-in reader
      description: |
        A file of the thread a link names ([ADR 0040](../decisions/0040-thread-sharing-by-revocable-link.md)): needs
        `artifact.read` as well as `thread.read`, and the file must be one **the thread's own log names**, found among the
        newest 1000 `artifact` events of the thread (a file named only by an older one is the same 404 through a link; the
        owner's `getArtifact` still serves it). Sent as
        `getArtifact` sends a file (sanitised SVG, `nosniff`, the sandboxing `Content-Security-Policy`, an attachment unless
        it is a preview type) except that it is **`Cache-Control: no-store`**, not the immutable cache of the owner's files, so
        a revoked file is not kept by the reader's browser.
      parameters:
        - name: download
          in: query
          required: false
          schema: { type: string, enum: ["0", "1", "false", "true"] }
      responses:
        "200":
          description: The file
          headers:
            Cache-Control: { description: "`no-store`", schema: { type: string } }
            X-Content-Type-Options: { description: "`nosniff`", schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "No role of the caller holds `artifact.read` or `thread.read`", $ref: "#/components/responses/Problem" }
        "404": { description: "Every way a link or a file can fail: the same answer as `getSharedThread`, and a file the thread's log does not name among its newest 1000 `artifact` events", $ref: "#/components/responses/Problem" }
  /api/public/auth:
    get:
      operationId: getPublicAuth
      summary: Where a browser signs in
      description: |
        What the web needs to sign a person in by itself ([ADR 0054](../decisions/0054-the-web-holds-its-own-tokens-dpop-bound-in-indexeddb.md),
        decision 7): the token issuer, the web's public OAuth client at it, and the scope to ask for. The orchestrator says it
        (`auth.browser`, and `auth.jwt.issuer`), so that a static export of the web needs no configuration of its own. **Outside
        the identity layer**: no credential is read (an `Authorization` header is ignored), because the person is not signed in
        yet; behind the same rate limit as the other public routes. A **404** when the deployment has not configured it, which the
        web reads as "the edge's cookie signs people in", as before. Nothing in the answer is secret: a public client has none.
        `Cache-Control: no-store`.
      security: []
      responses:
        "200":
          description: Where to sign in
          headers:
            Cache-Control: { description: "`no-store`", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserAuth" }
        "404": { description: "This deployment does not configure browser sign-in (`auth.browser` is absent)", $ref: "#/components/responses/Problem" }
        "429": { description: "Too many requests; `Retry-After` says when to try again", $ref: "#/components/responses/Problem" }
  /api/public/shared/{token}:
    parameters: [ { $ref: "#/components/parameters/ShareToken" } ]
    get:
      operationId: getPublicSharedThread
      summary: A public shared thread, for anybody
      description: |
        The thread a link names, for **anybody** ([ADR 0040](../decisions/0040-thread-sharing-by-revocable-link.md)): no
        identity, no cookie, and an `Authorization` or identity header is **ignored** (the orchestrator does not run the
        authenticator here, and the edge strips them). Served only when the thread is effectively `public`; an `internal`
        link is a 404. It is the reader projection of a public reader: step input and output and files are not in what
        follows unless the deployment's `sharing.public` says so, and the owner's address never is. Rate limited
        per link and in all (a 404 costs the shared bucket more, so guessing tokens is throttled): 429 with
        `Retry-After`. `Cache-Control: no-store`, `X-Robots-Tag: noindex, nofollow`.
      security: []
      responses:
        "200":
          description: The shared thread
          headers:
            Cache-Control: { description: "`no-store`", schema: { type: string } }
            X-Robots-Tag: { description: "`noindex, nofollow`", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedThread" }
        "404": { description: "Every way a link can fail, with the same body as `getSharedThread`'s 404", $ref: "#/components/responses/Problem" }
        "429": { description: "Too many requests for this link or for all links; `Retry-After` says when to try again", $ref: "#/components/responses/Problem" }
  /api/public/shared/{token}/artifacts/{sha256}:
    parameters:
      - { $ref: "#/components/parameters/ShareToken" }
      - { $ref: "#/components/parameters/Sha256" }
    get:
      operationId: getPublicSharedArtifact
      summary: A file of a public shared thread, for anybody
      description: |
        As `getSharedArtifact`, for anybody, and **only when `sharing.public.files` is on** (otherwise the one 404). The file
        must be one the thread's log names, among its newest 1000 `artifact` events. `Cache-Control: no-store`.
      security: []
      parameters:
        - name: download
          in: query
          required: false
          schema: { type: string, enum: ["0", "1", "false", "true"] }
      responses:
        "200":
          description: The file
          headers:
            Cache-Control: { description: "`no-store`", schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { description: "Too many requests; `Retry-After` says when to try again", $ref: "#/components/responses/Problem" }
  /agui/agents/{agentId}:
    parameters: [ { $ref: "#/components/parameters/AgentId" } ]
    post:
      operationId: runAgent
      summary: Run an agent (AG-UI 1.0 HTTP + SSE binding)
      description: |
        The standard AG-UI run endpoint ([ADR 0012](../decisions/0012-ag-ui-user-facing-protocol.md),
        [`agui.md`](agui.md#run-binding)). Creates a thread (the consumer mints `threadId`, a UUID),
        sends a message, answers an interrupt (`resume`), sends the user's action on an A2UI surface
        (`forwardedProps.a2uiAction.userAction`, [ADR 0013](../decisions/0013-a2ui-generative-ui.md))
        or attaches to a run already in the log (a retry with the same `runId`). The response streams the AG-UI events of that run, from
        `RUN_STARTED` to `RUN_FINISHED` or `RUN_ERROR`, then ends; closing it never cancels the run.

        A run whose `threadId` names no thread may create it **as a fork** with `forwardedProps["vymalo.fork"]`
        = `{from, after}` ([ADR 0042](../decisions/0042-the-thread-list-is-the-owners.md), decisions 8 and 9,
        [`agui.md`](agui.md#a-fork-made-with-its-first-message)): the parent's events up to the end of the turn that holds
        `after`, `thread_forked` and the run's message are one transaction, and the response is the run that message
        opens, from its `RUN_STARTED`, nothing of the copied turns. It needs `thread.write` on `from` (the caller's
        own thread, else 404) and `agent.invoke` on the run's `agentId`, which may be another agent than the parent's;
        `vymalo.mentions` and `vymalo.uiCatalog` apply to the message, and it is a 400 together with `vymalo.gate` or
        `vymalo.tools` (a fork has the deployment's gate and its parent's tools). The member is read on a run that
        creates the thread; a thread that exists already answers it only when it is the fork the same request made
        (the same `from`, `after` and `runId`, the same person's): the replay, which attaches to the run and writes
        nothing, so a resend after a lost response is safe. Any other existing thread is a 409.

        Every rejection is decided before the first stream byte and is a problem response; nothing
        was written. Cancel a run with `cancelThread`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgUiRunAgentInput" }
      responses:
        "200":
          description: The run's events (`text/event-stream`); frames carry `id:` on resume points
          content:
            text/event-stream:
              schema: { type: string }
              x-itemSchema: { $ref: "#/components/schemas/AgUiSseFrame" }
        "400": { description: "The body is not JSON or not a `RunAgentInput`; `threadId` is not a UUID; `protocolVersion` names another major; an id is longer than 256 bytes; an unknown release, or an agent without releases asked for one; a `forwardedProps[\"vymalo.gate\"]` (the verification gate, [`agui.md`](agui.md#verification-the-gate)) that is malformed, removes a required source, asks for attempts outside the deployment's cap, or needs what the build does not honour yet; a `forwardedProps[\"vymalo.send\"]` that is not `steer` or `interrupt`; a `forwardedProps[\"vymalo.fork\"]` that is not exactly `{from: <thread UUID>, after: <integer>}`, or that comes with `vymalo.gate` or `vymalo.tools`", $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "The caller's roles do not hold `thread.write`, or do not name the agent (`agent.invoke`)", $ref: "#/components/responses/Problem" }
        "404": { description: "The agent is not listed (by the deployment's own list or by the registry, which answered without it), or the thread belongs to someone else (whatever the caller's roles; indistinguishable from one that does not exist, including a minted id that collides with another owner's thread); for a `vymalo.fork`, the thread to fork (`from`) is not the caller's or does not exist", $ref: "#/components/responses/Problem" }
        "406": { description: "`Accept` does not admit `text/event-stream`", $ref: "#/components/responses/Problem" }
        "409": { description: "`code: turn_open`: the turn a `vymalo.fork` would copy is still going on, try again when it has ended; a `vymalo.fork` on a thread that exists and is not the fork this request made. Or: the thread targets another agent, a run is already open on it and the run is not one new message that says how it is delivered (`forwardedProps[\"vymalo.send\"]`: `steer` or `interrupt`, [ADR 0036](../decisions/0036-sending-while-an-agent-works.md), [`agui.md`](agui.md#sending-while-an-agent-works)), the run carries an A2UI action for a finished thread (`done`, `failed`, `cancelled`; a **message** on a finished thread is served and starts the thread's next job, ADR 0020), or the run continues the thread and asks for a verification gate different from the thread's (a thread's gate is fixed when it is created)", $ref: "#/components/responses/Problem" }
        "413": { description: "The body is larger than 8 MiB, or an A2UI action's `name`, `surfaceId` or `sourceComponentId` is longer than 256 bytes or its `context` larger than 16 KiB", $ref: "#/components/responses/Problem" }
        "415": { description: "`Content-Type` is not `application/json`", $ref: "#/components/responses/Problem" }
        "422": { description: "A `vymalo.fork` whose `after` is not an event of the parent, or whose mentions or UI catalog do not hold; nothing to run; more than one new message; a new message that is not from the user or has no text; a `resume` payload without `text`; a `resume` answer together with a new message; a reused `runId`; an A2UI action that is malformed, names a surface the thread does not have, or comes with a message, an answer or a cancellation", $ref: "#/components/responses/Problem" }
        "502": { description: "The target agent could not be reached to validate the release (its live card is unavailable, or the agent refused the card request)", $ref: "#/components/responses/Problem" }
        "503": { description: "Storage is unavailable, the thread is contended, the target agent is rate limiting, or the agent registry cannot say whether the agent exists (\"the agent registry is unreachable\", ADR 0022); retry after the number of seconds in the Retry-After header", $ref: "#/components/responses/Problem" }
  /agui/threads/{threadId}/connect:
    parameters: [ { $ref: "#/components/parameters/ThreadId" } ]
    get:
      operationId: connectThread
      summary: Follow a thread (AG-UI, our connect extension)
      description: |
        Our documented extension of the AG-UI transport ([`agui.md`](agui.md#connect-binding)):
        replay the thread's events as AG-UI runs, then follow it live across runs, with keepalive
        comments at least every 15 s. `Last-Event-ID` (the `id:` of the last frame the client
        holds, a log `seq`) resumes after that point on any replica; absent or empty replays the
        whole thread. A cursor beyond the last seq waits for new events. `mode=run` closes the
        stream after the active run's terminal event, or right after the replay when no run is open.
        Closing the stream never cancels a run.
      parameters:
        - { name: Last-Event-ID, in: header, description: "Resume after this seq: the id of the last frame the client holds", schema: { type: string, pattern: "^[0-9]*$" } }
        - { name: mode, in: query, description: "`run`: close after the active run; absent: stay open", schema: { type: string, enum: [run] } }
      responses:
        "200":
          description: The thread's events (`text/event-stream`); frames carry `id:` on resume points
          content:
            text/event-stream:
              schema: { type: string }
              x-itemSchema: { $ref: "#/components/schemas/AgUiSseFrame" }
        "400": { description: "`Last-Event-ID` is not a non-negative integer, or `mode` is not `run`", $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "No role of the caller holds `thread.read`, or their roles grant nothing", $ref: "#/components/responses/Problem" }
        "404": { description: "The thread does not exist for the caller: it is missing, its id is not a UUID, or it is someone else's (one answer for all three, whatever the caller's roles)", $ref: "#/components/responses/Problem" }
        "406": { description: "`Accept` excludes `text/event-stream`", $ref: "#/components/responses/Problem" }
        "503": { description: "Storage is unavailable; retry after the number of seconds in the Retry-After header", $ref: "#/components/responses/Problem" }
  /agui/shared/{token}/connect:
    parameters: [ { $ref: "#/components/parameters/ShareToken" } ]
    get:
      operationId: connectSharedThread
      summary: Follow a shared thread, read-only (AG-UI), for a signed-in reader
      description: |
        `connectThread` for a thread a link names ([ADR 0040](../decisions/0040-thread-sharing-by-revocable-link.md),
        [`agui.md`](agui.md#reading-a-shared-thread)): the connect stream over the reader projection, replayed from the
        start or from `Last-Event-ID` and then followed, so what the owner writes after sharing is shown too. It
        starts no run and takes no input. **The stream ends** when the link is taken down, replaced by a new one, or
        narrowed below `internal`, and at the token's expiry (an hour at most); the client's reconnect then gets the 404.
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string, pattern: "^[0-9]*$" } }
        - { name: mode, in: query, schema: { type: string, enum: [run] } }
      responses:
        "200":
          description: "The shared thread's events (`text/event-stream`), `Cache-Control: no-store, no-transform`"
          content:
            text/event-stream:
              schema: { type: string }
              x-itemSchema: { $ref: "#/components/schemas/AgUiSseFrame" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "No role of the caller holds `thread.read`", $ref: "#/components/responses/Problem" }
        "404": { description: "Every way a link can fail (the same answer as `getSharedThread`)", $ref: "#/components/responses/Problem" }
        "406": { $ref: "#/components/responses/Problem" }
  /agui/public/shared/{token}/connect:
    parameters: [ { $ref: "#/components/parameters/ShareToken" } ]
    get:
      operationId: connectPublicSharedThread
      summary: Follow a public shared thread, read-only (AG-UI), for anybody
      description: |
        `connectSharedThread` for **anybody**, outside the identity layer, for a thread served as `public`, over the public
        projection. Rate limited like `getPublicSharedThread`, and each open stream holds one of the link's stream
        permits (5 per link and 50 in all, by default): 429 when they are taken. At most an hour, like any stream.
      security: []
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string, pattern: "^[0-9]*$" } }
        - { name: mode, in: query, schema: { type: string, enum: [run] } }
      responses:
        "200":
          description: The shared thread's events (`text/event-stream`)
          content:
            text/event-stream:
              schema: { type: string }
              x-itemSchema: { $ref: "#/components/schemas/AgUiSseFrame" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "406": { $ref: "#/components/responses/Problem" }
        "429": { description: "Too many requests, or too many open streams, for this link or for all links", $ref: "#/components/responses/Problem" }
  /agui/agents/{agentId}/capabilities:
    parameters: [ { $ref: "#/components/parameters/AgentId" } ]
    get:
      operationId: getAgentCapabilities
      summary: What an agent can do (AG-UI AgentCapabilities)
      description: |
        The shape is the spec's `AgentCapabilities`; retrieval is ours ([`agui.md`](agui.md#capabilities-document)).
        The agent card is read on every request and never cached (ADR 0008); a card that cannot be read
        in time gives the smaller document (identity with the name only, no `custom`).
      responses:
        "200":
          description: Capabilities
          headers: { Cache-Control: { description: "`no-store`", schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgUiAgentCapabilities" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { description: "The caller's roles do not name the agent for `agent.read`, or grant nothing", $ref: "#/components/responses/Problem" }
        "404": { description: "The agent is not listed (the registry answered without it)", $ref: "#/components/responses/Problem" }
        "503": { description: "The agent registry cannot say whether the agent exists (\"the agent registry is unreachable\", ADR 0022); retry after the number of seconds in the Retry-After header", $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A JWT signed by the configured issuer (RS256, RS384, ES256 or EdDSA), with the configured audience.
        Read when `auth.mode` is `jwt` or `jwt_or_proxy_header`. A missing or refused token gets 401 with
        `WWW-Authenticate: Bearer`; an issuer whose keys cannot be fetched gets 503.
    dpopToken:
      type: http
      scheme: DPoP
      description: >
        A JWT as `bearerToken`, bound to the key of the client (`cnf.jkt`, RFC 7638), sent as `Authorization: DPoP <token>`
        with one `DPoP` header holding a proof signed by that key (RFC 9449, [ADR 0054](../decisions/0054-the-web-holds-its-own-tokens-dpop-bound-in-indexeddb.md)).
        Read only when `auth.dpop` is configured. A bad proof gets 401 with `WWW-Authenticate: DPoP error="invalid_dpop_proof", algs="ES256 EdDSA"`,
        a bad or unbound token `error="invalid_token"`.
    proxyIdentity:
      type: apiKey
      in: header
      name: X-Auth-Request-Email
      description: >
        Set by oauth2-proxy after OIDC login; requests without it get 401. Read when `auth.mode` is
        `proxy_header` (the default) or `jwt_or_proxy_header` without a bearer token.
  parameters:
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Sha256:
      name: sha256
      in: path
      required: true
      description: "The SHA-256 of a file's content, 64 lowercase hexadecimal digits (`ArtifactFile.sha256`)"
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    ShareToken:
      name: token
      in: path
      required: true
      description: "The token of a share link: 43 characters of the unpadded base64url alphabet, `nonce || MAC` ([ADR 0040](../decisions/0040-thread-sharing-by-revocable-link.md)). Anything else is the one 404"
      schema: { type: string }
    AgentId:
      name: agentId
      in: path
      required: true
      description: Configuration key of the agent, as listed by `listAgents` (`Agent.id`)
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              code:
                type: string
                description: "A stable name for the problem, where a client acts on one: `turn_open` (`forkThread`, and `runAgent` with `vymalo.fork`: try again when the turn has ended); `forbidden` (403: the caller's roles lack the permission); `no_access` (403: the caller's roles grant nothing at all); `sharing_disabled` (403, `shareThread` and `rotateThreadShare`: the deployment's cap is `disabled`); `over_cap` (409, `shareThread`: above the deployment's cap); `not_shared` (409, `rotateThreadShare`: the thread is private); `bad_anchor` and `nested_row` (422, `arrangeThread`: the thread to place it by cannot be one; a nested thread cannot be pinned or placed); `thread_active` (409, `deleteThread`: the thread works, stop it first); `too_many_streams` (429: the public streams of a link, or of all links, are taken)"
  schemas:
    BrowserAuth:
      type: object
      required: [issuer, clientId, scope]
      description: "What a browser signs in with ([ADR 0054](../decisions/0054-the-web-holds-its-own-tokens-dpop-bound-in-indexeddb.md))"
      properties:
        issuer: { type: string, description: "The token issuer, as its tokens say it in `iss` (`auth.jwt.issuer`): its discovery document is at `<issuer>/.well-known/openid-configuration`" }
        clientId: { type: string, description: "The web's OAuth client at the issuer, a public client with no secret (`auth.browser.clientId`)" }
        scope: { type: string, description: "The scope to ask for, tokens separated by single spaces (`auth.browser.scope`, default `openid email profile offline_access`)" }
    Me:
      type: object
      required: [user, roles, permissions, agents]
      properties:
        sharing:
          type: string
          enum: [disabled, internal, public]
          description: "What the deployment lets this person share their threads as ([ADR 0040](../decisions/0040-thread-sharing-by-revocable-link.md)): the cap (`sharing.mode`) when their roles hold `thread.share`, else `disabled`. A hint for the screen, never a check. Always sent by an orchestrator that has sharing; absent from one that has not, which a client reads as `disabled`"
        user: { type: string, description: "The key of everything the person owns: the e-mail, trimmed and lower-cased ([ADR 0033](../decisions/0033-the-orchestrator-is-an-oauth2-resource-server.md))" }
        email: { type: string, description: "The e-mail address the credential says, as it wrote it; absent when it says none" }
        name: { type: string, description: "The display name the credential says; absent when it says none" }
        roles:
          type: array
          items: { type: string }
          description: "The roles that count, sorted: the roles of the credential that `auth.roles` defines, or `auth.defaultRole` when it carries none of them. Empty when nothing is granted"
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
          description: "What the roles grant, in the order `agent.read`, `agent.invoke`, `thread.read`, `thread.write`, `artifact.read`, `admin`"
        agents: { $ref: "#/components/schemas/MeAgents" }
    Permission:
      type: object
      required: [permission]
      properties:
        permission: { type: string, enum: [agent.read, agent.invoke, thread.read, thread.write, thread.share, thread.delete, artifact.read, admin] }
        scope:
          type: string
          enum: [own]
          description: "How far a permission over threads reaches (`thread.read`, `thread.write`, `artifact.read`): `own`, the person's own threads, for every role and the only scope there is ([ADR 0039](../decisions/0039-nobody-reads-another-persons-thread.md)). Absent for `agent.*`, `thread.share` and `thread.delete` (which take no scope: they are over one's own thread) and `admin`"
    MeAgents:
      type: object
      required: [read, invoke]
      description: "The agents each agent permission is about"
      properties:
        read: { type: array, items: { type: string }, description: "Agent ids, or `[\"*\"]` for every agent; empty when no role holds `agent.read`" }
        invoke: { type: array, items: { type: string }, description: "Agent ids, or `[\"*\"]` for every agent; empty when no role holds `agent.invoke`" }
    Agent:
      type: object
      required: [id, name]
      properties:
        id: { type: string, description: "The agent's id: its configuration key or its registry service id, e.g. coder" }
        name: { type: string }
        description: { type: string }
        source:
          type: string
          enum: [static, registry]
          description: |
            Where the agent is listed from: `static` (the deployment's own list) or `registry` (the
            platform's agent registry). Always sent; a client that reads an orchestrator from before
            the registry treats an absent value as `static`.
        tags:
          type: array
          items: { type: string }
          description: |
            Labels the registry keeps on the agent, for a client to show and to filter by; they route,
            authorise and select nothing. Omitted when there are none (a static agent has none).
        cardUrl:
          type: string
          format: uri
          description: URL of the agent card; absent for an agent hosted in the orchestrator's own process
        releases:
          description: Present only when the card advertises the release-channels extension
          type: object
          required: [defaultChannel, channels]
          properties:
            defaultChannel: { type: string }
            channels: { type: object, additionalProperties: { type: string } }
            revisions: { type: array, items: { type: string } }
    PublicConfig:
      type: object
      required: [ui]
      description: "Exactly `{ui}`: the `ui` section of the configuration file, and nothing else of it (a secret is never in it)."
      properties:
        ui:
          type: object
          description: "Every key of the `ui` section with its effective value. A client ignores a key it does not know."
          properties:
            showDescriptions:
              type: boolean
              default: true
              description: "Whether the web shows a thread's description ([ADR 0035](../decisions/0035-utility-model-tasks.md)). The API returns it either way."
    Registry:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items: { $ref: "#/components/schemas/RegistrySource" }
    RegistrySource:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: "`static` (the deployment's own list) or `platform` (the platform's registry)"
        status:
          type: string
          enum: [ok, unavailable]
        detail:
          type: string
          description: |
            Present only when `unavailable`: why, in words fit for a person ("the registry could not
            be reached", "the registry refused the orchestrator's credentials", "a registry document
            this build cannot read"). Never a URL or a credential.
    AgentTarget:
      type: object
      required: [agentId]
      properties:
        agentId: { type: string }
        release: { type: string, description: "Channel or exact revision; only valid when the agent has releases" }
    Thread:
      type: object
      required: [id, owner, title, target, state, createdAt, updatedAt, lastSeq]
      properties:
        id: { type: string, format: uuid }
        owner: { type: string, description: "The e-mail address of the person the thread belongs to (the key of what they own, lower-cased); it is always the caller's own, since nobody reads another person's thread (ADR 0039). Additive" }
        title: { type: string }
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            What the conversation is about now, in a sentence or two, plain text, one line
            ([ADR 0035](../decisions/0035-utility-model-tasks.md)). Absent until the model or a person
            writes one, and again when a person clears it. Present in `GET /api/threads` items, in
            `getThread`, in the export's `thread` and in AG-UI's `STATE_SNAPSHOT.thread`. Additive.
        target: { $ref: "#/components/schemas/AgentTarget" }
        state: { $ref: "#/components/schemas/ThreadState" }
        tools:
          type: array
          maxItems: 16
          items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,30}$" }
          description: |
            The ids of the MCP servers attached to the thread ([ADR 0024](../decisions/0024-mcp-tools-attached-per-conversation.md)),
            sorted: set with `putThreadTools` or when the thread is created, and kept from job to job. Absent when there are none.
            Present in `GET /api/threads` items, in `getThread`, in the export's `thread` and in AG-UI's
            `STATE_SNAPSHOT.thread`. Additive.
        job:
          $ref: "#/components/schemas/ThreadJob"
        share:
          $ref: "#/components/schemas/ThreadShare"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastSeq: { type: integer, format: int64 }
        pinned: { type: boolean, enum: [true], description: "Present, and `true`, while the owner has the thread pinned ([ADR 0042](../decisions/0042-the-thread-list-is-the-owners.md)); absent otherwise. Set with `arrangeThread`. The owner's routes and the export say it; the reader projection of a shared thread never does. Additive" }
        archived: { type: boolean, enum: [true], description: "Present, and `true`, while the owner has the thread archived; absent otherwise. Set with `arrangeThread`. Same readers as `pinned`. Additive" }
        nestedUnder: { type: string, format: uuid, description: "The thread this one is nested under in the owner's list, one level deep: a fork is made nested under the thread the person sees (its parent; for a fork of a nested fork the same parent; for a fork of an edit the conversation's root). Absent for a thread of the list's own level. Display grouping only: the lineage is `forkedFrom`. `arrangeThread` with `nested: false` ejects it. Same readers as `pinned`. Additive" }
        forkedFrom:
          type: object
          description: |
            Present only on a thread that began as a copy of another ([ADR 0029](../decisions/0029-forking-a-thread-copies-its-log.md)).
          required: [seq, kind]
          properties:
            threadId: { type: string, format: uuid, description: "The thread it was forked from; absent once that thread is deleted (the fork is whole)" }
            seq: { type: integer, format: int64, minimum: 0, description: "The last event of that thread that was copied" }
            kind: { type: string, enum: [fork, edit], description: "`fork`: from the end of a turn, a conversation of its own; `edit`: a branch made by editing a message" }
    ThreadShareRequest:
      type: object
      additionalProperties: false
      required: [visibility]
      properties:
        visibility: { type: string, enum: [internal, public], description: "`internal`: signed-in people with the link; `public`: anybody with the link. `private` is not a value: to stop sharing, `unshareThread`" }
    ThreadShareLink:
      type: object
      required: [visibility, effective, sharedAt]
      description: "What the owner is told after sharing, widening, narrowing or making a new link: the link, recomputed from the thread's row under the current secret, so it can be copied again at any time. Never cached."
      properties:
        visibility: { type: string, enum: [internal, public], description: "What the thread is stored as" }
        effective: { type: string, enum: [private, internal, public], description: "What is served now: the narrower of `visibility` and the deployment's cap (`sharing.mode`), `private` under `disabled`. A thread stored as `public` under a cap of `internal` is served as `internal`; the link is paused, not gone, and a restart under a wider cap brings it back" }
        url: { type: string, description: "The link, `<server.publicUrl>/s/<token>` (the path `/s/<token>` when no public URL is configured): a capability. Absent when the deployment has no `sharing.secret` to make it with (the cap is `disabled`)" }
        sharedAt: { type: string, format: date-time, description: "When the share was last set (a new link and a change of visibility included)" }
    ThreadShare:
      type: object
      required: [visibility, effective]
      description: "The share of a thread that is shared (`share` of `getThread` and of the items of `listThreads`); absent while the thread is private. Only `getThread`, and only to the owner, carries the `url`."
      properties:
        visibility: { type: string, enum: [internal, public] }
        effective: { type: string, enum: [private, internal, public] }
        url: { type: string, description: "The link; only in `getThread`, and absent when the deployment has no `sharing.secret`" }
    SharedThread:
      type: object
      required: [id, title, target, state, lastSeq, visibility, isOwner, createdAt, updatedAt]
      description: |
        A shared thread as a reader is given it: the reader projection ([ADR 0040](../decisions/0040-thread-sharing-by-revocable-link.md), section 7)
        of a `Thread`. **No `owner`, no `forkedFrom`, no `tools`, no `share`, and nothing of the owner's list (`pinned`, `archived`, `nestedUnder`)**: the owner's address is nowhere in it, and a reader acts on
        nothing. The thread's events come by `connectSharedThread` / `connectPublicSharedThread`.
      properties:
        id: { type: string, format: uuid, description: "The thread's id: not a capability, and the AG-UI `threadId` of the stream" }
        title: { type: string }
        description: { type: string, minLength: 1, maxLength: 500 }
        target: { $ref: "#/components/schemas/AgentTarget" }
        state: { $ref: "#/components/schemas/ThreadState" }
        job: { $ref: "#/components/schemas/ThreadJob" }
        lastSeq: { type: integer, format: int64 }
        visibility: { type: string, enum: [internal, public], description: "What the link is served at now: the narrower of the thread's visibility and the deployment's cap" }
        isOwner: { type: boolean, description: "Whether the person reading is the thread's owner (a signed-in read of their own link): the screen sends them to the thread itself. Always `false` on the public routes" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ToolServer:
      type: object
      description: "An MCP server the deployment offers for attaching ([ADR 0024](../decisions/0024-mcp-tools-attached-per-conversation.md)). No URL, header, credential, tool allow-list or timeout: those belong to the orchestrator."
      required: [id, name]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,30}$", description: "What a thread records, and the prefix of the server's tools on the thread's endpoint (`<id>__<tool>`)" }
        name: { type: string, minLength: 1, maxLength: 80, description: "The name the picker and the steps show" }
        description: { type: string, maxLength: 500, description: "What the server is for. Absent when the deployment says nothing" }
        icon: { type: string, pattern: "^data:image/(svg\\+xml|png|webp);base64,", maxLength: 8192, description: "A `data:` URI of at most 8 KiB that the screen draws as it is (an SVG is drawn as an image, never inlined). Never a URL: nothing is fetched. Absent: a generic icon" }
        agents: { type: array, minItems: 1, items: { type: string }, description: "The agent ids the server may be attached for. Absent: every agent" }
    ThreadToolsRequest:
      type: object
      additionalProperties: false
      required: [servers]
      properties:
        servers: { type: array, items: { type: string }, description: "The ids of the servers to have attached, from `listToolServers`: the whole set, `[]` for none. Repeats and order do not matter; at most 16 distinct ones" }
    ThreadTools:
      type: object
      required: [servers]
      properties:
        servers: { type: array, maxItems: 16, items: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,30}$" }, description: "The ids attached after the change, sorted" }
    ForkRequest:
      type: object
      additionalProperties: false
      description: "Where to cut a thread, and what the fork is. Exactly one of `after` and `replace`; `replace` needs `text`; `after` may come with `text`, which makes the fork with its first message ([ADR 0042](../decisions/0042-the-thread-list-is-the-owners.md)); `messageId` goes with `text`."
      properties:
        after: { type: integer, minimum: 1, description: "An event of the turn to copy: the cut is the end of that turn" }
        replace: { type: integer, minimum: 1, description: "The `seq` of a person's message to replace; the cut is the event before it" }
        text: { type: string, minLength: 1, maxLength: 100000, description: "What the person says instead (with `replace`), or says first in the new fork (with `after`)" }
        messageId: { type: string, maxLength: 256, description: "The id the screen gives the new message (with `text`)" }
        target:
          description: "The agent the fork talks to; the parent's when absent"
          $ref: "#/components/schemas/AgentTarget"
        id: { type: string, format: uuid, description: "The id of the new thread, chosen by the caller so that a repeat is recognised" }
    Branches:
      type: object
      required: [root, points]
      properties:
        root: { type: string, format: uuid, description: "The thread the conversation started from" }
        points:
          type: array
          items:
            type: object
            required: [seq, index, siblings]
            properties:
              seq: { type: integer, format: int64, description: "The `seq` of the message in this thread" }
              index: { type: integer, minimum: 0, description: "Which of `siblings` is this thread's" }
              siblings:
                type: array
                minItems: 2
                description: "Every version of the message: the original first, then the edits in the order they were made"
                items:
                  type: object
                  required: [threadId, seq, title]
                  properties:
                    threadId: { type: string, format: uuid }
                    seq: { type: integer, format: int64, description: "The `seq` of the message in that thread" }
                    title: { type: string }
    ThreadExport:
      type: object
      description: |
        The document `exportThread` returns. `version` moves only when a member changes meaning or
        goes away; adding a member does not move it, so a reader ignores members it does not know.
      required: [format, version, exportedAt, thread, job, binding, events, eventsTruncated]
      properties:
        format: { type: string, const: another-agentic-system/thread-export }
        version: { type: integer, const: 1 }
        exportedAt: { type: string, format: date-time, description: "When the snapshot was taken" }
        thread:
          description: "The thread as `getThread` answers it"
          $ref: "#/components/schemas/Thread"
        job:
          type: object
          additionalProperties: true
          description: |
            The whole job ledger, which `Thread.job` only summarises (and omits without a gate), as
            the store keeps it: `number` (which job of the thread this is, from 1; a thread is a
            conversation and a message on a finished thread starts its next job, ADR 0020; earlier
            jobs are in `events`, between the `job_started` events), `gate` (the policy: `require`,
            `maxAttempts`, `ci`, `verifier`, `verifierTimeout`), `attempt`, `verification` (counted
            per thread, never reset by a new job), `task` (the person's messages of the
            job in order, each later one after a line `[next message]`, capped: the first message
            and the newest ones are kept, and a line `[… earlier messages omitted …]` stands for
            the ones left out), `branchProblem` (why the agent's last `branch` artifact could not
            be used, when it could not), `summary`, `pushed` (`repository`, `branch`, `commit`),
            `results` (what each source said in the current attempt), `hold`, `title` (whose title
            the thread has: `{"source": "user"}` once a person renamed it, absent while it has the
            first message's words) and `description` (whose description the thread has and which job
            asked the model for it last: `{"source": "model", "askedJob": 2}`, `{"source": "user"}`
            once a person wrote or cleared it, absent while the thread has none and none was asked) and `afterStop` (the text the
            next job starts with while a Stop & send is landing, [ADR 0036](../decisions/0036-sending-while-an-agent-works.md): the
            person's words, as in `task`; absent unless the thread is stopping).
            The members of the job itself that are empty (`task`, `branchProblem`, `summary`,
            `pushed`, `results`, `hold`, `title`, `description`, `afterStop`) are absent; `gate` is always whole, and its `verifier` is `null`
            when there is none.
        binding:
          type: [object, "null"]
          description: "The A2A side of the thread; null when it has none"
          required: [agentId, contextId]
          properties:
            agentId: { type: string }
            contextId: { type: string, description: "The A2A context every task of the thread shares" }
            taskId: { type: [string, "null"], description: "The current or last task" }
            taskState: { type: [string, "null"], description: "The last known state of that task" }
            revision: { type: [string, "null"], description: "The agent revision that served it" }
        events:
          type: array
          description: |
            The thread's append-only event log, in order from `seq` 1 with no gap: the head of
            the log, cut at a number of events and at a number of bytes of serialized events, both
            configurable (defaults 50000 events and 32 MiB). The last `seq` equals
            `thread.lastSeq` unless `eventsTruncated`.
          items: { $ref: "#/components/schemas/Event" }
        eventsTruncated:
          type: boolean
          description: "True when the log is longer than `events`: either bound cut it"
    ThreadState:
      type: string
      description: |
        MVP subset of the job lifecycle (docs/architecture.md). `verifying`: the agent finished and
        the verification gate is checking its work (ADR 0018); only a thread under a gate is ever
        there, and it is implied by the `check_result` events, never announced by a `thread_state`
        event.
      enum: [queued, working, verifying, blocked, done, failed, cancelled]
    ThreadJob:
      type: object
      description: |
        Where a job stands under the verification gate (ADR 0018). Present only when the gate
        requires something; a thread without a gate has no `job`. The AG-UI `STATE_SNAPSHOT`
        carries the same object under `job`.
      required: [attempt, maxAttempts, gate]
      properties:
        number:
          type: integer
          minimum: 1
          description: "Which job of the thread this is. A thread is a conversation: a message on a finished thread starts its next job (ADR 0020). Present from job 2; absent means job 1"
        attempt: { type: integer, minimum: 1, description: "The attempt the agent is on in this job, from 1" }
        maxAttempts: { type: integer, minimum: 1, description: "The attempts there are, the first included" }
        gate:
          type: array
          description: "The sources that must pass before the thread is done"
          items: { $ref: "#/components/schemas/CheckSource" }
        sha:
          type: string
          description: "The commit the agent pushed in this attempt (its `branch` artifact), once it said so; not the commit a check ran on"
    CheckSource:
      type: string
      enum: [ci, agent_checks, verifier]
      description: |
        Where a verdict on the agent's work comes from: CI on the pushed commit, the checks the
        agent ran itself (its `checks` artifact), or a second agent that reviews the commit. A
        build honours only some of them; configuration spells them `ci`, `agent-checks` and
        `verifier`.
    ThreadArrangement:
      type: object
      minProperties: 1
      additionalProperties: false
      description: "How the caller's list shows a thread; see `arrangeThread`"
      properties:
        pinned: { type: boolean }
        archived: { type: boolean }
        nested: { type: boolean, enum: [false], description: "`false` ejects a thread from the thread it is nested under; `true` is a 422" }
        place:
          description: "`\"top\"`, or `{before: id}`, or `{after: id}`"
          oneOf:
            - { type: string, enum: [top] }
            - { type: object, additionalProperties: false, required: [before], properties: { before: { type: string, format: uuid } } }
            - { type: object, additionalProperties: false, required: [after], properties: { after: { type: string, format: uuid } } }
    ThreadPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: "The new title: one line, no control character. Spaces around it are cut before the length is checked."
        description:
          type: string
          maxLength: 500
          description: "The new description: one line, no control character; empty clears it. Spaces around it are cut before the length is checked."
    Event:
      type: object
      required: [seq, threadId, at, kind, actor, data]
      properties:
        seq: { type: integer, format: int64, description: "Strictly increasing within a thread, starting at 1" }
        threadId: { type: string, format: uuid }
        at: { type: string, format: date-time }
        kind: { $ref: "#/components/schemas/EventKind" }
        actor: { $ref: "#/components/schemas/Actor" }
        data:
          description: Shape depends on kind (see EventData)
          $ref: "#/components/schemas/EventData"
    EventKind:
      type: string
      enum:
        - user_message        # data: { text, messageId?, runId?, delivery?: steer|interrupt, mentions?: [Mention] }  (the ids are set when the message came from a surface that names them, e.g. AG-UI; absent otherwise). `delivery` says how a message sent while a job was `queued` or `working` reaches it ([ADR 0036](../decisions/0036-sending-while-an-agent-works.md)): `steer` (a plain Send: the agent reads it in its running task when its card lists `steer/v1`, else after its turn) or `interrupt` (Stop & send, or sent while a stop was landing: the running task is cancelled and the next job starts with the text). Written by the orchestrator, never by a client; absent when nothing was running and in every log written before it existed. `mentions` are the agents the person mentioned in the text ([ADR 0026](../decisions/0026-agent-mentions-as-structured-references.md), [`mentions-v1.md`](mentions-v1.md)), stored as the composer sent them, after the orchestrator checked them against the text, the registry and the person's roles; absent when there are none and in every log written before they existed. Additive.
        - agent_message       # data: { text, final: bool, purpose?: working|answer, via?: turn_output }  (final=false: streamed partial, replaced by the next agent_message with the same messageId). `purpose` says what the words are for in the turn (ADR 0031): `working` for words stated on a `working` status, `answer` for words stated on a status that ends the turn (`completed`, `input_required`, `auth_required`); absent for a plain A2A message and in every log written before it existed. `via` says how an answer was announced when it was not by that status (`turn_output`: the agent called the thread tool, written by the orchestrator with the id `out-<jti>-<n>`; once a turn has such an answer, the core writes everything else the agent says in the turn as `working`, and a later announcement replaces the earlier one by the rule that the answer of a turn is the last message marked `answer` in it). Additive.
        - agent_reasoning     # data: { messageId, text, truncated?: bool }  what the agent's model thought before one of its turns ([ADR 0044](../decisions/0044-an-agents-reasoning-is-relayed-live-and-logged-once-bounded.md), `kind: "reasoning"` of `text-stream/v1`): the reasoning stream's id, its text (at most 32 KiB) and `truncated` when the log does not hold all of it (cut at the bound, a piece lost, or the agent gave up). It is **not** the agent's words: no message, answer or summary, and a fork's conversation does not carry it. Attributed to the agent, written before the `agent_message` of the same turn. Additive: a reader that does not know the kind skips it.
        - agent_status        # data: { status: submitted|working|input_required|auth_required|completed|failed|canceled, detail? }  (mirrors A2A TaskState; auth_required blocks the thread like input_required, detail names what to authenticate to)
        - artifact            # data: { name, mimeType?, uri?, text?, file?: ArtifactFile }  e.g. a branch, a PR URL, a patch, or a file the agent handed over (ADR 0032): then `file` is the reference (`sha256`, `size`, `filename?`) to the bytes kept in the artifact store and served by `getArtifact`, and `mimeType` is the type the worker sniffed. An artifact entry without `file` and `text` and `uri`, followed by an `error` event, is a file that was not kept (too large, over the job's limits, no store, the store failed). Additive.
        - thread_state        # data: { state: ThreadState }
        - error               # data: { message, retryable: bool }
        - ui_surface          # data: { operations: [A2UI message] }  an A2UI payload an agent sent to render (ADR 0013), already through the orchestrator's envelope check; attributed to the agent. Additive.
        - ui_action           # data: { surfaceId, name, sourceComponentId, context, version, runId? }  what the user did on an A2UI surface of the thread (ADR 0013); attributed to the user. Additive.
        - ci_result           # data: { provider: github|generic, repository, sha, branch?, name, conclusion: success|neutral|skipped|failure|cancelled|timed_out|action_required|stale|startup_failure, url?, summary? }  a CI provider reported a completed check on a commit (ADR 0017); attributed to the system. Additive; logged since MVP slice 6 (the CI webhooks).
        - check_result        # data: { source: CheckSource, attempt, status: pending|passed|failed, name?, commit?, summary?, stale?, findings?: [string] }  a source of the verification gate answered (ADR 0018); attributed to the system. `findings` are untrusted text (at most 20 items and 16 KiB). `stale`: the answer was for a verification that is no longer the current one and decided nothing. Additive.
        - job_started         # data: { job: integer }  a message on a finished thread started the thread's next job; `job` is its number, from 2 (ADR 0020); attributed to the system, right after the `user_message` that caused it (or alone, for a message redelivered to the agent). Additive.
        - rework              # data: { attempt, maxAttempts, findings: [{ source: CheckSource, findings: [string] }] }  the gate failed and the agent was sent back to work; `attempt` is the one that starts now (ADR 0018); attributed to the system. Additive.
        - ui_catalog          # data: { catalogId, version: integer, digest, catalog }  the person's screen sent a version of its UI component catalog, an A2UI inline catalog (ADR 0023); attributed to the user, once per digest, appended first in the commit of the message or action that carried it. Additive. It has no AG-UI frame: the thread's current catalog is `thread.uiCatalog` of the state snapshot.
        - agent_step          # data: { id, path: [string], kind: subagent|tool|command|message, label, state: running|waiting|completed|failed|canceled, phase: start|update|end, icon?, detail?, input?, output?, ioDropped? }  a step of the agent's work started, moved or ended (ADR 0025, `steps/v1`); attributed to the agent that reported it, or to the orchestrator for a step it reports itself. `path` is the chain of step ids the step runs under, outermost first (empty at the top). Coalesced: a step logs its start, its end and at most 4 updates, so the log stays bounded. `input` (with the start) and `output` (with the end) say what the tool was called with and what it returned, cut, redacted and budgeted (ADR 0030). Additive.
        - thread_titled       # data: { title, source: model|user }  the thread has a new title: a person renamed it (`patchThread`, `source: user`, attributed to the person) or the orchestrator had a model write one after the agent's first reply (`source: model`, attributed to the orchestrator, [ADR 0005](../decisions/0005-openai-compatible-model-endpoint.md): the model is asked at most twice per thread, and never once a person has renamed it). `threads.title` and this event are one commit, so a listing that says the title has the event in the log. The title the thread starts with (the first words of its first message) has no event. Additive.
        - thread_described    # data: { description, source: model|user }  the thread has a new description ([ADR 0035](../decisions/0035-utility-model-tasks.md)): the orchestrator had a model write one when a job ended or paused for the person (`source: model`, attributed to the orchestrator; at most once per job, and only when the conversation grew by `minNewMessages` since the last one) or a person wrote it (`patchThread`, `source: user`, attributed to the person; an empty `description` is the person clearing it). `threads.description` and this event are one commit. Once a person has written or cleared it, the model never writes it again. Additive.
        - thread_forked       # data: { from: { threadId, seq }, kind: fork|edit, title, description?, target: AgentTarget }  the thread began as a copy of another (ADR 0029): its events `1..=from.seq` are the parent's, copied with the same `seq`, then this event at `from.seq + 1`, then the thread's own. `fork`: a copy to the end of a turn ("fork from here", "continue with another agent"); `edit`: a copy to just before a message of a person, followed by the message edited (a branch). `title` is the parent's title when the fork was made, and the fork's; `description` is the parent's description then (absent when it had none), and the fork's. `target` is the agent the fork talks to. Attributed to the person. Additive; the first event of the thread's own life, so a reader that skips it still reads a coherent log.
        - tools_attached      # data: { servers: [string] }  MCP servers were attached to the thread (ADR 0024): the ids newly attached, sorted, never empty; attributed to the person, in the commit of the first message when the thread was created with servers (after the message), or alone (`putThreadTools`). Ids only: no URL, no credential. Additive. AG-UI says it as a `vymalo.tools` activity and `thread.tools` of the state snapshot.
        - tools_detached      # data: { servers: [string] }  MCP servers were detached from the thread (ADR 0024): the ids detached, sorted, never empty; attributed to the person, or to the person's fork whose agent may not use a server its copied log had attached. Additive.
        - ask_started         # data: { ask: integer, agent, by: main|ask:<n>, depth: integer, text, stepId, parentStepId? }  the agent the job runs on (or an agent it asked) asked an agent the person mentioned to do part of the work ([ADR 0026](../decisions/0026-agent-mentions-as-structured-references.md), `ask_agent` of [`thread-tools-v1.md`](thread-tools-v1.md)); attributed to the asking agent. `ask` is the ask's number in the job, from 1; `depth` is 1 for the addressed agent's ask; `text` is what was asked (untrusted, at most 16 KiB); `stepId` is `ask-<ask>`. Additive; written since migration 0014, by the thread tools' `ask_agent` (not built yet), and not drawn by AG-UI yet.
        - thread_shared       # data: { visibility: internal|public, nonce_sha256 }  the owner shared the thread, widened or narrowed the share, or made a new link ([ADR 0040](../decisions/0040-thread-sharing-by-revocable-link.md)): `nonce_sha256` is the lower-case hex SHA-256 of the nonce the link is built on, which tells one link from another and is useless as a link (the nonce itself is never in the log, because the export carries it). Attributed to the owner. `threads.visibility`, `share_nonce` and this event are one commit. Additive; a build that does not know it cannot read a log that has one, so roll the build out before raising `sharing.mode` above `disabled`. A fork copies it as history; the fork itself is private. No AG-UI frame.
        - thread_unshared     # data: {}  the owner took the link down ([ADR 0040](../decisions/0040-thread-sharing-by-revocable-link.md)); the thread is private again and the nonce is gone. Attributed to the owner. Additive. No AG-UI frame.
        - ask_finished        # data: { ask: integer, state: completed|input_required|auth_required|failed|rejected|canceled|timed_out, text?, question?, artifacts?: [{ name, uri?, mimeType? }], error? }  the ask ended, exactly once ([ADR 0026](../decisions/0026-agent-mentions-as-structured-references.md)); attributed to the asked agent for what it said, to the orchestrator for a deadline, a cancel (the person stopped the job, or the task that asked ended) or an agent it could not reach. `text` is the answer (untrusted, at most 64 KiB), `question` the question the agent asked back and `error` why it did not complete (at most 4 KiB each), `artifacts` at most 20. Additive.
    Mention:
      type: object
      description: "An agent a person mentioned in a message, as a structured reference ([`mentions-v1.md`](mentions-v1.md), [ADR 0026](../decisions/0026-agent-mentions-as-structured-references.md)): the identity is `agentId`, never the label."
      required: [agentId, label, start, end]
      additionalProperties: false
      properties:
        agentId: { type: string, description: "The id the registry gives the agent" }
        label: { type: string, minLength: 2, description: "The text shown for it as it stands in the message: `@` and 1 to 63 more characters, at most 64 UTF-16 code units in all. Equal to the text at `start`..`end`." }
        start: { type: integer, minimum: 0, description: "Where the label begins in the message text, in UTF-16 code units (what a JavaScript string indexes), inclusive; never inside a surrogate pair" }
        end: { type: integer, minimum: 1, description: "Where the label ends, in UTF-16 code units, exclusive; greater than `start`, at most the length of the text" }
        cardUrl: { type: string, description: "The agent's card URL as the composer saw it in the agent list; when given it equalled the registry's when the message was checked" }
    ArtifactFile:
      type: object
      description: "A file kept in the artifact store, as an `artifact` event refers to it (ADR 0032). The bytes are never in the log; `GET /api/threads/{threadId}/artifacts/{sha256}` serves them."
      required: [sha256, size]
      properties:
        sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "The SHA-256 of the content: with the thread, its key in the store" }
        size: { type: integer, format: int64, minimum: 0, description: "Bytes" }
        filename: { type: string, description: "The name the agent gave the file, cleaned of path parts and control characters (untrusted text)" }
    Actor:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [user, agent, system] }
        name: { type: string, description: "User email, agent id, or 'orchestrator'" }
        revision: { type: string, description: "Agent revision that produced this event, when known (ADR 0008 echo)" }
    EventData:
      type: object
      additionalProperties: true
      properties:
        text: { type: string }
        messageId:
          type: string
          description: "agent_message: the agent's stable message id. agent_reasoning: the id of the reasoning stream (the agent's, and the live reasoning's). user_message: the id the surface gave the message, when it did (optional, absent otherwise)."
        delivery:
          type: string
          enum: [steer, interrupt]
          description: "user_message only (ADR 0036): how a message sent while a job was `queued` or `working` reaches it. `steer`: a plain Send; the agent reads it in its running task when its card lists `steer/v1`, else after its turn (today every agent: the extension is not built yet). `interrupt`: Stop & send, or a message sent while a stop was landing; the running task is cancelled and the next job starts with the text (joined with any other message sent meanwhile). Absent (never `null`) when nothing was running, and in older logs. A thread that is stopping is still `working`."
        mentions:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/Mention" }
          description: "user_message only (ADR 0026, `mentions/v1`): the agents the person mentioned in `text`, in order, as the composer sent them (offsets count UTF-16 code units). Checked before the message was written: each label is the text at its offsets, the agent is one the registry lists and the person's roles let them invoke, and the card URL, when given, was the registry's. Absent (never `[]`) when the message mentions nobody, and in older logs. The addressed agent is told them only when its card lists `mentions/v1`; the chat shows them as chips either way."
        runId:
          type: string
          description: "user_message, ui_action: the id of the run the message or action started or continued, when the surface names runs (optional, absent otherwise)."
        final: { type: boolean }
        truncated:
          type: boolean
          description: "agent_reasoning only (ADR 0044): the text is not the whole of what the model thought. Absent when it is whole."
        purpose:
          type: string
          enum: [working, answer]
          description: "agent_message only (ADR 0031): what the words are for in the agent's turn. `working`: said while the agent works (the sentence before a tool call), stated on a `working` status. `answer`: the words that end the turn, stated on `completed`, `input_required` or `auth_required`, or an answer the agent announced with the `turn_output` thread tool (`via`). Absent when the protocol does not say (a plain A2A message, a log written before the field existed): a reader treats the last text of an ended turn as its answer, unless the turn has an announced answer. The answer of a turn is the last message marked `answer` in it; an earlier one is working text."
        via:
          type: string
          enum: [turn_output]
          description: "agent_message only, with `purpose: answer` (ADR 0031): how the answer was announced when it was not by the status that ends the turn: the agent called the `turn_output` thread tool (`thread-tools/v1`, ADR 0031 amendment). The message id is `out-<jti>-<n>`."
        status:
          type: string
          description: "agent_status: submitted, working, input_required, auth_required, completed, failed or canceled. check_result: pending, passed or failed."
        detail:
          type: string
          description: "agent_status: the agent's status message. agent_step: more words about the step (a failure, a result); untrusted text, at most 1000 characters."
        servers:
          type: array
          items: { type: string }
          description: "tools_attached, tools_detached: the server ids that were attached (or detached) by this event, sorted, never empty. Ids only."
        name: { type: string }
        mimeType: { type: string }
        uri: { type: string }
        file:
          description: "artifact only (ADR 0032): the file the artifact is, kept in the artifact store. Absent for text and links and for a file that was not kept."
          $ref: "#/components/schemas/ArtifactFile"
        state:
          description: "thread_state: the ThreadState the thread entered. agent_step: where the step stands (running, waiting, completed, failed or canceled). ask_finished: how the ask ended (completed, input_required, auth_required, failed, rejected, canceled or timed_out)."
          anyOf:
            - { $ref: "#/components/schemas/ThreadState" }
            - { type: string, enum: [running, waiting, completed, failed, canceled] }
            - { type: string, enum: [input_required, auth_required, rejected, timed_out] }
        ask:
          type: integer
          minimum: 1
          description: "ask_started, ask_finished (ADR 0026): the ask's number in the job, from 1."
        agent:
          type: string
          description: "ask_started: the agent that was asked (an agent id)."
        by:
          type: string
          pattern: "^(main|ask:[1-9][0-9]*)$"
          description: "ask_started: who asked, the addressed agent (`main`) or an earlier ask of the job (`ask:<n>`)."
        depth:
          type: integer
          minimum: 1
          description: "ask_started: how deep in a chain of asks, 1 for the addressed agent's ask."
        stepId:
          type: string
          description: "ask_started: the step the ask is shown as, `ask-<ask>`."
        parentStepId:
          type: string
          description: "ask_started: the step of the asking agent the ask belongs under, when the caller named one."
        question:
          type: string
          description: "ask_finished: the question an asked agent asked back (state input_required or auth_required). Untrusted text, at most 4 KiB."
        artifacts:
          type: array
          maxItems: 20
          items:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              name: { type: string }
              uri: { type: string }
              mimeType: { type: string }
          description: "ask_finished: what the asked agent handed back."
        error:
          type: string
          description: "ask_finished: why the ask did not complete. Untrusted text, at most 4 KiB."
        message: { type: string }
        retryable: { type: boolean }
        operations:
          type: array
          description: "ui_surface only: the A2UI messages of one payload, as the agent sent them. Each is an object with a `version` (v0.9, v0.9.1 or v1.0) and exactly one of createSurface, updateComponents, updateDataModel, deleteSurface, whose body names a `surfaceId`. At most 256 messages and 64 KiB per payload."
          items: { type: object, additionalProperties: true }
        surfaceId:
          type: string
          description: "ui_action only: the surface the user acted on (one the thread has), at most 256 bytes."
        sourceComponentId:
          type: string
          description: "ui_action only: the component that triggered the action (A2UI requires it), at most 256 bytes."
        context:
          type: object
          additionalProperties: true
          description: "ui_action only: the context the component's action declared, resolved by the renderer; at most 16 KiB."
        version:
          oneOf:
            - type: string
              enum: [v0.9, v0.9.1, v1.0]
            - type: integer
              minimum: 1
              maximum: 1000000
          description: "ui_action: the A2UI version of the surface (a string, v0.9, v0.9.1 or v1.0), so the agent gets the action in the dialect it spoke. ui_catalog: the version of the catalog (an integer from 1), raised by the UI with every change; the highest is the newest."
        catalogId:
          type: string
          maxLength: 256
          description: "ui_catalog only: the catalog's stable id, an absolute https URL. A UI keeps it across versions."
        digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: "ui_catalog only: `sha256:` and the lowercase hex of SHA-256 over the canonical JSON of `catalog` (keys sorted, no whitespace, integers in decimal). The orchestrator recomputes it and refuses a catalog whose digest differs."
        catalog:
          type: object
          additionalProperties: true
          description: "ui_catalog only: the catalog, `{catalogId, components: {<Name>: <JSON Schema of the component>}}`: an A2UI inline catalog, at most 64 KiB and 64 components, with no `$ref`, `$id`, `$anchor` or `$schema` and only integer numbers. Stored, relayed to agents, never interpreted by the orchestrator."
        source:
          description: "check_result: the source that answered. thread_titled: who wrote the title (a person, or the model). thread_described: who wrote the description (a person, or the model)."
          anyOf:
            - { $ref: "#/components/schemas/CheckSource" }
            - { type: string, enum: [model, user] }
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: "thread_titled: the thread's new title. thread_forked: the parent's title when the fork was made, which is the fork's."
        description:
          type: string
          maxLength: 500
          description: "thread_described: the thread's new description; empty when a person cleared it. thread_forked: the parent's description when the fork was made, which is the fork's; absent when it had none."
        from:
          type: object
          required: [threadId, seq]
          properties:
            threadId: { type: string, format: uuid }
            seq: { type: integer, minimum: 0 }
          description: "thread_forked only: the thread that was forked and the last of its events that was copied (the cut). 0 when nothing was copied (an edit of the first message)."
        target:
          $ref: "#/components/schemas/AgentTarget"
        job:
          type: integer
          minimum: 2
          description: "job_started only: the number of the job that started."
        attempt:
          type: integer
          minimum: 1
          description: "check_result: the attempt the answer belongs to. rework: the attempt that starts now."
        maxAttempts:
          type: integer
          minimum: 1
          description: "rework only: the attempts there are."
        commit:
          type: string
          description: "check_result only: the commit the answer was about, when the source named one."
        id:
          type: string
          maxLength: 200
          description: "agent_step only: the step's id, unique within the thread (an agent's own id is prefixed with its task id)."
        path:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 200 }
          description: "agent_step only: the ids of the steps this one runs under, outermost first; empty at the top. At most the 8 nearest."
        kind:
          type: string
          enum: [subagent, tool, command, message, fork, edit]
          description: "agent_step: what the step is (subagent, tool, command or message). thread_forked: how the fork was made (fork or edit)."
        label:
          type: string
          maxLength: 200
          description: "agent_step only: one line that says what the step is doing. Untrusted text."
        phase:
          type: string
          enum: [start, update, end]
          description: "agent_step only: which moment of the step this event is. A step that was reported ended without a start is one event, an `end`."
        icon:
          type: string
          description: "agent_step only: a name from the icon vocabulary of `steps/v1` (agent, read, edit, delete, move, search, execute, think, fetch, web, git, test, file, tool), or, for a step the orchestrator reports itself, `mcp-server:<id>`."
        input:
          type: object
          additionalProperties: true
          description: "agent_step only (ADR 0030): what the tool was called with, a JSON object of at most 4096 bytes serialized with credentials redacted (`\"[redacted]\"`), strings cut at 512 characters; or `{\"_cut\": true, \"bytes\": n}` when it was bigger. Logged once per step, with its start (or with the first report that has it). Absent when the agent sent none, when the record is off (`ORCH_STEPS_RECORD_IO=false`) or when the job's budget was spent. Untrusted."
        output:
          type: object
          required: [text]
          additionalProperties: false
          properties:
            text:
              type: string
              description: "What the tool returned, or the error it returned: at most 8192 bytes (the head and the tail of a longer text, with a line between that says how many bytes are not kept), credentials redacted, no control characters but line break and tab. Untrusted text."
            truncated:
              type: boolean
              enum: [true]
              description: "`text` is not all of what the tool returned. Absent when it is."
            bytes:
              type: integer
              minimum: 0
              description: "The size of all of what the tool returned, in bytes. Only with `truncated`."
            error:
              type: boolean
              enum: [true]
              description: "`text` is the error the tool returned. Absent otherwise."
          description: "agent_step only (ADR 0030): what the tool returned, on the step's end. Same absences as `input`."
        ioDropped:
          type: boolean
          enum: [true]
          description: "agent_step only (ADR 0030): the step had an `input` or an `output` that the job's budget (2 MiB of both over all its steps) had no room for, and it was dropped. Absent otherwise."
        summary:
          type: string
          description: "check_result, ci_result: a one-line summary from the source. Untrusted text."
        stale:
          type: boolean
          description: "check_result only: the answer was for a verification that is no longer the current one, and decided nothing."
        findings:
          type: array
          description: "check_result: what is wrong, as strings. rework: per failed source, {source, findings}. Untrusted text; at most 20 items and 16 KiB per source."
          items: {}
    AgUiRunAgentInput:
      description: The AG-UI 1.0 `RunAgentInput` (the vendored JSON Schema, `$defs/RunAgentInput`)
      $ref: "../../orchestrator/crates/agui-proto/schema/ag-ui-1.0.schema.json#/$defs/RunAgentInput"
    AgUiEvent:
      description: Any AG-UI 1.0 event (the vendored JSON Schema, `$defs/Event`); the `data:` of every frame
      $ref: "../../orchestrator/crates/agui-proto/schema/ag-ui-1.0.schema.json#/$defs/Event"
    AgUiAgentCapabilities:
      description: The AG-UI 1.0 `AgentCapabilities` (the vendored JSON Schema, `$defs/AgentCapabilities`)
      $ref: "../../orchestrator/crates/agui-proto/schema/ag-ui-1.0.schema.json#/$defs/AgentCapabilities"
    AgUiSseFrame:
      description: |
        One server-sent-events message of an AG-UI stream, as OpenAPI 3.2 `itemSchema` would say it
        (carried as `x-itemSchema` because this document is 3.1): `data` is one JSON `AgUiEvent`, `id`
        is the log `seq`, present only on a resume point. There is no `event:` name.
      type: object
      required: [data]
      properties:
        id: { type: string, pattern: "^[0-9]+$" }
        data:
          type: string
          contentMediaType: application/json
          contentSchema: { $ref: "#/components/schemas/AgUiEvent" }
