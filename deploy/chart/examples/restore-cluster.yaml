# A restore of the database cluster from its backups (README.md, "Backups"). Not part of the chart (Helm renders nothing from this directory):
# apply it to the namespace the release runs in, after `backup.enabled` has been on long enough for a base backup to exist.
#
# It makes a NEW cluster, `another-agentic-db-restore`, from the newest base backup and the WAL archive of the ObjectStore `another-agentic-db`
# (the server name below is the source cluster's: the plugin keeps each cluster's files under its own name), and does not touch the running
# one. CloudNativePG restores into a new cluster and never in place. There is deliberately NO `plugins` entry: a restored cluster that archived
# would write into the bucket beside the source. The names assume a release called `another-agentic-system` in the chart's own namespace
# (`<release>-db` is the cluster, `<release>-db-restore` this one); the database and its owner are the chart's `database.name` and `owner`.
#
#   kubectl -n another-agentic-system apply -f deploy/chart/examples/restore-cluster.yaml
#   kubectl -n another-agentic-system get cluster another-agentic-db-restore -w
#
# For a point in time, add under `bootstrap.recovery` (a time between the oldest base backup and the last archived WAL):
#   recoveryTarget:
#     targetTime: "2026-10-17 03:00:00+00"
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: another-agentic-db-restore
spec:
  instances: 1
  storage:
    size: 10Gi
    storageClass: longhorn
  bootstrap:
    recovery:
      source: source
      database: orchestrator
      owner: orchestrator
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: another-agentic-db
          serverName: another-agentic-db
