# The one Postgres of the deployment (CloudNativePG): the orchestrator's event log (the only durable state, ADR 0001) and, in
# databases of their own, the run stores of the agents that run beside it. CloudNativePG creates the database `orchestrator`, its
# owner and the Secret `<name>-app`, whose key `uri` is the connection string the orchestrator reads as a file
# (`database.url: { file: /run/secrets/db/uri }`): the password never passes through this chart.
#
# The other databases are declared: a managed role per database (`spec.managed.roles`, login, its password from a Secret that an
# ExternalSecret fills from the AWS secret) and a `Database` object that creates the database with that role as its owner (the
# `Database` CRD is CloudNativePG 1.25 or later: README.md, "One database cluster"). A role and its database exist only with
# the agent that needs them (`chat.enabled`, `sharedDatabase.coder.enabled`).
{{- $root := dict "root" . "component" "db" }}
{{- $cluster := include "agentic.db.orchestrator" . }}
{{- $agent := .Values.chat.enabled }}
{{- /* The coders' databases: `sharedDatabase.coders`, or the one `sharedDatabase.coder` of older values (templates/_helpers.tpl). */}}
{{- $coders := include "agentic.db.coders" . | fromYamlArray }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "agentic.labels" $root | nindent 4 }}
spec:
  instances: {{ .Values.database.instances }}
  {{- with .Values.database.imageName }}
  imageName: {{ . | quote }}
  {{- end }}
  storage:
    size: {{ .Values.database.storage.size | quote }}
    storageClass: {{ .Values.database.storage.storageClass | quote }}
  bootstrap:
    initdb:
      database: {{ .Values.database.name }}
      owner: {{ .Values.database.owner }}
  {{- if or $agent $coders }}
  managed:
    roles:
      {{- if $agent }}
      - name: agent
        ensure: present
        login: true
        passwordSecret:
          name: {{ include "agentic.secret.db.agent" . }}
      {{- end }}
      {{- range $c := $coders }}
      - name: {{ $c.name }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ $c.secretName }}
      {{- end }}
  {{- end }}
{{- /* The databases, one per role: the chat agent's, then each coder's. */}}
{{- $dbs := list }}
{{- if $agent }}{{- $dbs = append $dbs "agent" }}{{- end }}
{{- range $c := $coders }}{{- $dbs = append $dbs $c.name }}{{- end }}
{{- range $db := $dbs }}
---
{{- $dbRoot := dict "root" $ "component" (printf "db-%s" $db) }}
# The database `{{ $db }}`, owned by the role `{{ $db }}`. `databaseReclaimPolicy` is the CRD's default, `retain`: removing this
# object leaves the database in place.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ include "agentic.component" $dbRoot }}
  labels:
    {{- include "agentic.labels" $dbRoot | nindent 4 }}
spec:
  cluster:
    name: {{ $cluster }}
  name: {{ $db }}
  owner: {{ $db }}
{{- end }}
