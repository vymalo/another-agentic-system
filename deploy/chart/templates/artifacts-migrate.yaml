{{- if .Values.orchestrator.artifacts.migrate.enabled }}
{{- $job := dict "root" . "component" "artifacts-migrate" -}}
{{- $mig := .Values.orchestrator.artifacts.migrate -}}
# The files of the directory store, moved into the bucket (ADR 0058, A5.4): `orchestrator artifacts migrate --from fs --to s3`, one Job, on request
# (`orchestrator.artifacts.migrate.enabled`). It is the orchestrator's own image and configuration, and nothing else of the orchestrator's:
#   - the KEPT claim of the directory store, READ-ONLY (the chart stopped rendering it with `store: s3` and never prunes it; this names it by its
#     existing name). Nothing is written to it and nothing is deleted from it: the claim is deleted by hand, once the report says every file is in
#     the bucket, and after this Job is turned off;
#   - the configuration (it reads only `artifacts` of it) and the two S3 credentials of the orchestrator's Secret. No database URL, no thread-tools
#     key, no model or agent token is mounted: the command opens no connection but the bucket's.
# A Helm hook (post-install, post-upgrade; Argo CD runs it as PostSync) and not a plain Job, for three reasons. It must run after the bucket
# exists (the RustFS hook Job of weight 0 makes it; this is weight 10). A Job's pod template is immutable, so a plain Job could not be synced again
# after the next image bump ("field is immutable"); a hook is recreated on every sync (before-hook-creation). And a hook that fails fails the sync,
# which is what a migration that did not finish should do. It is kept after it finishes (no hook-succeeded deletion) so that its report can be read in its
# logs, and the TTL removes it after a week. It is idempotent: it skips what the bucket holds, so another sync while it is on does no harm.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentic.component" $job }}
  labels:
    {{- include "agentic.labels" $job | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/sync-wave: "10"
spec:
  # A try that fails for the bucket's sake is worth two more; a damaged file fails the same way every time.
  backoffLimit: 2
  # A claim that is not there leaves the pod pending: the deadline turns that into a failure instead of a sync that never ends.
  activeDeadlineSeconds: {{ int64 $mig.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        {{- include "agentic.selectorLabels" $job | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "agentic.image" .Values.orchestrator.image | quote }}
          imagePullPolicy: {{ .Values.orchestrator.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The report is the last line of stdout (one JSON object); the logs are on stderr. Exit 0 only when every file is in the bucket;
          # 65 a file is damaged or cannot be migrated, 66 the claim cannot be read, 69 the bucket failed, 78 the configuration.
          args:
            - artifacts
            - migrate
            - --from
            - fs
            - --to
            - s3
            - --fs-root
            - /var/lib/orchestrator/artifacts
            {{- if $mig.dryRun }}
            - --dry-run
            {{- end }}
          env:
            - name: ORCH_CONFIG_FILE
              value: /etc/orchestrator/config.yaml
            - name: RUST_LOG
              value: {{ .Values.orchestrator.logLevel | quote }}
          resources:
            {{- toYaml $mig.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/orchestrator
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/orchestrator
              readOnly: true
            - name: artifacts
              mountPath: /var/lib/orchestrator/artifacts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "agentic.component" (dict "root" . "component" "orchestrator") }}
        - name: secrets
          secret:
            secretName: {{ include "agentic.secret.orchestrator" . }}
            # Group-readable by the runtime user (fsGroup): 0400 would leave the files to root.
            defaultMode: 0440
            # The two S3 credentials, and nothing else of the orchestrator's Secret.
            items:
              - key: artifacts-s3-access-key-id
                path: artifacts-s3-access-key-id
              - key: artifacts-s3-secret-access-key
                path: artifacts-s3-secret-access-key
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ include "agentic.component" (dict "root" . "component" "artifacts") }}
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      {{- include "agentic.placement" . | nindent 6 }}
{{- end }}
