{{- if and .Values.ingress.enabled .Values.ingress.rateLimit.enabled }}
# A limit per client address at the Ingress (issue #284; deploy/chart/README.md, "A limit per client at the edge"): a Traefik `RateLimit` middleware, a custom
# resource of the cluster's Traefik (`traefik.io/v1alpha1`), which templates/ingress.yaml names in the annotation `traefik.ingress.kubernetes.io/router.middlewares`.
# Traefik's token bucket: `burst` requests at once, refilled at `average` per `period`, one bucket for each client address. A refused client gets Traefik's 429;
# the chart adds no access log. `sourceCriterion.ipStrategy.depth` 0 is the address of the peer that connected, N the N-th address from the right of X-Forwarded-For.
{{- $root := dict "root" . "component" "ratelimit" }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "agentic.rateLimit.name" . }}
  labels:
    {{- include "agentic.labels" $root | nindent 4 }}
spec:
  rateLimit:
    average: {{ int64 .Values.ingress.rateLimit.average }}
    period: {{ .Values.ingress.rateLimit.period | quote }}
    burst: {{ int64 .Values.ingress.rateLimit.burst }}
    sourceCriterion:
      ipStrategy:
        depth: {{ int64 .Values.ingress.rateLimit.sourceDepth }}
{{- end }}
