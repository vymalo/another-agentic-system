{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets -}}
{{- $key := required "externalSecrets.key is required" $es.key -}}
# Secret values live in AWS Secrets Manager (`{{ $key }}`, one JSON property per value) and are copied into Secrets by
# External Secrets, the mechanism of the ARC runner pools in home-os. None is in this chart, its values or its render.
# Each consumer gets a Secret of its own, with only what it reads.
{{- $orch := dict "root" . "component" "orchestrator" }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "agentic.secret.orchestrator" . }}
  labels:
    {{- include "agentic.labels" $orch | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "agentic.secret.orchestrator" . }}
    creationPolicy: Owner
  data:
    # `threadTools.secret`, mounted as a file.
    - secretKey: thread-tools-secret
      remoteRef:
        key: {{ $key }}
        property: {{ required "externalSecrets.properties.threadToolsSecret is required" $es.properties.threadToolsSecret }}
    {{- if include "agentic.hasModel" . }}
    # `models.endpoints.default.apiKey`, mounted as a file.
    - secretKey: model-api-key
      remoteRef:
        key: {{ $key }}
        property: {{ required "externalSecrets.properties.modelApiKey is required with model.baseUrl" $es.properties.modelApiKey }}
    {{- if include "agentic.modelBaseUrlFromSecret" . }}
    # `models.endpoints.default.baseUrl`, mounted as a file: the address is kept next to the key, not in git.
    - secretKey: model-base-url
      remoteRef:
        key: {{ $key }}
        property: {{ required "externalSecrets.properties.modelBaseUrl is required with model.baseUrlFromSecret" $es.properties.modelBaseUrl }}
    {{- end }}
    {{- end }}
    {{- if include "agentic.toolServer.websearch" . }}
    # `toolServers[websearch].bearer`, mounted as a file: the same property the search pod's own Secret reads.
    - secretKey: search-mcp-token
      remoteRef:
        key: {{ $key }}
        property: {{ required "externalSecrets.properties.searchMcpToken is required with orchestrator.toolServers.websearch" $es.properties.searchMcpToken }}
    {{- end }}
    {{- if include "agentic.toolServer.context7" . }}
    # `toolServers[context7].bearer`, mounted as a file.
    - secretKey: context7-api-key
      remoteRef:
        key: {{ $key }}
        property: {{ required "externalSecrets.properties.context7ApiKey is required with orchestrator.toolServers.context7" $es.properties.context7ApiKey }}
    {{- end }}
    {{- /* The bearer of each agent the agents file names (`tokenEnv`): an environment variable of the pod. */}}
    {{- range (include "agentic.tokenEnvs" . | trim | splitList "\n") }}
    {{- if . }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $key }}
        property: {{ required (printf "externalSecrets.agentTokens.%s is required" .) (get $es.agentTokens .) }}
    {{- end }}
    {{- end }}
---
{{- $oauth := dict "root" . "component" "oauth2-proxy" }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "agentic.secret.oauth2" . }}
  labels:
    {{- include "agentic.labels" $oauth | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "agentic.secret.oauth2" . }}
    creationPolicy: Owner
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: {{ $key }}
        property: {{ required "externalSecrets.properties.oauth2ClientSecret is required" $es.properties.oauth2ClientSecret }}
    # 16, 24 or 32 bytes.
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: {{ $key }}
        property: {{ required "externalSecrets.properties.oauth2CookieSecret is required" $es.properties.oauth2CookieSecret }}
{{- if .Values.chat.enabled }}
---
{{- $chat := dict "root" . "component" "chat" }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "agentic.secret.chat" . }}
  labels:
    {{- include "agentic.labels" $chat | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "agentic.secret.chat" . }}
    creationPolicy: Owner
  data:
    # The same property the orchestrator reads as `{{ .Values.chat.tokenEnv }}`, so the two sides cannot differ.
    - secretKey: A2A_BEARER_TOKENS
      remoteRef:
        key: {{ $key }}
        property: {{ required (printf "externalSecrets.agentTokens.%s is required" .Values.chat.tokenEnv) (get $es.agentTokens .Values.chat.tokenEnv) }}
    - secretKey: MODEL_API_KEY
      remoteRef:
        key: {{ $key }}
        property: {{ required "externalSecrets.properties.modelApiKey is required with the chat agent" $es.properties.modelApiKey }}
    {{- if include "agentic.modelBaseUrlFromSecret" . }}
    # The same property the orchestrator reads, so the two sides cannot differ.
    - secretKey: MODEL_BASE_URL
      remoteRef:
        key: {{ $key }}
        property: {{ required "externalSecrets.properties.modelBaseUrl is required with model.baseUrlFromSecret" $es.properties.modelBaseUrl }}
    {{- end }}
{{- end }}
{{- /* The database roles: one Secret each, `kubernetes.io/basic-auth` (what CloudNativePG reads a managed role's password from) with
       a `uri` key beside `username` and `password`. The password is a property of the AWS secret and goes through the
       template only, never through this chart's values. `cnpg.io/reload` makes the operator apply a changed password at once. */}}
{{- range $db := list "agent" "coder" }}
{{- if (ternary $.Values.chat.enabled $.Values.sharedDatabase.coder.enabled (eq $db "agent")) }}
{{- $secretName := ternary (include "agentic.secret.db.agent" $) (include "agentic.secret.db.coder" $) (eq $db "agent") }}
{{- $prop := ternary $es.properties.agentDbPassword $es.properties.coderDbPassword (eq $db "agent") }}
---
{{- $dbRoot := dict "root" $ "component" (printf "db-%s" $db) }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "agentic.labels" $dbRoot | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: {{ $db }}
        password: {{ `"{{ .password }}"` }}
        uri: {{ printf "\"postgresql://%s:{{ .password | urlquery }}@%s:5432/%s\"" $db (include "agentic.db.host" $) $db }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ $key }}
        property: {{ required (printf "externalSecrets.properties.%sDbPassword is required" $db) $prop }}
{{- end }}
{{- end }}
{{- if .Values.webSearch.enabled }}
---
{{- $ws := dict "root" . "component" "websearch" }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "agentic.secret.websearch" . }}
  labels:
    {{- include "agentic.labels" $ws | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "agentic.secret.websearch" . }}
    creationPolicy: Owner
  data:
    # The Brave Search API's key: this pod only.
    - secretKey: BRAVE_API_KEY
      remoteRef:
        key: {{ $key }}
        property: {{ required "externalSecrets.properties.braveApiKey is required with webSearch.enabled" $es.properties.braveApiKey }}
    # The bearer that guards /mcp: the orchestrator and the coder send it.
    - secretKey: SEARCH_MCP_TOKEN
      remoteRef:
        key: {{ $key }}
        property: {{ required "externalSecrets.properties.searchMcpToken is required with webSearch.enabled" $es.properties.searchMcpToken }}
{{- end }}
{{- end }}
