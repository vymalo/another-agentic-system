{{- if .Values.injector.enabled -}}
{{- $gw := include "agentic.injector.gatewayName" . -}}
{{- $envoySvc := include "agentic.injector.envoyServiceName" . -}}
{{- $authorino := include "agentic.injector.authorinoName" . -}}
{{- $authorinoSvc := include "agentic.injector.authorinoService" . -}}
{{- $secret := include "agentic.injector.secret" . -}}
{{- $budgetSecret := include "agentic.injector.budgetSecret" . -}}
{{- $upstream := urlParse .Values.injector.upstream.url -}}
{{- $port := regexFind ":[0-9]+$" $upstream.host | trimPrefix ":" -}}
{{- if not $port -}}
{{- $port = ternary "443" "80" (eq $upstream.scheme "https") -}}
{{- end -}}
{{- $labels := dict "root" . "component" "injector" -}}
{{- $es := .Values.externalSecrets -}}
# The model-credential injector (ADR 0084, epic sys#334 slice S9), all of it optional and off by default: Agent
# Router (Envoy AI Gateway) in front of the model endpoint, Envoy Gateway's gRPC external authorization, and
# Authorino. The controllers (Envoy Gateway, Agent Router's CRDs and controller, the Authorino operator) are the
# deployment's; these objects configure them.
#
# The Gateway is ClusterIP (EnvoyProxy's Service below), in Envoy Gateway's own namespace: it has no edge route and
# no Ingress. Agents reach it at the Service this chart pins, `<envoyServiceName>.<Envoy Gateway namespace>.svc`.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gw }}
  labels:
    {{- include "agentic.labels" $labels | nindent 4 }}
spec:
  gatewayClassName: {{ required "injector.gatewayClassName is required" .Values.injector.gatewayClassName }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ $gw }}
---
# The name of the Service Envoy Gateway creates is autogenerated unless it is pinned here, and an agent's
# model.baseUrl must be able to name it. ClusterIP: the route is internal only.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ $gw }}
  labels:
    {{- include "agentic.labels" $labels | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: {{ $envoySvc }}
        type: ClusterIP
---
# A model answer is larger than Envoy's default 32 KiB buffer.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ $gw }}
  labels:
    {{- include "agentic.labels" $labels | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gw }}
  connection:
    bufferLimit: {{ .Values.injector.bufferLimit }}
---
# The upstream model endpoint. Its path is unused: the agent sends the OpenAI path, and only the host and port are
# taken from `injector.upstream.url`.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: {{ $gw }}-upstream
  labels:
    {{- include "agentic.labels" $labels | nindent 4 }}
spec:
  endpoints:
    - fqdn:
        hostname: {{ $upstream.hostname | quote }}
        port: {{ int $port }}
{{- if eq $upstream.scheme "https" }}
---
# The upstream is https: validate it against the system CA. A private CA is the deployment's own BackendTLSPolicy.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ $gw }}-upstream
  labels:
    {{- include "agentic.labels" $labels | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: {{ $gw }}-upstream
  validation:
    hostname: {{ $upstream.hostname | quote }}
    wellKnownCACertificates: System
{{- end }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: {{ $gw }}-model
  labels:
    {{- include "agentic.labels" $labels | nindent 4 }}
spec:
  schema:
    name: OpenAI
  backendRef:
    name: {{ $gw }}-upstream
    kind: Backend
    group: gateway.envoyproxy.io
---
# Agent Router generates an HTTPRoute named after this object; the SecurityPolicy below targets that generated route.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: {{ $gw }}
  labels:
    {{- include "agentic.labels" $labels | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gw }}
  rules:
    - matches:
        - headers:
            - type: Exact
              name: {{ .Values.injector.modelHeader }}
              value: {{ .Values.injector.model | quote }}
      backendRefs:
        - name: {{ $gw }}-model
---
# The external authorizer. Plaintext gRPC on the internal hop: Envoy Gateway v1.10's `extAuth.grpc` has no TLS
# field (verified 2026-11-24 on v1.10.0); TLS here is a later item of S9.
apiVersion: operator.authorino.kuadrant.io/v1beta1
kind: Authorino
metadata:
  name: {{ $authorino }}
  labels:
    {{- include "agentic.labels" $labels | nindent 4 }}
spec:
  replicas: {{ int .Values.injector.authorino.replicas }}
  listener:
    tls:
      enabled: false
  oidcServer:
    port: 8083
    tls:
      enabled: false
---
# The injector's contract, and the only place the model credential and the caller's account are decided:
#  1. authenticate the agent pod (a TokenReview of its service-account token);
#  2. ask the broker's run-lease route for the run named by `X-Run-Id`, with the injector's own token;
#  3. cache that answer per run for at most the lease;
#  4. read the person's balance from the ledger's budget read, with the lease's account id and the injector's own
#     secret — a READ, never a debit (ADR 0084 decision 7);
#  5. add `Authorization`, `x-account-id` and `x-budget-remaining` upstream only. Envoy Gateway applies the
#     ok_response headers and replaces a client-sent header of the same name (verified 2026-11-24: exactly one header
#     at the upstream), so a client cannot choose its own balance either;
#  6. deny when the lease carries no token or no account id, or when the balance could not be read. A refused lookup
#     (the broker's 410/404) leaves the metadata unset and Authorino still applies the ok_response headers, so without
#     these rules the gateway receives `Authorization: Bearer` (an empty token) — unusable, but still a header — or an
#     empty `x-account-id`. Denied, a run with no usable lease reaches no gateway at all (ANR-662, ANR-667; verified
#     2026-11-24/25 in dev/agent-router-spike/).
#  7. a balance that is spent (zero or negative) is refused with 402 by the EnvoyExtensionPolicy below, not here:
#     Authorino v0.26.4's denial status is one code per phase (`response.unauthorized.code`), so a 402 here would make
#     every refused lease a 402 as well (ANR-669; verified 2026-11-25 in dev/agent-router-spike/).
#
# Spike result (ANR-662, 2026-11-24): it works. An ok_response header from Authorino reaches the WireMock gateway
# through Agent Router, so the injector stays these objects and needs no service of our own behind the port.
#
# `x-account-id` is the lease's `accountId`: the run's person, the `UserId` the usage ledger is keyed by (ADR 0065),
# never a provider account and never the client's own claim. Like the token it is a selector, so the client cannot
# choose it.
#
# `plain.expression`/`selector`, never `plain.value`: Authorino v0.26.4 emits a static `plain.value` as a Go struct
# dump rather than a string (verified 2026-11-24). The lease token is bare, so the scheme is prepended here.
#
# `hosts: ["*"]` because this Authorino instance is dedicated to this route and Envoy forwards the client's Host;
# the route is ClusterIP and the SecurityPolicy is scoped to its generated HTTPRoute.
apiVersion: authorino.kuadrant.io/v1beta3
kind: AuthConfig
metadata:
  name: {{ $gw }}
  labels:
    {{- include "agentic.labels" $labels | nindent 4 }}
spec:
  hosts:
    - "*"
  authentication:
    "agent":
      # The agents' audience(s) from `injector.authorino.audiences`, and always the orchestrator's own, whose projected
      # token this chart mounts for the thread titles and descriptions (card ANR-670). A deployment that names none
      # accepts no agent pod: Authorino's default is the protected service's host name, which no projected token carries.
      kubernetesTokenReview:
        audiences:
          {{- range .Values.injector.authorino.audiences }}
          - {{ . }}
          {{- end }}
          - {{ include "agentic.injector.orchestratorAudience" . }}
  metadata:
    "lease":
      # A request without a run id is denied below; do not call the broker with an empty run.
      when:
        - selector: request.headers.x-run-id
          operator: neq
          value: ""
      http:
        url: {{ printf "%s/internal/runs/{request.headers.x-run-id}/lease" (include "agentic.injector.brokerUrl" . | trimSuffix "/") | quote }}
        method: GET
        headers:
          Accept:
            value: application/json
        # The injector's own token, presented as `Authorization: Bearer <token>` (the default credentials placeholder).
        sharedSecretRef:
          name: {{ $secret }}
          key: token
      cache:
        key:
          selector: request.headers.x-run-id
        ttl: {{ int .Values.injector.broker.cacheTtlSecs }}
    "budget":
      # The person's balance, read at every model call (ADR 0084 decision 7): a READ of the ledger's budget, never a
      # debit. It needs the lease's account id, so it runs in the priority group after the lease (Authorino evaluates
      # one priority group at a time, the lower number first; v0.26.4 made `second` read `first`'s answer the same
      # way). Cached per account for `injector.budget.cacheTtlSecs`: a balance moves slower than a lease, but a stale
      # one lets a person overspend by what they spend inside the TTL, so the TTL is short (10 s by default).
      priority: 1
      when:
        - selector: auth.metadata.lease.accountId
          operator: neq
          value: ""
      http:
        url: {{ include "agentic.injector.budgetUrl" . | quote }}
        method: GET
        headers:
          Accept:
            value: application/json
        # The ledger's listener requires the injector's own shared secret, presented as `Authorization: Bearer
        # <secret>` (Authorino's `sharedSecretRef` has no other carrier). An account the ledger has never seen answers
        # 200 with a zero balance; a ledger that cannot answer is a refusal upstream, never a zero here.
        sharedSecretRef:
          name: {{ $budgetSecret }}
          key: token
      cache:
        key:
          selector: auth.metadata.lease.accountId
        ttl: {{ int .Values.injector.budget.cacheTtlSecs }}
  authorization:
    "run-id":
      patternMatching:
        patterns:
          - selector: request.headers.x-run-id
            operator: neq
            value: ""
    # A refused lookup leaves the metadata unset, and Authorino still applies the ok_response headers above: without
    # these rules the upstream receives `Authorization: Bearer` with an empty token or an empty `x-account-id`.
    # Deny, so a lease with no token and no account id means no call.
    "lease":
      patternMatching:
        patterns:
          - selector: auth.metadata.lease.token
            operator: neq
            value: ""
    "account-id":
      patternMatching:
        patterns:
          - selector: auth.metadata.lease.accountId
            operator: neq
            value: ""
    # The balance the ledger could not answer (its 401/503, or a timeout) leaves the metadata unset: refuse here, so a
    # call whose balance nobody read reaches no model. A balance the ledger DID answer — including zero, and including
    # an account it has never seen (200, zero) — passes here and is judged by the EnvoyExtensionPolicy below, which is
    # where the 402 is produced.
    "budget-readable":
      patternMatching:
        patterns:
          - selector: auth.metadata.budget.remaining_micros
            operator: neq
            value: ""
  response:
    success:
      headers:
        "Authorization":
          plain:
            selector: "Bearer {auth.metadata.lease.token}"
        "x-account-id":
          plain:
            selector: "{auth.metadata.lease.accountId}"
        # The balance the request was judged by, in micro-USD, for the EnvoyExtensionPolicy that answers 402. The
        # client's own copy of this header is replaced, and the filter removes it before the model endpoint, so the
        # person's balance never leaves the injector.
        "x-budget-remaining":
          plain:
            selector: "{auth.metadata.budget.remaining_micros}"
---
# The generated HTTPRoute of the AIGatewayRoute above has the same name. Scoping the policy to it (rather than the
# whole Gateway) is what the spike verified: `targetRefs: kind=HTTPRoute name=<route>` reports Accepted.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $gw }}-extauth
  labels:
    {{- include "agentic.labels" $labels | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $gw }}
  extAuth:
    # gRPC forwards every request header to the authorizer and applies every ok_response header upstream; there is no
    # headersToBackend list on this path.
    grpc:
      backendRefs:
        - name: {{ $authorinoSvc }}
          port: 50051
---
# The 402 a spent balance earns, which Authorino cannot produce per rule: its denial status is one code for the whole
# authorization phase (v0.26.4 `response.unauthorized.code`, 300-599). A zero balance denied there would make a refused
# lease a 402 too. Authorino therefore lets the request through carrying the balance it read on `x-budget-remaining`,
# and this Envoy Lua filter — later in the chain than ext-auth (Envoy Gateway v1.10 orders ext_authz 6 and lua 13,
# verified in its `internal/xds/translator/httpfilters.go`) — refuses a spent balance with 402 before the router calls
# the model. It also removes the header, so the person's balance never reaches the model endpoint. An absent or
# non-numeric header is refused too (503): the filter fails closed even if it runs without the authorizer's rule.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: {{ $gw }}-balance
  labels:
    {{- include "agentic.labels" $labels | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ $gw }}
  lua:
    - type: Inline
      inline: |
        function envoy_on_request(handle)
          local headers = handle:headers()
          local remaining = headers:get("x-budget-remaining")
          local micros = nil
          if remaining ~= nil then
            micros = tonumber(remaining)
          end
          if micros == nil then
            handle:respond({ [":status"] = "503", ["content-type"] = "application/json" },
              '{"error":"budget_unavailable"}')
            return
          end
          -- Signed and unclamped: a negative balance is an overshoot, and it is spent like zero.
          if micros <= 0 then
            handle:respond({ [":status"] = "402", ["content-type"] = "application/json" },
              '{"error":"model_locked"}')
            return
          end
          headers:remove("x-budget-remaining")
        end
{{- if .Values.externalSecrets.enabled }}
---
# The injector's token for the broker's run-lease route, from AWS like every secret of this chart: a property name,
# never a value. With externalSecrets off, the deployment creates this Secret itself.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "agentic.labels" $labels | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ $secret }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ required "externalSecrets.key is required" $es.key }}
        property: {{ required "injector.broker.tokenProperty is required with externalSecrets.enabled" .Values.injector.broker.tokenProperty }}
---
# The shared secret of the ledger's budget read, the same way: a property of the AWS secret, never a value. With
# externalSecrets off, the deployment creates this Secret itself.
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $budgetSecret }}
  labels:
    {{- include "agentic.labels" $labels | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ $budgetSecret }}
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ required "externalSecrets.key is required" $es.key }}
        property: {{ required "injector.budget.tokenProperty is required with externalSecrets.enabled" .Values.injector.budget.tokenProperty }}
{{- end }}
{{- end }}
