{{- $root := dict "root" . "component" "web" -}}
{{- $name := include "agentic.component" $root -}}
# The chat surface: the web's static export served by Caddy (web/Caddyfile, ADR 0047). It holds no secret and no
# configuration: the browser talks to the orchestrator through the edge, on the same origin. The image is built with
# NEXT_PUBLIC_SIGN_IN_PATH=/oauth2/start (a build argument: Next inlines it), so a 401 sends the page to sign in.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentic.labels" $root | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "agentic.selectorLabels" $root | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentic.selectorLabels" $root | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # the image's USER (a number, so Kubernetes can verify runAsNonRoot).
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "agentic.image" .Values.web.image | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # The image's caddy binary carries the file capability cap_net_bind_service (+ep): with the bounding set
              # emptied, exec fails with "operation not permitted" (as the edge's). The web listens on 3000.
              add: ["NET_BIND_SERVICE"]
          {{- if include "agentic.browser" . }}
          env:
            # The web's content security policy lets the page connect to the issuer, which it signs in at (ADR 0054). Read at request time.
            - name: WEB_CSP_CONNECT_SRC
              value: {{ include "agentic.issuerOrigin" . | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            # Caddy's configuration and data directories (XDG_*_HOME of the image); it writes nothing else
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      {{- include "agentic.placement" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentic.labels" $root | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agentic.selectorLabels" $root | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
