{{- if .Values.chat.enabled }}
{{- $root := dict "root" . "component" "chat" -}}
{{- $name := include "agentic.component" $root -}}
{{- $secret := include "agentic.secret.chat" . -}}
# The chat agent: `adam-agent` (vymalo/another-adam-rs, bin/adam-agent) serving the folder below over A2A. The image is
# the coder's (one image, two binaries); the entrypoint is replaced. The folder is read once at startup: a change is a
# new ConfigMap and a restart. Cluster-internal only: the orchestrator calls it with a bearer token.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-agent
  labels:
    {{- include "agentic.labels" $root | nindent 4 }}
data:
  instructions.md: |
    {{- .Files.Get "files/chat/instructions.md" | nindent 4 }}
  # The helpers the chat calls as tools (ADR 0050): `subagents/<name>.md`, and `subagents/researcher/` as a folder because it has
  # an `mcp.json` of its own. A sub-agent inherits nothing, not even the conversation's tools (adam-rs at the pinned revision starts a
  # child run with its message only), so the researcher's web search is its own: the search pod, when there is one. Without it the
  # researcher has no `tools:` and says so, rather than naming a tool that does not exist (a pattern that matches nothing is refused).
  subagent-planner.md: |
    {{- .Files.Get "files/chat/subagents/planner.md" | nindent 4 }}
  subagent-writer.md: |
    {{- .Files.Get "files/chat/subagents/writer.md" | nindent 4 }}
  {{- if .Values.webSearch.enabled }}
  subagent-researcher.md: |
    {{- .Files.Get "files/chat/subagents/researcher/instructions.md" | nindent 4 }}
  subagent-researcher-mcp.json: |
    {{- include "agentic.chat.researcherMcp" . | nindent 4 }}
  {{- else }}
  subagent-researcher.md: |
    {{- .Files.Get "files/chat/subagents/researcher/instructions.md" | replace "tools: [\"search__*\"]\n" "" | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentic.labels" $root | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentic.selectorLabels" $root | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentic.selectorLabels" $root | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/agent: {{ print (.Files.Get "files/chat/instructions.md") (.Files.Get "files/chat/subagents/planner.md") (.Files.Get "files/chat/subagents/writer.md") (.Files.Get "files/chat/subagents/researcher/instructions.md") .Values.webSearch.enabled | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/externalsecrets.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # uid/gid of the workspace image the adam image is built on.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chat
          image: {{ include "agentic.image" .Values.chat.image | quote }}
          imagePullPolicy: {{ .Values.chat.image.pullPolicy }}
          command: ["tini", "--", "adam-agent"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: ADAM_AGENT_DIR
              value: /etc/adam/agent
            # What the card advertises and the orchestrator posts to: the Service.
            - name: PUBLIC_URL
              value: {{ printf "http://%s:8080/" (include "agentic.svcHost" $root) | quote }}
            {{- if include "agentic.modelBaseUrlFromSecret" . }}
            # The gateway's address is kept in the AWS secret with its key (`model.baseUrlFromSecret`).
            - name: MODEL_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: MODEL_BASE_URL
            {{- else }}
            - name: MODEL_BASE_URL
              value: {{ .Values.model.baseUrl | quote }}
            {{- end }}
            - name: MODEL
              value: {{ .Values.chat.model | quote }}
            # The orchestrator's thread tools (`thread-tools/v1`) are plain http on another host, inside the cluster.
            - name: MCP_ALLOW_INSECURE
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentic.secret.db.agent" . }}
                  key: uri
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: MODEL_API_KEY
            {{- if .Values.webSearch.enabled }}
            # The bearer of the search pod, named in the researcher's `mcp.json` as `${SEARCH_MCP_TOKEN}`: the value is only here.
            - name: SEARCH_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: SEARCH_MCP_TOKEN
            {{- end }}
            - name: A2A_BEARER_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: A2A_BEARER_TOKENS
          # A TCP connect, as compose.yaml checks it: the image is not guaranteed to ship curl.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.chat.resources | nindent 12 }}
          volumeMounts:
            - name: agent
              mountPath: /etc/adam/agent
              readOnly: true
      volumes:
        - name: agent
          configMap:
            name: {{ $name }}-agent
            # A ConfigMap key is a file name; the folder the agent reads has `subagents/`.
            items:
              - { key: instructions.md, path: instructions.md }
              - { key: subagent-planner.md, path: subagents/planner.md }
              - { key: subagent-writer.md, path: subagents/writer.md }
              - { key: subagent-researcher.md, path: subagents/researcher/instructions.md }
              {{- if .Values.webSearch.enabled }}
              - { key: subagent-researcher-mcp.json, path: subagents/researcher/mcp.json }
              {{- end }}
      {{- include "agentic.placement" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentic.labels" $root | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agentic.selectorLabels" $root | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}
