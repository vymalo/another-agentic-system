{{- if .Values.networkPolicy.enabled }}
{{- $edge := dict "root" . "component" "edge" -}}
{{- $orch := dict "root" . "component" "orchestrator" -}}
{{- $chat := dict "root" . "component" "chat" -}}
# Ingress to each pod is limited to the pods that need it. Egress is not restricted (Keycloak, the model endpoint, GitHub
# and the agents' own needs), except the search pod's. The databases are not restricted either: CloudNativePG's operator and the instances talk to
# each other (deploy/chart/README.md, "Not in v0").
# The edge: Traefik is the only caller that matters, but its namespace is the cluster's to say.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentic.component" $edge }}
  labels:
    {{- include "agentic.labels" $edge | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentic.selectorLabels" $edge | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
      {{- with .Values.networkPolicy.ingressControllerNamespace }}
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      {{- end }}
---
# The web, and oauth2-proxy: the edge only.
{{- range $c := list "web" "oauth2-proxy" }}
{{- $port := ternary 3000 4180 (eq $c "web") }}
{{- $sel := dict "root" $ "component" $c }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentic.component" $sel }}
  labels:
    {{- include "agentic.labels" $sel | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentic.selectorLabels" $sel | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentic.selectorLabels" $edge | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $port }}
---
{{- end }}
# The orchestrator: the edge (the API and AG-UI), the chat agent and the agents of other charts (the thread tools).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentic.component" $orch }}
  labels:
    {{- include "agentic.labels" $orch | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentic.selectorLabels" $orch | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentic.selectorLabels" $edge | nindent 14 }}
        {{- if .Values.chat.enabled }}
        - podSelector:
            matchLabels:
              {{- include "agentic.selectorLabels" $chat | nindent 14 }}
        {{- end }}
        {{- if .Values.browser.enabled }}
        # The browser agent: an asked agent is sent the thread's tools too (thread-tools/v1).
        - podSelector:
            matchLabels:
              {{- include "agentic.selectorLabels" (dict "root" . "component" "browser") | nindent 14 }}
        {{- end }}
        {{- range .Values.networkPolicy.orchestratorFrom }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
{{- if .Values.chat.enabled }}
---
# The chat agent: the orchestrator only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentic.component" $chat }}
  labels:
    {{- include "agentic.labels" $chat | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentic.selectorLabels" $chat | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentic.selectorLabels" $orch | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- if include "agentic.oauth2Redis" . }}
---
{{- $redis := dict "root" . "component" "oauth2-redis" }}
{{- $oauth := dict "root" . "component" "oauth2-proxy" }}
# The session Redis: oauth2-proxy only, on its port only. Its egress is not restricted, as the other pods' (it needs none).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentic.component" $redis }}
  labels:
    {{- include "agentic.labels" $redis | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentic.selectorLabels" $redis | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentic.selectorLabels" $oauth | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
{{- if .Values.webSearch.enabled }}
---
{{- $ws := dict "root" . "component" "websearch" }}
# The search pod. In: the orchestrator's pods and `webSearch.allowFrom` (the coder) and, with the chat agent, the chat (its researcher sub-agent, ADR 0050), on its port only. Out: DNS, and the public
# internet on 443 and 80 (Brave's API, and the pages `fetch` is asked to read). A NetworkPolicy cannot name a host, so
# "Brave only" is not expressible: what is refused is the ranges of `webSearch.egressExcept` (the private ranges and the
# metadata address by default: a deployment adds its pod, service and node ranges where they are public), the same rule the
# server applies to `fetch` on the address it connects to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentic.component" $ws }}
  labels:
    {{- include "agentic.labels" $ws | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentic.selectorLabels" $ws | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentic.selectorLabels" $orch | nindent 14 }}
        {{- if .Values.chat.enabled }}
        # The chat agent's researcher sub-agent (ADR 0050).
        - podSelector:
            matchLabels:
              {{- include "agentic.selectorLabels" (dict "root" . "component" "chat") | nindent 14 }}
        {{- end }}
        {{- range .Values.webSearch.allowFrom }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with .Values.webSearch.egressExcept }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        - ipBlock:
            cidr: ::/0
            {{- with .Values.webSearch.egressExceptV6 }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
{{- end }}
{{- if .Values.browser.enabled }}
---
{{- $br := dict "root" . "component" "browser" }}
# The browser agent (ADR 0057). In: the orchestrator's pods (it asks the agent), the chat only with `browser.chatSubagent` (refused
# today by templates/_validate.tpl) and `browser.allowFrom` (none by default), on its port only; obscura's own port is on the pod's
# loopback and in no rule. Out: DNS; the public internet on 443 and 80, except `browser.egressExcept` and `egressExceptV6` (the
# special-purpose ranges: the pages it opens, and the model when it is public); its database (the CNPG instances of this release,
# 5432); the orchestrator's thread tools (8080); and `browser.extraEgress`. A policy is the pod's, and obscura shares the pod's network:
# what the agent may reach, obscura may too. For the internet ranges this is a second wall behind obscura's own refusal of private
# addresses; for the database and the orchestrator it is no wall, and obscura's refusal (the URL of every request and redirect hop, and
# every address a name resolves to) is the only one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentic.component" $br }}
  labels:
    {{- include "agentic.labels" $br | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentic.selectorLabels" $br | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentic.selectorLabels" $orch | nindent 14 }}
        {{- if and .Values.chat.enabled .Values.browser.chatSubagent }}
        - podSelector:
            matchLabels:
              {{- include "agentic.selectorLabels" $chat | nindent 14 }}
        {{- end }}
        {{- range .Values.browser.allowFrom }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with .Values.browser.egressExcept }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        - ipBlock:
            cidr: ::/0
            {{- with .Values.browser.egressExceptV6 }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "agentic.db.orchestrator" . }}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              {{- include "agentic.selectorLabels" $orch | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- with .Values.browser.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.rustfs.enabled }}
---
{{- $rf := dict "root" . "component" "rustfs" }}
# RustFS. In: the orchestrator's pods (the artifact store) and the Job that creates the bucket, on 9000 only. Out: DNS and nothing
# else (it needs nothing; its version check is refused here as well as by its proxy setting).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentic.component" $rf }}
  labels:
    {{- include "agentic.labels" $rf | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentic.selectorLabels" $rf | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentic.selectorLabels" $orch | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "agentic.selectorLabels" (dict "root" . "component" "rustfs-bucket") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- end }}
