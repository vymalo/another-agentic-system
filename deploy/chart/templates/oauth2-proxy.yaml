{{- $root := dict "root" . "component" "oauth2-proxy" -}}
{{- $name := include "agentic.component" $root -}}
{{- $secret := include "agentic.secret.oauth2" . -}}
# oauth2-proxy (provider keycloak-oidc) in auth_request mode behind the edge, as in compose.yaml (ADR 0033): it
# answers `/oauth2/auth` with 202 and `Authorization: Bearer <ID token>` for a session or a verified bearer token,
# and 401 otherwise; `/oauth2/start` and `/oauth2/callback` sign a person in. The client secret and the cookie
# secret are in the environment from the ExternalSecret, never on a command line.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentic.labels" $root | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentic.selectorLabels" $root | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentic.selectorLabels" $root | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/externalsecrets.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: {{ include "agentic.image" .Values.oauth2Proxy.image | quote }}
          imagePullPolicy: {{ .Values.oauth2Proxy.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --http-address=0.0.0.0:4180
            - --provider=keycloak-oidc
            - {{ printf "--oidc-issuer-url=%s" .Values.auth.issuer | quote }}
            - {{ printf "--client-id=%s" .Values.auth.clientId | quote }}
            - {{ printf "--redirect-url=https://%s/oauth2/callback" .Values.host | quote }}
            - --upstream=static://202
            - --reverse-proxy=true
            - --set-authorization-header=true
            - --skip-jwt-bearer-tokens=true
            {{- range .Values.oauth2Proxy.extraAudiences }}
            - {{ printf "--oidc-extra-audience=%s" . | quote }}
            {{- end }}
            # Defence in depth: only a person with this client role gets a session (the orchestrator checks again).
            - {{ printf "--allowed-role=%s:%s" .Values.auth.clientId .Values.auth.allowedRole | quote }}
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --code-challenge-method=S256
            - --skip-provider-button=true
            - {{ printf "--cookie-refresh=%s" .Values.oauth2Proxy.cookieRefresh | quote }}
            - {{ printf "--cookie-expire=%s" .Values.oauth2Proxy.cookieExpire | quote }}
            - --scope=openid email profile
            - --silence-ping-logging=true
            {{- range .Values.oauth2Proxy.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: OAUTH2_PROXY_COOKIE_SECRET
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.oauth2Proxy.resources | nindent 12 }}
      {{- include "agentic.placement" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentic.labels" $root | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agentic.selectorLabels" $root | nindent 4 }}
  ports:
    - name: http
      port: 4180
      targetPort: http
      protocol: TCP
