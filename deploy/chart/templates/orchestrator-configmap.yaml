{{- include "agentic.validate" . -}}
{{- $root := dict "root" . "component" "orchestrator" -}}
{{- $self := include "agentic.svcHost" $root -}}
# The orchestrator's configuration (ADR 0034, docs/api/config.md) and its agents file. Nothing here is a
# secret: every secret is a `{ env }` or `{ file }` reference to what an ExternalSecret mounts.
# `server.environment`, `auth.mode` and `defaultRole` are written here and are not values: this chart deploys
# no development stack, and a person with no role is refused (ADR 0033).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentic.component" $root }}
  labels:
    {{- include "agentic.labels" $root | nindent 4 }}
data:
  config.yaml: |
    version: 1
    server:
      environment: production
      role: all
      surfaces:
        {{- toYaml .Values.orchestrator.surfaces | nindent 8 }}
      publicUrl: {{ printf "https://%s" .Values.host | quote }}
      {{- /* Only with an origin (ADR 0047): the default render has no `cors` key, which the pinned image may not know. */}}
      {{- with .Values.orchestrator.cors.allowedOrigins }}
      cors:
        allowedOrigins:
          {{- range . }}
          - {{ . | quote }}
          {{- end }}
      {{- end }}
      {{- /* Only with a bound (ADR 0059): the pinned image may not know `server.history`, and the default is the orchestrator's own. */}}
      {{- with .Values.orchestrator.history }}
      {{- if or .maxTurns .maxPageBytes }}
      history:
        {{- with .maxTurns }}
        maxTurns: {{ int . }}
        {{- end }}
        {{- with .maxPageBytes }}
        maxPageBytes: {{ int . }}
        {{- end }}
      {{- end }}
      {{- end }}
    log:
      format: json
    database:
      url: { file: /run/secrets/db/uri }
    agents:
      file: agents.yaml
    {{- if include "agentic.hasModel" . }}
    models:
      endpoints:
        default:
          {{- if include "agentic.modelBaseUrlFromSecret" . }}
          baseUrl: { file: /run/secrets/orchestrator/model-base-url }
          {{- else }}
          baseUrl: {{ .Values.model.baseUrl | quote }}
          {{- end }}
          apiKey: { file: /run/secrets/orchestrator/model-api-key }
          timeoutSecs: {{ .Values.model.timeoutSecs }}
    {{- /* Only with a task model: an empty `tasks:` is null, which the orchestrator refuses (exit 78). */}}
    {{- if or .Values.orchestrator.tasks.title.model .Values.orchestrator.tasks.description.model }}
    tasks:
      {{- with .Values.orchestrator.tasks.title.model }}
      title: { endpoint: default, model: {{ . | quote }} }
      {{- end }}
      {{- with .Values.orchestrator.tasks.description.model }}
      description: { endpoint: default, model: {{ . | quote }} }
      {{- end }}
    {{- end }}
    {{- end }}
    ui:
      showDescriptions: {{ .Values.orchestrator.showDescriptions }}
      {{- /* Only when something is not the orchestrator's default (ADR 0059): the pinned image may not know `ui.history`. */}}
      {{- with .Values.orchestrator.history }}
      {{- if or (not .windowed) .initialTurns .pageTurns }}
      history:
        windowed: {{ .windowed }}
        {{- with .initialTurns }}
        initialTurns: {{ int . }}
        {{- end }}
        {{- with .pageTurns }}
        pageTurns: {{ int . }}
        {{- end }}
      {{- end }}
      {{- end }}
    artifacts:
      {{- if include "agentic.artifactsS3" . }}
      store: s3
      s3:
        bucket: {{ include "agentic.artifactsS3.bucket" . | quote }}
        region: {{ .Values.orchestrator.artifacts.s3.region | quote }}
        {{- with (include "agentic.artifactsS3.endpoint" .) }}
        endpoint: {{ . | quote }}
        {{- end }}
        {{- with .Values.orchestrator.artifacts.s3.prefix }}
        prefix: {{ . | quote }}
        {{- end }}
        accessKeyId: { file: /run/secrets/orchestrator/artifacts-s3-access-key-id }
        secretAccessKey: { file: /run/secrets/orchestrator/artifacts-s3-secret-access-key }
        timeoutSecs: {{ int .Values.orchestrator.artifacts.s3.timeoutSecs }}
      {{- else }}
      store: fs
      fs: { root: /var/lib/orchestrator/artifacts }
      {{- end }}
    threadTools:
      url: {{ printf "http://%s:8080" $self | quote }}
      secret: { file: /run/secrets/orchestrator/thread-tools-secret }
      allowedHosts:
        - {{ printf "%s:8080" $self | quote }}
        - {{ printf "%s.cluster.local:8080" $self | quote }}
    {{- /* Only when a server is enabled: the pinned orchestrator image has to accept every key the chart writes (deploy.yml reads this file with it). */}}
    {{- with (include "agentic.toolServers" . | trim) }}
    toolServers:
      {{- . | nindent 6 }}
    {{- end }}
    {{- /* Only when sharing is on: the default render has no `sharing` key at all (an absent section is `disabled`). */}}
    {{- if include "agentic.sharing" . }}
    sharing:
      mode: {{ .Values.sharing.mode }}
      secret: { file: /run/secrets/orchestrator/sharing-secret }
      {{- if include "agentic.sharing.public" . }}
      public:
        stepIo: {{ .Values.sharing.public.stepIo }}
        files: {{ .Values.sharing.public.files }}
      {{- end }}
    {{- end }}
    auth:
      mode: jwt
      jwt:
        issuer: {{ .Values.auth.issuer | quote }}
        audiences:
          {{- include "agentic.audiences" . | nindent 10 }}
        userClaim: {{ .Values.auth.userClaim | quote }}
        rolesClaim: {{ .Values.auth.rolesClaim | quote }}
      defaultRole: null
      roles:
        {{- include "agentic.roles" . | nindent 8 }}
      {{- /* Only with `auth.browser.enabled` (ADR 0054): the pinned orchestrator image has to accept both keys, which the default render does not write. */}}
      {{- if include "agentic.browser" . }}
      dpop:
        publicOrigins:
          - {{ printf "https://%s" .Values.host | quote }}
        maxAgeSeconds: 60
        futureSkewSeconds: 5
      browser:
        clientId: {{ .Values.auth.browser.clientId | quote }}
        scope: {{ .Values.auth.browser.scope | quote }}
      {{- end }}
  agents.yaml: |
    {{- $agents := list -}}
    {{- range (include "agentic.agents" . | fromYamlArray) -}}
    {{- $a := deepCopy . -}}
    {{- $_ := set $a "cardUrl" (tpl (toString .cardUrl) $) -}}
    {{- $agents = append $agents $a -}}
    {{- end }}
    {{- toYaml $agents | nindent 4 }}
