# another-agentic-system for a real deployment (ADR 0041). Everything that belongs to one deployment (the
# hostname, the issuer, the model) is left empty on purpose and is refused until set: the Argo CD
# Application's `helm.valuesObject` sets them (examples/netcup.values.yaml is the one for netcup).
#
# What is NOT a value, on purpose: `server.environment: production`, `auth.mode: jwt` and
# `defaultRole: null` of the orchestrator's configuration. This chart deploys no development stack,
# and a person with no role is refused (ADR 0033). templates/_validate.tpl refuses the rest.
# Secrets are not values either: each one is a property of one AWS Secrets Manager secret, read by
# External Secrets (externalSecrets below).

nameOverride: ""
# Every object is named <fullname>-<component>. Fixed, so the name does not follow the release's.
fullnameOverride: another-agentic

# The public hostname (no scheme): the Ingress, the redirect URL of oauth2-proxy and the orchestrator's
# `server.publicUrl`. REQUIRED.
host: ""

# Who may sign in (ADR 0033). The orchestrator is an OAuth2 resource server on `auth.mode: jwt`; oauth2-proxy
# signs people in and the edge passes on the ID token it forwards.
auth:
  # The OpenID Connect issuer, https, no trailing slash (`iss` of the tokens). REQUIRED.
  issuer: ""
  # The Keycloak client of oauth2-proxy. Not a secret (its secret is in AWS). It is the `aud` of the
  # tokens, so it is the default audience below.
  clientId: another-agentic
  # `auth.jwt.audiences`. Empty: [clientId].
  audiences: []
  # The claim that is the user: the e-mail (ADR 0033, owner decision 4 of 2026-10-02). `email_verified`
  # must not be false.
  userClaim: email
  # The claim that holds the roles: a Keycloak client-role mapper named `agentic_roles`
  # (deploy/keycloak/README.md).
  rolesClaim: agentic_roles
  # oauth2-proxy `--allowed-role=<clientId>:<role>`: only a person with this client role gets a session.
  allowedRole: user
  # Tokens in the browser (ADR 0054). OFF by default: the render is then the one of a chart that has never heard of it.
  #   true   the web is a public OAuth client of its own (`clientId`, deploy/keycloak/client-another-agentic-web.json), signs in at the
  #          issuer itself and sends `Authorization: DPoP` to the API. The orchestrator verifies DPoP (`auth.dpop`, `publicOrigins` is
  #          https://<host>) and tells the web its issuer at `GET /api/public/auth` (`auth.browser`); the edge serves the web's pages
  #          without sign-in, passes a `DPoP ` request on to the orchestrator without oauth2-proxy and keeps every other request to
  #          /api and /agui behind it (a cookie of before still works); the web gets `WEB_CSP_CONNECT_SRC` (the issuer's origin).
  #          Needs an orchestrator and a web image that have it, and the Keycloak client imported first (README.md, "Tokens in the
  #          browser (ADR 0054)").
  browser:
    enabled: false
    # The public Keycloak client of the web. Not a secret.
    clientId: another-agentic-web
    # The scope the web asks for: `offline_access` is what makes the refresh token an offline one.
    scope: openid email profile offline_access
  # `auth.roles` of the orchestrator (docs/api/config.md, "Roles and permissions"). Nobody reads another
  # person's thread: a scope of `any` is refused by this chart (templates/_validate.tpl). `admin` is an
  # operational name that holds `user`'s rights and the `admin` permission.
  roles:
    user:
      permissions: [agent.read, agent.invoke, thread.read, thread.write, thread.delete, artifact.read]
      scope: own
      agents: ["*"]
    admin:
      permissions: [agent.read, agent.invoke, thread.read, thread.write, thread.delete, artifact.read, admin]
      scope: own
      agents: ["*"]

# Sharing a thread by a revocable link (ADR 0040, docs/api/config.md#sharing). OFF by default: with `disabled` the configuration
# has no `sharing` key, no role holds `thread.share`, the edge has no extra route and the orchestrator's Secret no extra file, so the
# render is the one of a chart that has never heard of sharing.
#   internal  signed-in people who have the link read the thread. No edge change: `/s/<token>` is behind sign-in like the rest, and a
#             person with no session is sent to sign in and back to the link.
#   public    anybody who has the link reads it, signed in or not. The edge gains EXACTLY these routes without sign-in (the
#             orchestrator's own rate limit and the identity-header stripping stay on): the page `/s/*`, the web's static
#             files (`/_next/static/*`, the icons, `/brand/*`), `GET /api/public/shared/*` and `GET /agui/public/shared/*`. Everything else
#             is still behind oauth2-proxy.
# The HMAC key of the links is the AWS property `externalSecrets.properties.sharingSecret`, a `{ file }` reference. Needs an
# orchestrator image that has the `sharing` section (the pinned one has it, README.md "Sharing a thread").
sharing:
  mode: disabled
  # The roles of `auth.roles` that may create links: `thread.share` is added to their permissions when `mode` is not
  # `disabled` (revoking a link needs only ownership). A role not listed here is not given it.
  roles: [user, admin]
  # Only with `mode: public` (the orchestrator refuses a key that does nothing, so this chart refuses it too).
  public:
    # A public reader sees steps' labels and states, not their input, output and detail.
    stepIo: false
    # A public reader cannot open the thread's files.
    files: false

# The orchestrator's own model calls (thread titles and descriptions, ADR 0035) and the chat agent's.
# One OpenAI-compatible endpoint with streaming (ADR 0005). No model is named by the chart.
model:
  # With its /v1 prefix. Empty: the orchestrator has no model (titles and descriptions are off) and the
  # chat agent cannot be enabled, unless `baseUrlFromSecret` is on.
  baseUrl: ""
  # true: the address is not a value but a property of the AWS secret (`externalSecrets.properties.modelBaseUrl`,
  # `model_base_url`), kept there next to the key and not in git. The orchestrator reads it from a file
  # (`baseUrl: { file }`), the chat agent from its own Secret. Set `baseUrl` OR this, never both.
  # OFF by default, and **turn it on only once `orchestrator.image.tag` is at or after the commit that made
  # `baseUrl` accept `{ file }`** (README.md, "The pinned orchestrator image"): an older image refuses the configuration
  # at startup (exit 78), and Argo CD deploys this chart at HEAD.
  baseUrlFromSecret: false
  timeoutSecs: 20

orchestrator:
  image:
    repository: ghcr.io/vymalo/another-agentic-system/orchestrator
    # Bumped on every green build of main by .github/workflows/orchestrator.yml (`sha-<7 hex>`).
    # A plain key, so deploy/chart/bump-tag.sh can edit it.
    tag: sha-8a6b684
    pullPolicy: IfNotPresent
  # RUST_LOG.
  logLevel: info
  # What is mounted (docs/api/config.md, `server.surfaces`). The edge routes agui and the resource API
  # to the web; thread-tools is reached by the agents inside the cluster, never through the edge.
  # Others (mcp, webhook-*) need keys and edge routes this chart does not have yet: refused.
  surfaces: [agui, thread-tools]
  # `ui.showDescriptions`.
  showDescriptions: true
  # Opening a thread from its history (ADR 0059, docs/api/history.md): the web asks for the newest turns and the older ones as the
  # person scrolls up. The orchestrator's own defaults are on and are NOT written, so the default render reads with an image that
  # does not know these keys; set one only once `orchestrator.image.tag` is at or after the history read's merge commit (README.md).
  history:
    # `ui.history.windowed`, the kill switch. false: the web replays the whole log to open a thread, as it did before.
    windowed: true
    # `ui.history.initialTurns` (the orchestrator's default 12) and `.pageTurns` (20): the turns of the first page and of the first
    # older page, 1 to 100 and at most `maxTurns`. null: the orchestrator's default.
    initialTurns: null
    pageTurns: null
    # `server.history.maxTurns` (100; 1 to 1000), the largest page the server serves, and `.maxPageBytes` (4194304; 65536 to
    # 67108864), the frames of a page as JSON, the newest chain returned whole. null: the orchestrator's default.
    maxTurns: null
    maxPageBytes: null
  # Titles and descriptions: the model's name at `model.baseUrl`. Empty: off. Needs model.baseUrl.
  tasks:
    title:
      model: ""
    description:
      model: ""
  # The files agents hand over (ADR 0032).
  #   fs  (default) a directory on one ReadWriteOnce volume (`size`, `storageClass`), which ties the orchestrator to one pod.
  #   s3  an S3 bucket (`s3` below): AWS S3, or any S3-compatible server at `s3.endpoint`, or the RustFS of this chart (`rustfs.enabled`).
  #       The credentials are two properties of the AWS secret (externalSecrets.properties.artifactsS3AccessKeyId and
  #       artifactsS3SecretAccessKey), read by the orchestrator as files. The volume of `fs` is no longer rendered, and is kept (it is
  #       never pruned): the files of earlier threads stay on it and are not copied to the bucket (README.md, "Artifacts in S3").
  artifacts:
    store: fs
    size: 5Gi
    storageClass: longhorn
    s3:
      # The bucket, which must exist (with `rustfs.enabled` the chart creates it). Empty with `rustfs.enabled`: `rustfs.bucket`.
      bucket: ""
      region: us-east-1
      # The server, http(s), no credentials in it. Empty: AWS S3, or with `rustfs.enabled` the RustFS Service. With an endpoint the
      # bucket is in the path (`<endpoint>/<bucket>/<key>`, path style); on AWS it is the host name, so a bucket with a dot is refused.
      endpoint: ""
      # Keys go under it, so one bucket serves several deployments. Empty: none.
      prefix: ""
      timeoutSecs: 60
  # Seconds the pod may take to stop (the process drains for `server.shutdownGraceSecs`, 15).
  terminationGracePeriodSeconds: 30
  # Calls from a page of another origin (`server.cors`, ADR 0047): the desktop app (`tauri://localhost` on macOS and Linux,
  # `http://tauri.localhost` on Windows) calls the API at https://<host>. EMPTY by default: no CORS header, and the render is the
  # one of a chart that has never heard of it. Each entry is one exact origin (scheme://host[:port], never `*`). With an entry
  # the orchestrator answers CORS (no credentials, ever) and the edge passes a preflight (OPTIONS with Origin and
  # Access-Control-Request-Method on /api or /agui) to it without oauth2-proxy. Needs `auth.browser.enabled` (the apps send
  # DPoP-bound tokens) and an orchestrator image that has `server.cors` (README.md, "Calls from the desktop app").
  cors:
    allowedOrigins: []
  # The MCP servers a person may attach to a conversation (`toolServers` of the configuration, ADR 0024,
  # docs/api/config.md#toolservers). The orchestrator relays the calls and holds the credentials: an agent never sees them.
  # None unless enabled: with none enabled the configuration has no `toolServers` key at all. A server's key is a file read
  # at startup, from an ExternalSecret property (externalSecrets.properties). `agents` lists the agent ids it may be
  # attached for (every agent when empty; an id that is not in `agents` above is refused at startup); `tools` is the
  # server's own tool names the relay may expose.
  toolServers:
    # Our search pod (webSearch). Reached over its Service, bearer `externalSecrets.properties.searchMcpToken`.
    websearch:
      enabled: false
      name: Web search
      description: Search the web (Brave), and read a page.
      icon: data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNGE4YzRkIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PGNpcmNsZSBjeD0iMTEiIGN5PSIxMSIgcj0iNyIvPjxwYXRoIGQ9Im0yMCAyMC0zLjUtMy41Ii8+PC9zdmc+
      tools: [web_search, fetch]
      agents: []
      timeoutSecs: 60
    # Context7's hosted MCP server, reached directly over https with `Authorization: Bearer <key>`
    # (`externalSecrets.properties.context7ApiKey`). Verified 2026-10-04 (README.md, "Web search and Context7").
    context7:
      enabled: false
      name: Context7
      description: Current documentation and code examples for a library.
      url: https://mcp.context7.com/mcp
      icon: data:image/svg+xml;base64,
      tools: [resolve-library-id, query-docs]
      agents: []
      timeoutSecs: 60
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# The agents the orchestrator drives over A2A: agents.yaml (orchestrator/agents.example.yaml). The first is
# the default. A list is replaced as a whole by an override, not merged. `cardUrl` is a template (`tpl`):
# the coder is deployed by the adam-rs chart (release `coder`, namespace of this release) and is named here
# only by its card. It is shown as Adam (ADR 0049); the release, the Service and `tokenEnv` keep the name `coder`. Its id stays
# `coder` until `orchestrator.image.tag` reads `aliases`: the pinned image refuses that key (exit 78), so the id `adam` with
# `aliases: [coder]` comes in the pull request after the bump past ADR 0049. `aliases` are other names of an agent: a thread, a
# link or a mention that says one is about the agent, which is listed and created under `id`. `tokenEnv` is an environment
# variable the orchestrator reads the agent's bearer from; the property that fills it is `externalSecrets.agentTokens`.
agents:
  - id: coder
    name: Adam
    cardUrl: "http://coder.{{ .Release.Namespace }}.svc:8080/.well-known/agent-card.json"
    tokenEnv: CODER_A2A_TOKEN
    # The gate verifies only pushed work (ADR 0018, status note of 2026-10-04): a pull request is held to its own
    # checks, a chat that pushes nothing (a question, a demo, a chart shown in the thread) is an answer and ends done.
    gate:
      require: [agent-checks]
  - id: chat
    name: Chat
    cardUrl: "http://{{ include \"agentic.fullname\" . }}-chat.{{ .Release.Namespace }}.svc:8080/.well-known/agent-card.json"
    tokenEnv: CHAT_A2A_TOKEN

# The chat agent: adam-agent over a folder, rendered by this chart from files/chat/ (instructions.md and subagents/, copies of
# dev/agents/chat/agent/, equal by a CI check). It needs no GitHub and no tool: what most
# people use first. Its runs are in the database `agent` of the one CNPG cluster (`database`, below).
chat:
  enabled: true
  # The adam-rs image (it ships `adam-agent` beside `adam-coder`), by tag and digest, as compose.yaml pins it (`x-adam-image`: the
  # same two values). NOT moved by a workflow (bump-tag.sh knows orchestrator, web and webSearch): it moves by hand, with the pin of
  # compose.yaml and dev/coder/UPSTREAM, in the bump of the `bump-adam` skill. sha-5581d40 (since 2026-10-09; sha-0bfea49 and sha-09291a6 before it that day, sha-6478fbc until 2026-10-07) carries adam-rs ADR 0020
  # (the agent streams a model's reasoning, which the chat shows as a collapsed "Thinking" block, ADR 0044, when its model sends it) and, for adam-agent, tool
  # steps labelled with a title (a subagent's name capitalised, adam-rs ADR 0027), the build on the card (`0.1.0+5581d40` and `build/v1`, adam-rs ADR 0028),
  # the run store's schema version 3 (adam-rs ADR 0030), which the chat migrates in its database at startup, and A2A's HTTP+JSON binding beside JSON-RPC with
  # Swagger UI at /docs (adam-rs ADR 0031: public, the calls need the token; reachable only from the orchestrator, the chat's NetworkPolicy). Push notifications and
  # card signatures stay off: the chart sets no A2A_PUSH_ALLOWED_URLS and no A2A_CARD_SIGNING_KEY_FILE. Since sha-09291a6 the card lists usage/v1 (adam-rs
  # ADR 0032, ADR 0056 here): each model call's tokens reach the orchestrator's log and the web's ring. The window a report says comes from the chat's
  # environment, MODEL_CONTEXT_WINDOW, which `chat.contextWindow` below sets; unset (null, the default) the chart renders no such
  # variable, the reports carry no contextWindow and the ring shows the thread's totals but no fill. Since sha-0bfea49 (adam-rs ADR 0033) the
  # browser's obscura shares its screenshots as files (`files: true` in files/browser/mcp.json), and adam-agent takes A2A_ALLOW_INSECURE_REMOTES,
  # which the chat gets with `browser.chatSubagent` only; the image is built on the workspace image that has obscura (`/opt/obscura/bin`).
  image:
    repository: ghcr.io/vymalo/another-adam-rs/coder
    tag: sha-5581d40
    digest: sha256:ab72fad47471b6c2fc76dbb691f5fe93368f376285e44495d46a63d451c51d95
    pullPolicy: IfNotPresent
  # The model's name at `model.baseUrl`. REQUIRED with chat.enabled.
  model: ""
  # The model's context window in tokens (an integer from 1 to 2^53-1), rendered as MODEL_CONTEXT_WINDOW: the web's token ring fills
  # against it (ADR 0056). null: no fill, the ring shows totals. The deployment knows its model; the chart does not guess one.
  contextWindow: null
  # The environment variable the orchestrator reads this agent's bearer from (agents[].tokenEnv).
  tokenEnv: CHAT_A2A_TOKEN
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

web:
  image:
    repository: ghcr.io/vymalo/another-agentic-system/web
    # Bumped by .github/workflows/web.yml. The image is built with NEXT_PUBLIC_SIGN_IN_PATH=/oauth2/start,
    # which Next inlines at build time: images before the one of this chart's first release have none.
    tag: sha-8a6b684
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Web search: our own MCP server (dev/searxng-mcp, image `searxng-mcp`) over the Brave Search API, as a pod of this release.
# OFF by default. It gives an agent two tools, `web_search` and `fetch` (a public page as text, refusing private addresses);
# it is reached with a bearer token by the orchestrator (orchestrator.toolServers.websearch) and by the coder (its own chart, which
# reads the same property: added by vymalo/another-adam-rs#84, not merged when this was written),
# and by nothing else (a NetworkPolicy). Needs two properties of the AWS secret (externalSecrets.properties.braveApiKey and
# searchMcpToken). Turning it on is `webSearch.enabled: true`, once the image exists (see `image.tag`).
webSearch:
  enabled: false
  image:
    repository: ghcr.io/vymalo/another-agentic-system/searxng-mcp
    # Bumped on every green build of main by .github/workflows/searxng-mcp.yml (`sha-<7 hex>`). A plain key, so
    # deploy/chart/bump-tag.sh can edit it. `sha-0000000` is the placeholder until that first build: no such image exists,
    # and the chart refuses to render it with `enabled: true`.
    tag: sha-cf750fe
    pullPolicy: IfNotPresent
  replicas: 1
  # Who may call it besides the orchestrator's pods: NetworkPolicyPeers, written as they are in a NetworkPolicy (a
  # `podSelector` alone means this namespace; add a `namespaceSelector` for another one). The coder is another release in
  # this namespace (adam-rs's chart, release `coder`). By instance, not by name as `networkPolicy.orchestratorFrom` is: the
  # release's every pod (the single pod, or the front and the workers of the split topology, whose names differ) may call the
  # search; the thread tools are called by the pod named `coder` only.
  allowFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: coder
  # What the pod's egress to the internet excludes (the policy allows TCP 443 and 80 to 0.0.0.0/0 and ::/0 except these): the
  # private, shared, loopback and link-local ranges, so the pod cannot reach the cluster's pods or services or the metadata
  # address, and the IETF protocol assignments (192.0.0.0/24) and the benchmarking range (198.18.0.0/15). A cluster whose pods
  # or services sit in other ranges, or whose nodes have PUBLIC addresses (netcup's do), adds them here (a list is replaced as a
  # whole by an override: repeat the defaults). The server refuses such addresses for `fetch` itself too; this is the second wall.
  egressExcept:
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.168.0.0/16
    - 198.18.0.0/15
  # The same for IPv6: unique-local, link-local, both NAT64 prefixes and 6to4 (which embed an IPv4 address). Not the IPv4-mapped
  # ::ffff:0:0/96: the API server refuses it in an ipBlock (Kubernetes v1.36, verified 2026-10-07 on netcup), and such an address
  # leaves the pod as IPv4, which egressExcept covers.
  egressExceptV6:
    - fc00::/7
    - fe80::/10
    - 64:ff9b::/96
    - 64:ff9b:1::/48
    - 2002::/16
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# The browser agent (ADR 0057): adam-agent over a folder rendered from files/browser/ (instructions.md and mcp.json, copies of
# dev/agents/browser/agent/, equal by a CI check), with obscura (a headless browser with an MCP server) as a sidecar in the same pod on
# 127.0.0.1 behind a bearer. OFF by default: with `enabled: false` nothing of it is rendered. On, it is listed in the orchestrator's agents
# as `browser`, "Browser" (unless `agents` already lists that id), and others ask it: a person mentions @browser (the chat's model asks
# it with `ask_agent`, ADR 0026), and whoever `allowFrom` lets in (nobody by default). Its runs share the chat agent's database `agent`
# (runs are keyed by the folder's name, adam-rs bin/adam-agent/README.md), so turning it on needs no new database password; it needs two
# new AWS properties: externalSecrets.agentTokens.BROWSER_A2A_TOKEN (browser_a2a_token) and externalSecrets.properties.obscuraMcpToken
# (obscura_mcp_token), each random and at least 32 bytes (`openssl rand -hex 32`).
browser:
  enabled: false
  # The agent runs the chart's adam image (`chat.image`: one pin for both folder agents, moved by the `bump-adam` skill). The model is
  # `model.baseUrl` (or `model.baseUrlFromSecret`) and its key, as the chat's; `model` is its name there, empty: `chat.model`.
  model: ""
  # The model's context window in tokens, as `chat.contextWindow` (null: none is said).
  contextWindow: null
  # The environment variable the orchestrator reads the bearer from (agents[].tokenEnv); externalSecrets.agentTokens names its property.
  tokenEnv: BROWSER_A2A_TOKEN
  # One task per replica, so that a task has the browser to itself: WORKERS=1 and ONE replica. adam-agent at the pinned revision moves a
  # run between workers at every step (it has no pinning), so a second replica would let a task's next step open another pod's browser:
  # anything but 1 is refused (templates/_validate.tpl), and the Deployment is `Recreate` so that a rollout never runs two.
  replicas: 1
  # obscura (Apache-2.0) by tag and digest: the digest is the image index (linux/amd64 and arm64), verified 2026-10-09 from Docker Hub's tag
  # API and mirror.gcr.io's registry. Distroless, uid 65532, no shell; it is given `mcp --http` on 127.0.0.1 (never --stealth, never
  # --allow-private-network: it refuses private, loopback, link-local, CGNAT and metadata addresses by itself, verified by running it).
  obscura:
    image:
      repository: docker.io/h4ckf0r0day/obscura
      tag: "0.2.4"
      digest: sha256:772cf3bada266e81bc0fae0304074f4971a551e3766f412417f006273e202f0e
      pullPolicy: IfNotPresent
    # The loopback port of its MCP server, which the folder's mcp.json names (http://127.0.0.1:9223/mcp): change both or neither.
    port: 9223
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 1Gi
  # Who may call the agent besides the orchestrator's pods: NetworkPolicyPeers, as `webSearch.allowFrom`. None by default: whether Adam
  # asks it directly is open question 69. The coder's pods would be
  # `[{podSelector: {matchLabels: {app.kubernetes.io/name: coder}}}]` (adam-rs's chart labels them so) in this namespace.
  allowFrom: []
  # What the pod's egress to the internet excludes (a list is replaced as a whole by an override): the private, shared, loopback and
  # link-local ranges and the metadata address, the IETF protocol assignments (192.0.0.0/24) and the benchmarking range (198.18.0.0/15),
  # and for IPv6 unique-local, link-local, both NAT64 prefixes (64:ff9b::/96, 64:ff9b:1::/48) and 6to4 (2002::/16), which embed an IPv4
  # address. The pod also reaches DNS, its database and the orchestrator's thread tools, and nothing else.
  egressExcept:
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.168.0.0/16
    - 198.18.0.0/15
  egressExceptV6:
    - fc00::/7
    - fe80::/10
    - 64:ff9b::/96
    - 64:ff9b:1::/48
    - 2002::/16
  # More egress rules (NetworkPolicyEgressRule), for a model gateway inside the cluster or on a private address, which the rules above
  # refuse: for example `[{to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ai}}}], ports: [{port: 4000, protocol: TCP}]}]`.
  extraEgress: []
  # The chat agent's remote sub-agent `browser` (adam-rs `a2a:`, files/browser/chat-subagent.md; ADR 0057, amended 2026-10-09): a tool of
  # the chat whose work is a task of the browser agent, at its Service, with its bearer; the screenshots it takes become files of the
  # chat's run (`files: true`, adam-rs ADR 0033), so a person who asks the chat gets them. The Service is plain http, so the chat gets
  # A2A_ALLOW_INSECURE_REMOTES=true (since adam-rs 0bfea49) and the browser's NetworkPolicy admits the chat besides the orchestrator.
  # Needs browser.enabled, chat.enabled and the browser's bearer (externalSecrets.agentTokens), or the render fails. The chat reads a
  # remote task every 60 s (adam's default, no setting for it), so its answer comes about a minute after it asks.
  chatSubagent: false

# RustFS (ADR 0032, amended 2026-10-09): an S3-compatible object store of this release for `orchestrator.artifacts.store: s3`, on
# a volume of its own. OFF by default (nothing rendered). One pod (a StatefulSet of one, a single drive: no erasure coding, no
# redundancy beyond the volume's), path-style addressing only, the console off, reachable from the orchestrator only (a NetworkPolicy),
# and its egress limited to DNS: at startup it asks version.rustfs.com for the latest version, which nothing turns off in this release
# (verified 2026-10-09). Its root credentials are the orchestrator's S3 credentials (the same two AWS properties). A hook Job creates
# the orchestrator's bucket (`orchestrator.artifacts.s3.bucket`, else `bucket`) after each sync (Helm post-install/post-upgrade, Argo
# CD's PostSync).
rustfs:
  enabled: false
  # 1.0.1-preview.17, the newest git tag on 2026-10-09 (RustFS still cuts preview releases: a preview in production is the owner's
  # choice), by tag and digest: the image index (linux/amd64 and arm64), verified 2026-10-09 from Docker Hub's tag API and mirror.gcr.io.
  # Alpine, user `rustfs` (10001).
  image:
    repository: docker.io/rustfs/rustfs
    tag: 1.0.1-preview.17
    digest: sha256:662587e2bdb0262fbb570cd2e7d34467e601ff32b8256e3203dbde40557e0cd2
    pullPolicy: IfNotPresent
  # The bucket when `orchestrator.artifacts.s3.bucket` is empty. The hook Job creates whichever of the two the orchestrator writes to.
  bucket: artifacts
  storage:
    size: 10Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# oauth2-proxy (provider keycloak-oidc) in auth_request mode behind the edge: the flags are in the template, so
# a values file cannot weaken them by accident; `extraArgs` adds.
oauth2Proxy:
  # v7.15.5 (verified 2026-10-03, quay.io registry API: the digest is the image index of the -alpine tag).
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.15.5-alpine
    digest: sha256:8e4bec4f9fe4de10de63070209204075e4407503170aa19893d6e8d99f083d1b
    pullPolicy: IfNotPresent
  # How often the session's tokens are refreshed (must be shorter than the access token's lifespan:
  # deploy/keycloak/README.md sets 15 minutes), and how long a session lives.
  cookieRefresh: 10m
  cookieExpire: 12h
  # Audiences besides the client id that a bearer token may carry (`--oidc-extra-audience`), for the tokens
  # of another client. None by default: a token with the client's audience mapper carries the client id.
  extraAudiences: []
  extraArgs: []
  # Where the sessions live (README.md, "Sessions in Redis").
  #   cookie  (default) the whole session is in the browser's cookie. The render is the one of a chart that has never heard of Redis.
  #           Behind the edge's `forward_auth` a refresh is lost: oauth2-proxy answers `/oauth2/auth` with the renewed session as a
  #           `Set-Cookie`, Caddy does not pass it to the browser, and every request after `cookieRefresh` redeems the same refresh token
  #           again (no lock). If Keycloak rotates refresh tokens, or once the first one expires, the person is signed out.
  #   redis   the cookie is a ticket and the session is in a small Redis of this release (`--session-store-type=redis`): a refresh is
  #           saved there, under a lock, whether or not the browser's cookie changes. Needs the AWS property
  #           `externalSecrets.properties.oauth2RedisPassword`: add it BEFORE turning this on (README.md, "Sessions in Redis").
  sessionStore: cookie
  # The Redis of `sessionStore: redis`; nothing of it is rendered with `cookie`.
  redis:
    # Redis 8.8.3 (verified 2026-10-04, Docker Hub registry API: the digest is the image index of the -alpine tag; the image's
    # `redis` user is uid 999, gid 1000: redis/docker-library-redis, release/8.8, alpine/Dockerfile).
    image:
      repository: redis
      tag: 8.8.3-alpine
      digest: sha256:0b2b77d3ea5078274795e3177cdbdada8b96316684a38911d528534ed679b5ec
      pullPolicy: IfNotPresent
    # `maxmemory`: a number of bytes or one with kb, mb or gb. When it is reached the least recently used session is dropped (its
    # person signs in again; every session key has a lifetime, `cookieExpire`). Keep it under the memory limit below.
    maxMemory: 64mb
    # No persistence by default: a Redis that restarts has lost every session, and everybody signs in again. `true` keeps them
    # on a volume (append-only file) across a restart of the pod.
    persistence:
      enabled: false
      size: 1Gi
      storageClass: longhorn
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# The edge: Caddy 2 in front of oauth2-proxy, the orchestrator and the web, on one origin (files/Caddyfile).
# Traefik only terminates TLS and passes everything here.
edge:
  # 2.11.4 (verified 2026-10-03, Docker Hub and mirror.gcr.io: the digest is the image index of the -alpine tag).
  image:
    repository: caddy
    tag: 2.11.4-alpine
    digest: sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

# Traefik is the cluster's ingress controller (Ingress, never HTTPRoute: its Gateway API provider is off on netcup).
ingress:
  enabled: true
  className: traefik
  # The cert-manager ClusterIssuer that signs the host's certificate. cert-cloudflare is DNS-01, so the zone
  # of `host` must be editable by its Cloudflare token (unverified for segning.pro).
  clusterIssuer: cert-cloudflare
  # Empty: <fullname>-tls.
  tlsSecretName: ""
  annotations: {}

# The deployment's one Postgres (CloudNativePG): the orchestrator's database, and beside it the databases `agent` (the chat
# agent's runs) and, with `sharedDatabase.coders` (or `sharedDatabase.coder`), one per coder, each owned by a role of its own (README.md, "One database cluster").
database:
  instances: 1
  name: orchestrator
  owner: orchestrator
  storage:
    size: 10Gi
    storageClass: longhorn
  # Empty: the operator's default PostgreSQL image.
  imageName: ""
  # No backups in v0 (decision D7 of the plan; deploy/chart/README.md, "Not in v0").

# The coders' run stores are databases of the cluster above, not clusters of adam-rs's chart. One coder per GitHub owner is the
# intended shape (README.md, "Several coders, one per GitHub owner"): each is its own release of adam-rs's chart with its own
# database and its own A2A token. OFF by default (an empty list): each entry adds the role and the database `name`, and a Secret
# named `secretName` (key `uri`, an ExternalSecret over the AWS property `passwordProperty`) that that coder's chart reads as
# `database.existingSecret.name` instead of creating its own Cluster (vymalo/another-adam-rs, `deploy/coder`; the release is in
# this chart's namespace).
#
# `name` is the database and its role: lower-case letters and digits, starting with a letter (a Postgres identifier and a DNS
# label at once: no hyphen, no underscore), not `agent`, `postgres`, `template0`, `template1` or `database.name` or `database.owner`,
# and unique. `secretName` is optional (default `<name>-db-uri`). `passwordProperty` is the AWS property of the role's password,
# random and URL-safe (`openssl rand -hex 32`: it is written into a URI); required, except for the name `coder`, whose default is
# `externalSecrets.properties.coderDbPassword`.
#
#   coders:
#     - name: codervymalo
#       secretName: coder-vymalo-db-uri
#       passwordProperty: coder_vymalo_db_password
sharedDatabase:
  coders: []
  # The older form, for ONE coder, kept so values written for it render as they did: `enabled: true` is the same as
  # `coders: [{ name: coder, secretName: <secretName>, passwordProperty: <externalSecrets.properties.coderDbPassword> }]`.
  # Both at once are refused. A new deployment writes `coders`.
  coder:
    enabled: false
    secretName: coder-db-uri

# Secret values come from AWS Secrets Manager through External Secrets (ADR 0041). No secret is in this chart,
# its values or its render. The AWS secret `key` is JSON with one property per value (README.md lists them).
externalSecrets:
  # false: this chart renders no ExternalSecret and expects Secrets of the same names to exist.
  enabled: true
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  key: prod/another-agentic/env
  properties:
    # orchestrator: `threadTools.secret`, the HMAC key of the per-thread tokens, at least 32 bytes.
    threadToolsSecret: thread_tools_secret
    # orchestrator `models.endpoints.default.apiKey` and chat `MODEL_API_KEY`; read only with model.baseUrl.
    modelApiKey: model_api_key
    # orchestrator `models.endpoints.default.baseUrl` and chat `MODEL_BASE_URL`; read only with model.baseUrlFromSecret.
    modelBaseUrl: model_base_url
    # oauth2-proxy.
    oauth2ClientSecret: oauth2_client_secret
    oauth2CookieSecret: oauth2_cookie_secret
    # oauth2-proxy and its Redis, with oauth2Proxy.sessionStore: redis: the password of that Redis, read by both (one property, so the
    # sides cannot differ). Random and URL-safe (`openssl rand -hex 32`): a quote or a backslash would break the file the Redis reads.
    oauth2RedisPassword: oauth2_redis_password
    # webSearch: the Brave Search API's key (read by the search pod only, and only with webSearch.enabled).
    braveApiKey: brave_api_key
    # The bearer that guards the search pod: read by it, by the orchestrator (with toolServers.websearch) and by the coder's
    # chart (its own properties), so the sides cannot differ. Random, at least 32 bytes (`openssl rand -hex 32`).
    searchMcpToken: search_mcp_token
    # The bearer of the browser's obscura sidecar (browser.enabled), read by the sidecar and by the agent beside it, nothing else. Random,
    # at least 32 bytes (`openssl rand -hex 32`): obscura refuses a shorter one.
    obscuraMcpToken: obscura_mcp_token
    # orchestrator, with toolServers.context7: Context7's API key.
    context7ApiKey: context7_api_key
    # orchestrator, with sharing.mode other than disabled: the HMAC key of the share links, at least 32 bytes, never the same
    # value as threadToolsSecret (`openssl rand -hex 32`).
    sharingSecret: sharing_secret
    # orchestrator, with orchestrator.artifacts.store: s3: the S3 credentials (`artifacts.s3.accessKeyId` and `secretAccessKey`, files),
    # and with rustfs.enabled the RustFS root credentials too (the same two properties, so the two sides cannot differ). With RustFS, two
    # random values (`openssl rand -hex 20` and `openssl rand -hex 32`); with AWS or another server, the keys it gave.
    artifactsS3AccessKeyId: artifacts_s3_access_key_id
    artifactsS3SecretAccessKey: artifacts_s3_secret_access_key
    # The password of the database role `agent` (the chat agent's run store), read with chat.enabled. Random and URL-safe
    # (`openssl rand -hex 32`): it is also written into a connection URI.
    agentDbPassword: agent_db_password
    # The password of the database role `coder`, read with sharedDatabase.coder.enabled (and the default of the entry named `coder` of
    # sharedDatabase.coders). The same kind of value. Any other coder names its own property in its entry.
    coderDbPassword: coder_db_password
  # The bearer of each agent: the environment variable the agents file names (`tokenEnv`) and the property
  # that holds its value. The same property fills the agent's own `A2A_BEARER_TOKENS` (chat here; the
  # coder's chart reads `coder_a2a_token` by its own `externalSecrets.properties.a2aBearerTokens`), so the
  # two sides cannot differ.
  agentTokens:
    CODER_A2A_TOKEN: coder_a2a_token
    CHAT_A2A_TOKEN: chat_a2a_token
    # The browser's (browser.enabled): read by the orchestrator only when the agents file names it (the chart adds the agent then).
    BROWSER_A2A_TOKEN: browser_a2a_token

# Ingress to the pods is limited to the pods that need it. Egress is open (Keycloak, the model, GitHub), except the search
# pod's own (templates/networkpolicy.yaml): DNS and the public internet only. Who may call the search pod is `webSearch.allowFrom`.
networkPolicy:
  enabled: true
  # Namespace of the ingress controller; empty: the edge accepts any source on its port.
  ingressControllerNamespace: ""
  # The pods that may call the orchestrator besides the edge and the chat agent: the agents of other charts
  # (the coder reaches the thread tools: pods NAMED `coder`; `webSearch.allowFrom` selects by instance, see there).
  orchestratorFrom:
    - matchLabels:
        app.kubernetes.io/name: coder

# uid/gid are those of each image: the orchestrator is distroless `nonroot`, the web is `node`, oauth2-proxy
# and Caddy run as 65532, the adam image as 10001.
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
