# Layered over user-secrets.values.yaml: the middle of a rotation (README.md, "The key of the stored secrets"). `k2` is a second property of the
# AWS secret and is current; `k1` is still held, so the secrets sealed under it open until `orchestrator secrets rewrap` has re-sealed them.
orchestrator:
  userSecrets:
    keys:
      - { id: k1, property: user_secrets_key }
      - { id: k2, property: user_secrets_key_2 }
    current: k2
