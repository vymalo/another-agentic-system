# The Job that moves the files of the directory store into the bucket (ADR 0058, A5.4): what a deployment sets, beside examples/netcup.values.yaml,
# in the sync that turns `store: s3` on, once the pinned orchestrator image has the subcommand `artifacts migrate`. Off by default.
# render-check.sh and deploy.yml render, lint and validate the chart with it; the configuration it writes is the S3 one, so the pinned image
# reads it whatever its tag (the Job's command is not run by CI against an image that may not have it: deploy.yml).
orchestrator:
  artifacts:
    store: s3
    migrate:
      enabled: true
rustfs:
  enabled: true
