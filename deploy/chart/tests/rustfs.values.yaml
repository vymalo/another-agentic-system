# The artifact store in S3 on the RustFS of this release (ADR 0032, amended 2026-10-09): what a deployment sets, beside
# examples/netcup.values.yaml, after adding artifacts_s3_access_key_id and artifacts_s3_secret_access_key to the AWS secret.
# render-check.sh and deploy.yml render, lint and validate the chart with it; deploy.yml has the pinned orchestrator image read it.
orchestrator:
  artifacts:
    store: s3
rustfs:
  enabled: true
