# The model's address from the AWS secret (`model.baseUrlFromSecret`), over examples/netcup.values.yaml: no address is written,
# the orchestrator's configuration reads `baseUrl: { file }`. Off by default; CI reads this render through the pinned
# orchestrator image only once that image accepts `{ file }` there (.github/workflows/deploy.yml).
model:
  baseUrl: ""
  baseUrlFromSecret: true
