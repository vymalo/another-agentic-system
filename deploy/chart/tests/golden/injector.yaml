metadata:
  name: another-agentic-injector
  labels:
    app.kubernetes.io/name: another-agentic-system
    app.kubernetes.io/instance: another-agentic-system
    app.kubernetes.io/component: injector
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: another-agentic-injector
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: "injector-model"
      backendRefs:
        - name: another-agentic-injector-model
