# Going live: an override of compose.yaml that points the coder at a REAL model endpoint and a REAL
# GitHub, reading every value from `.env` (copy .env.example). dev/README.md, "Going live", walks through it.
#
#   cp .env.example .env            # then edit it: the real values, and secrets of your own
#   docker compose -f compose.yaml -f compose.live.yaml --profile app up --build
#   # with GitHub webhooks through smee.io (a third party that sees them), see .env.example and dev/README.md:
#   docker compose -f compose.yaml -f compose.live.yaml --profile app --profile smee up --build
#
# Needs Docker Compose v2.24.4 or newer: `!override` replaces a value instead of merging it, which older
# versions do not parse. (v2.24.4 is the release that introduced it according to Docker's documentation, read
# 2026-09-30, *unverified* by a run on that version; the file was checked with Compose v5.1.1.) Validate
# without starting anything:
#
#   docker compose -f compose.yaml -f compose.live.yaml --env-file .env.example config -q
#
# What changes, and what does not:
#   * coder        its whole environment is replaced (nothing of the dummy values or of the development-only
#                  ALLOW_LOCAL_REPOS / ALLOWED_REPO_HOSTS survives), and it no longer waits for the mocks. Its mounts are
#                  replaced too: the mock `mcp.json` is gone, so the coder starts the REAL github-mcp-server of its image
#                  (read only, with the same credential; a local process, so the coder alone sets MCP_ALLOW_STDIO), and a
#                  GitHub App's key can be mounted. Its GitHub credential is
#                  one installation's, a token (GITHUB_TOKEN) or a GitHub App (GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID and
#                  GITHUB_APP_PRIVATE_KEY_FILE, a PEM on this machine), never both; it fails closed when neither is set.
#                  CREATE_REPO_OWNERS names the owners it may create repositories for, after the person agrees (off when empty);
#   * chat, researcher
#                  the same: the real model of .env (CHAT_MODEL / RESEARCHER_MODEL, else MODEL), a bearer token
#                  of your own each (CHAT_A2A_TOKEN, RESEARCHER_A2A_TOKEN), and they no longer wait for the model
#                  mock. The researcher searches the REAL web: through `searxng-mcp` (dev/searxng-mcp, a small MCP server
#                  with the tools `web_search` and `fetch`) over `searxng`, a self-hosted SearXNG that asks the public search
#                  engines, or over Brave or Tavily with a key of your own (WEB_SEARCH_PROVIDER, below). The mock search
#                  (`mock-mcp-search`) is no longer its server, and stays up for `mcp-e2e.sh`. All three keep MCP_ALLOW_INSECURE:
#                  the thread's own tools, the orchestrator's endpoint they are told about in every message, are
#                  plain http on the compose network (still with the thread's own short-lived bearer token). This
#                  file is a LOCAL stack with real credentials, not a deployment: a deployment serves the
#                  orchestrator over https and never sets MCP_ALLOW_INSECURE (adam-rs bin/adam-coder/README.md);
#   * searxng, searxng-mcp
#                  new here: the live web search of the researcher (the MCP server's `fetch` reads a page a model names, and
#                  refuses private, loopback and link-local addresses). Neither publishes a port: only the compose network
#                  reaches them. SearXNG sends the queries to the public search engines, which see them: a third party,
#                  like smee.io. Brave or Tavily instead: WEB_SEARCH_PROVIDER=brave plus BRAVE_API_KEY, or =tavily plus
#                  TAVILY_API_KEY (.env.example); `searxng` then starts but is not asked;
#   * mock-openai, mock-github, mock-github-mcp, git-server, mock-ci, mock-model
#                  move to the profile `offline-mocks`, which is never enabled: a real model, a real GitHub and
#                  a real CI replace them. Do not enable that profile with this file;
#   * orchestrator its configuration becomes dev/orchestrator.live.yaml (the same keys, no title model: that one is read from
#                  .env, see the variables below) and its agents file dev/agents.live.yaml (the coder is gated on its own
#                  checks; CI is opt-in there, because `mock-ci/build` is not the name of a real check), and the
#                  secrets come from .env instead of the dummies of compose.yaml;
#   * edge, oauth2-proxy, mock-oidc, web, postgres, the WireMock agents: unchanged. The sign-in is still the mock issuer's,
#                  which approves anybody (dev@example.com unless you say otherwise): the stack is for 127.0.0.1 only. Do not
#                  publish it on a network you do not trust, live or not.
#
# The `:?` forms stop `docker compose` with the message after them when a variable is missing or empty.

services:
  coder:
    # `!override` replaces the list instead of appending to it: the mocks are no longer dependencies.
    depends_on: !override
      coder-postgres:
        condition: service_healthy
    environment: !override
      DATABASE_URL: postgres://postgres:postgres@coder-postgres:5432/coder
      MODEL_BASE_URL: "${MODEL_BASE_URL:?set MODEL_BASE_URL in .env (an OpenAI-compatible endpoint, with /v1)}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      MODEL: "${MODEL:?set MODEL in .env (the coder's model alias)}"
      OPENCODE_MODEL: "${OPENCODE_MODEL:-${MODEL}}"
      GITHUB_API_URL: "${GITHUB_API_URL:-https://api.github.com}"
      # One installation's credential: a token OR a GitHub App, never both (the coder exits at startup when both are set or
      # when neither is). Empty is "not set". The App's key is a file: GITHUB_APP_PRIVATE_KEY_FILE is mounted below, and its
      # path in the container is set only when GITHUB_APP_ID is. The same variables reach the github-mcp-server child (its mcp.json).
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_INSTALLATION_ID: "${GITHUB_APP_INSTALLATION_ID:-}"
      GITHUB_APP_PRIVATE_KEY_PATH: "${GITHUB_APP_ID:+/run/github-app/key.pem}"
      # GitHub Enterprise for the MCP server (https://<host>); GITHUB_API_URL above is the coder's own, separate setting.
      GITHUB_MCP_HOST: "${GITHUB_MCP_HOST:-}"
      # The owners (users or organisations) the coder may create repositories for, after the person says yes. Empty: it never creates one.
      CREATE_REPO_OWNERS: "${CREATE_REPO_OWNERS:-}"
      ALLOWED_REPO_HOSTS: "${ALLOWED_REPO_HOSTS:-github.com}"
      A2A_BEARER_TOKENS: "${CODER_A2A_TOKEN:?set CODER_A2A_TOKEN in .env (32 random bytes: openssl rand -hex 32)}"
      PUBLIC_URL: http://coder:8080/
      WORKSPACE_ROOT: /work
      ADAM_AGENT_DIR: /etc/adam/agent # the folder compose.yaml mounts there (volumes are merged, not replaced)
      # The thread's own tools (thread-tools/v1: the screen's catalog for Choices) are plain http to the orchestrator on the
      # compose network, which an agent reaches only when allowed on purpose. Local stacks only (see the header: never in a
      # deployment, which serves the orchestrator over https); without it the coder asks in text.
      MCP_ALLOW_INSECURE: "true"
      # The coder's own folder starts the real `github-mcp-server` (a `command` in its mcp.json: a local process), which an agent
      # may do only when its deployment says so (adam-rs #68: the image sets no MCP_ALLOW_STDIO since d56dd94; without it the coder
      # stops at startup, exit 78, naming the variable). The coder alone: the chat and the researcher use http servers only and
      # keep refusing local processes, and the offline coder reads GitHub through the http mock (no stdio there).
      MCP_ALLOW_STDIO: "true"
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME:-adam-coder}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL:-adam-coder@users.noreply.github.com}"
      PR_DRAFT: "${PR_DRAFT:-false}"
    # `!override`: no mock `mcp.json` over the folder's (the real github-mcp-server runs), and the App's key, when there is one.
    # An unset GITHUB_APP_PRIVATE_KEY_FILE mounts an empty placeholder (an empty file is not a secret) that nothing reads.
    volumes: !override
      - coder-work:/work
      - ${CODER_AGENT_DIR:-./dev/coder/agent}:/etc/adam/agent:ro
      - ${GITHUB_APP_PRIVATE_KEY_FILE:-./dev/coder/no-github-app-key.pem}:/run/github-app/key.pem:ro
    # A model served on the host (Ollama, LM Studio, vLLM) is http://host.docker.internal:<port>/v1; Docker
    # Desktop knows that name, a Linux engine needs this line. Harmless when the model is elsewhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The chat and the researcher are the same adam-agent images and folders as offline; only the model and the secrets are real.
  # `environment: !override` replaces the offline values (nothing of `mock-persona`, `mock-researcher` or the dummy tokens
  # survives), and `depends_on: !override` drops the model mock they no longer use.
  chat:
    depends_on: !override
      agents-postgres:
        condition: service_healthy
    environment: !override
      DATABASE_URL: postgres://postgres:postgres@agents-postgres:5432/agents
      MODEL_BASE_URL: "${MODEL_BASE_URL:?set MODEL_BASE_URL in .env (an OpenAI-compatible endpoint, with /v1)}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      MODEL: "${CHAT_MODEL:-${MODEL:?set MODEL (or CHAT_MODEL) in .env}}"
      A2A_BEARER_TOKENS: "${CHAT_A2A_TOKEN:?set CHAT_A2A_TOKEN in .env (32 random bytes: openssl rand -hex 32)}"
      PUBLIC_URL: http://chat:8080/
      ADAM_AGENT_DIR: /etc/adam/agent # the folder compose.yaml mounts there
      MCP_ALLOW_INSECURE: "true" # local stacks only: the thread's own tools are plain http to the orchestrator (see the coder)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  researcher:
    depends_on: !override
      agents-postgres:
        condition: service_healthy
      searxng-mcp:
        condition: service_healthy
    environment: !override
      DATABASE_URL: postgres://postgres:postgres@agents-postgres:5432/agents
      MODEL_BASE_URL: "${MODEL_BASE_URL:?set MODEL_BASE_URL in .env (an OpenAI-compatible endpoint, with /v1)}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      MODEL: "${RESEARCHER_MODEL:-${MODEL:?set MODEL (or RESEARCHER_MODEL) in .env}}"
      A2A_BEARER_TOKENS: "${RESEARCHER_A2A_TOKEN:?set RESEARCHER_A2A_TOKEN in .env (32 random bytes: openssl rand -hex 32)}"
      PUBLIC_URL: http://researcher:8080/
      ADAM_AGENT_DIR: /etc/adam/agent # the folder compose.yaml mounts there
      # The bearer token of searxng-mcp (the folder's mcp.json names the variable, the value is here). It guards a service the
      # compose network alone reaches; set your own in .env all the same.
      SEARCH_MCP_TOKEN: "${SEARCH_MCP_TOKEN:-dev-search-token}"
      MCP_ALLOW_INSECURE: "true" # local stacks only: searxng-mcp and the thread's own tools are plain http on the compose network
    # The folder is the offline one (its instructions say what to do with a `search__fetch` tool when there is one); live, its
    # `mcp.json` is replaced by this one, which names searxng-mcp and lets the agent have both its tools. Volumes merge by
    # target, so this is added beside the folder's mount. A copy of the folder in RESEARCHER_AGENT_DIR needs an `mcp.json`.
    volumes:
      - ./dev/agents/researcher/mcp.live.json:/etc/adam/agent/mcp.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # SearXNG, a self-hosted metasearch engine, pinned by tag AND digest (verified 2026-10-02, see dev/README.md, "Web search
  # for real"). Its settings (dev/searxng/settings.yml) turn the JSON format on; the secret key is SEARXNG_SECRET (.env). The
  # image's entrypoint changes the owner of /etc/searxng when it runs as root, which on a mounted settings file would be
  # an error and nothing more: FORCE_OWNERSHIP=false says not to. It publishes no port.
  searxng:
    profiles: [app]
    image: docker.io/searxng/searxng:2026.9.30-a9d990033@sha256:a07a5cd2da2c63d66e559f9e4d3a3db106cfc6c32fb0ac70abe91cc28bcd7350
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:-dev-only-searxng-secret-change-it-in-env}"
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./dev/searxng/settings.yml:/etc/searxng/settings.yml:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The image's own interpreter (the entrypoint runs granian from this virtualenv): the image is not guaranteed to ship curl or wget.
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  # The web-search MCP server the researcher uses (dev/searxng-mcp): `web_search` (SearXNG, Brave or Tavily) and `fetch` (one
  # page as plain text). Streamable HTTP at http://searxng-mcp:8080/mcp, bearer SEARCH_MCP_TOKEN. No port is published.
  searxng-mcp:
    profiles: [app]
    build:
      context: ./dev/searxng-mcp
    image: another-agentic-system/searxng-mcp:dev
    depends_on:
      searxng:
        condition: service_healthy
    environment:
      SEARCH_MCP_TOKEN: "${SEARCH_MCP_TOKEN:-dev-search-token}"
      WEB_SEARCH_PROVIDER: "${WEB_SEARCH_PROVIDER:-searxng}"
      SEARXNG_URL: http://searxng:8080
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  mock-openai:
    profiles: !override [offline-mocks]
  mock-github:
    profiles: !override [offline-mocks]
  mock-github-mcp:
    profiles: !override [offline-mocks]
  git-server:
    profiles: !override [offline-mocks]
  mock-ci:
    profiles: !override [offline-mocks]
  mock-model:
    profiles: !override [offline-mocks]

  orchestrator:
    # The anchor's volumes are replaced again: the live configuration (a whole file, the same path), the live agents file,
    # and the MCP tokens.
    volumes: !override
      - ./dev/orchestrator.live.yaml:/etc/orchestrator/config.yaml:ro
      - ./dev/agents.live.yaml:/etc/orchestrator/agents.yaml:ro
      - ./dev/mcp-tokens.yaml:/etc/orchestrator/mcp-tokens.yaml:ro
      - orchestrator-artifacts:/var/lib/orchestrator/artifacts
    environment:
      CODER_A2A_TOKEN: "${CODER_A2A_TOKEN:?set CODER_A2A_TOKEN in .env (32 random bytes: openssl rand -hex 32)}"
      CHAT_A2A_TOKEN: "${CHAT_A2A_TOKEN:?set CHAT_A2A_TOKEN in .env (32 random bytes: openssl rand -hex 32)}"
      RESEARCHER_A2A_TOKEN: "${RESEARCHER_A2A_TOKEN:?set RESEARCHER_A2A_TOKEN in .env (32 random bytes: openssl rand -hex 32)}"
      WEBHOOK_GITHUB_SECRETS: "${WEBHOOK_GITHUB_SECRETS:?set WEBHOOK_GITHUB_SECRETS in .env (at least 32 bytes: openssl rand -hex 32)}"
      # The generic signed webhook is not used live: a secret of its own that nothing knows.
      WEBHOOK_GENERIC_SECRETS: "${WEBHOOK_GENERIC_SECRETS:-${WEBHOOK_GITHUB_SECRETS}}"
      MCP_TOKEN_DEV: "${MCP_TOKEN_DEV:?set MCP_TOKEN_DEV in .env (at least 32 bytes: openssl rand -hex 32)}"
      # The model that writes the thread titles: the agents' endpoint and key, and `TITLE_MODEL` (a cheap model is enough),
      # else MODEL. The offline `mock-model` is gone from this stack. These three are variables, not keys of the file, because
      # a YAML file cannot read `.env`: they are the legacy way to say `models.endpoints.default` and `tasks.title`, and the
      # orchestrator logs a warning for each (dev/orchestrator.live.yaml says why, and what replaces them).
      ORCH_MODEL_BASE_URL: "${MODEL_BASE_URL:?set MODEL_BASE_URL in .env (an OpenAI-compatible endpoint, with /v1)}"
      ORCH_MODEL_API_KEY: "${MODEL_API_KEY:-}"
      ORCH_TITLE_MODEL: "${TITLE_MODEL:-${MODEL:?set MODEL in .env (the model alias)}}"
