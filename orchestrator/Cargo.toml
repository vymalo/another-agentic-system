[workspace]
resolver = "3"
members = ["crates/*", "bin/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
orch-config = { path = "crates/config" }
orch-core = { path = "crates/core" }
orch-ports = { path = "crates/ports" }
orch-store-postgres = { path = "crates/store-postgres" }
orch-a2a-mapping = { path = "crates/a2a-mapping" }
orch-agent-a2a = { path = "crates/agent-a2a" }
orch-agent-adam = { path = "crates/agent-adam" }
orch-registry-platform = { path = "crates/registry-platform" }
orch-auth-header = { path = "crates/auth-header" }
orch-auth-jwt = { path = "crates/auth-jwt" }
orch-model-openai = { path = "crates/model-openai" }
orch-tools-mcp = { path = "crates/tools-mcp" }
orch-artifacts-fs = { path = "crates/artifacts-fs" }
orch-artifacts-s3 = { path = "crates/artifacts-s3" }
orch-svg-clean = { path = "crates/svg-clean" }
orch-app = { path = "crates/app" }
orch-api = { path = "crates/api" }
orch-surface-agui = { path = "crates/surface-agui" }
orch-surface-mcp = { path = "crates/surface-mcp" }
orch-surface-thread-tools = { path = "crates/surface-thread-tools" }
orch-surface-webhook = { path = "crates/surface-webhook" }
orch-testsupport = { path = "crates/testsupport" }
orch-thread-token = { path = "crates/thread-token" }
orch-agui-proto = { path = "crates/agui-proto" }
orch-agui-projection = { path = "crates/agui-projection" }
# The adam-rs crates (ADR 0015), all pinned to one full commit sha, never a branch or a tag; a PR
# bumps them together. `adam-host` is the process plumbing every adam-rs host shares (the `Role`
# enum and the role-aware `Host` supervisor). The others are for `orch-agent-adam` only, behind the
# binary's off-by-default feature `agent-local`: the durable runtime, the A2A task backend over it,
# and the Postgres store and notifier.
#
# The two Postgres crates turn off their default `tls-rustls` feature: it selects sqlx's
# `tls-rustls-ring`, and this workspace uses `tls-rustls-aws-lc-rs` (one TLS backend per process).
adam-host = { git = "https://github.com/vymalo/another-adam-rs", rev = "4edee180efaa39b2464822d706da27165dfc457d", default-features = false, features = ["supervisor"] }
adam-core = { git = "https://github.com/vymalo/another-adam-rs", rev = "4edee180efaa39b2464822d706da27165dfc457d" }
adam-runtime = { git = "https://github.com/vymalo/another-adam-rs", rev = "4edee180efaa39b2464822d706da27165dfc457d" }
adam-a2a = { git = "https://github.com/vymalo/another-adam-rs", rev = "4edee180efaa39b2464822d706da27165dfc457d" }
adam-a2a-runtime = { git = "https://github.com/vymalo/another-adam-rs", rev = "4edee180efaa39b2464822d706da27165dfc457d" }
adam-store-postgres = { git = "https://github.com/vymalo/another-adam-rs", rev = "4edee180efaa39b2464822d706da27165dfc457d", default-features = false }
adam-notify-postgres = { git = "https://github.com/vymalo/another-adam-rs", rev = "4edee180efaa39b2464822d706da27165dfc457d", default-features = false }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
anyhow = "1.0.104"
uuid = { version = "1.26", features = ["v7", "serde"] }
jiff = { version = "0.2.37", features = ["serde"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures = "0.3.34"
bytes = "1"
# The S3 artifact store (ADR 0032, `orch-artifacts-s3`): only the `aws` backend (S3 and compatible servers),
# not the local file system, Azure, GCP or plain HTTP. Its reqwest is the workspace's 0.13 and its TLS
# provider aws-lc-rs, the one backend of this process.
object_store = { version = "0.14", default-features = false, features = ["aws"] }
percent-encoding = "2"
# The SVG sanitizer (ADR 0032, `orch-svg-clean`): the XML reader `object_store` already brings.
quick-xml = { version = "0.41", default-features = false }
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout", "limit"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "json", "uuid", "migrate", "macros"] }
jiff-sqlx = { version = "0.2", features = ["postgres"] }
a2a-lf = "0.3.1"
a2a-client-lf = "0.2.5"
a2a-server-lf = "0.4.4"
async-trait = "0.1.92"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
serde_norway = "0.9.42"
jsonschema = { version = "0.58", default-features = false }
eventsource-stream = "0.2.3"
proptest = "1"
regex = "1"
url = "2"
chrono = { version = "0.4", default-features = false }
# The MCP server surface (ADR 0019). `server` brings the handler traits and the JSON Schema
# derivation, `transport-streamable-http-server` the tower service that `orch-surface-mcp` mounts.
# The tests add the client side as a dev-dependency.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-streamable-http-server"] }
secrecy = "0.10"
schemars = "1"
subtle = "2.6"
# The operating system's random bytes, for the nonce of a share link (`orch-ports`, ADR 0040).
getrandom = "0.3"
sha2 = "0.10"
# Webhook signatures (ADR 0017): HMAC-SHA-256, verified in constant time by `Mac::verify_slice`
# (digest 0.10.7, `ct_eq`), over the same sha2 as the MCP tokens. Secrets are `secrecy` strings.
hmac = "0.12"
# The thread-tools token (`orch-thread-token`): base64url without padding, the encoding of a JWS.
base64 = "0.22"
