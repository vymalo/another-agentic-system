[package]
name = "orch-platform-credentials-openbao"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "PlatformClientCertificates from OpenBao PKI: the orchestrator's workload certificate, signed over its Kubernetes service-account login and renewed before it expires (ANR-809)."
readme = "README.md"

[dependencies]
orch-ports.workspace = true
base64.workspace = true
jiff.workspace = true
# The in-memory P-256 key and the CSR; aws-lc-rs underneath, the one crypto backend of this process.
rcgen.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing.workspace = true
url.workspace = true
# Reads the issued leaf (public data) to check it before it is used.
x509-cert.workspace = true
zeroize = { workspace = true, features = ["serde"] }

[dev-dependencies]
orch-core.workspace = true
orch-ports = { workspace = true, features = ["testkit"] }
axum.workspace = true
# The fake PKI parses the CSR it is sent, which rcgen does behind `x509-parser`.
rcgen = { workspace = true, features = ["x509-parser"] }
time = { version = "0.3", default-features = false }
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync", "time", "net"] }

[lints]
workspace = true
