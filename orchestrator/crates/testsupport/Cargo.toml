[package]
name = "orch-testsupport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Test-only helpers: an in-process fake A2A agent (a2a-server-lf), a test instance of the orchestrator over real HTTP, and small HTTP/SSE clients."
readme = "README.md"

[dependencies]
orch-core.workspace = true
orch-ports.workspace = true
orch-app.workspace = true
orch-api.workspace = true
orch-surface-agui.workspace = true
a2a-lf.workspace = true
a2a-server-lf.workspace = true
async-trait.workspace = true
axum.workspace = true
futures.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
uuid.workspace = true
reqwest = { workspace = true, features = ["stream"] }
# The agent's side of the thread tools: the `thread-tools` script of the fake agent calls the
# orchestrator's endpoint with rmcp's own client, as a real agent does.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
bytes = "1"

[lints]
workspace = true
