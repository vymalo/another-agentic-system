[package]
name = "orch-credential-broker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "CredentialBroker (ADR 0046): keeps the credentials of a person's MCP servers in a SecretStore, runs OAuth discovery, PKCE S256, the resource parameter, client registration and refresh, and lends short leases; every URL it fetches goes through the egress guard."
readme = "README.md"

[dependencies]
orch-core.workspace = true
orch-ports.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["sync", "time", "net", "rt"] }
reqwest.workspace = true
rustls.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
getrandom.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
orch-ports = { workspace = true, features = ["testkit"] }
axum.workspace = true
# `test-util`: a test on a paused clock (a lookup that never answers).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "test-util"] }
tracing-subscriber.workspace = true
futures.workspace = true

[lints]
workspace = true
