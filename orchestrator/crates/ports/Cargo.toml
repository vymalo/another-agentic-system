[package]
name = "orch-ports"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Ports (traits) for every infrastructure boundary of the orchestrator, plus a conformance testkit and in-memory implementations."
readme = "README.md"

[features]
default = []
# In-memory implementations (MemoryStore, MemoryWakeup, ScriptedAgent) and the
# conformance testkit. Enable as a dev-dependency feature in adapter crates.
testkit = ["dep:tokio", "dep:tokio-stream"]

[dependencies]
orch-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
jiff.workspace = true
futures.workspace = true
bytes.workspace = true
sha2.workspace = true
# `derive` makes the compiler check that every field of a secret is wiped (`SecretMaterial`, `ToolSecret`).
zeroize = { workspace = true, features = ["derive"] }
getrandom.workspace = true
tracing.workspace = true
# The constant-time comparison of an OAuth `state`.
subtle.workspace = true
# The URL parser the HTTP clients use, so the guard judges what a client would connect to (egress.rs).
url.workspace = true
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true }
orch-ports = { path = ".", features = ["testkit"] }

[lints]
workspace = true
