[package]
name = "orch-prompt-signer-static"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "A PromptSigner for tests (ADR 0087, the note of 2026-11-25): an Ed25519 key and a certificate chain read from PEM files, never renewed. Not for a deployment."
readme = "README.md"

[dependencies]
orch-ports.workspace = true
orch-prompt-statement.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
orch-ports = { workspace = true, features = ["testkit"] }
serde_json.workspace = true
tokio = { workspace = true }

[lints]
workspace = true
