[package]
name = "orch-prompt-statement"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The prompt statement of the cloud path (ADR 0087, the note of 2026-11-25): the RFC 8785 payload the orchestrator signs in the place of a device's prompt key, its integrity rule against the AG-UI request, and the compact JWS around it. Pure: no I/O, no clock, no async. It never verifies a signature."
readme = "README.md"

[dependencies]
base64.workspace = true
# ECMAScript's printing of a number, which RFC 8785 requires; already in the lock through adam-a2a.
ryu-js.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[lints]
workspace = true
