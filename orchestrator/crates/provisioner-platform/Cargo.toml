[package]
name = "orch-provisioner-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "AgentProvisioner over the platform's Platform API owner routes: a person's own agent made, resumed and waited for."
readme = "README.md"

[dependencies]
orch-core.workspace = true
orch-ports.workspace = true
reqwest.workspace = true
rustls.workspace = true
secrecy.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
url.workspace = true

[dev-dependencies]
orch-ports = { workspace = true, features = ["testkit"] }
axum.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "sync"] }

[lints]
workspace = true
