[package]
name = "orch-artifacts-fs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "ArtifactStore over a directory: temp file, fsync and atomic rename, mode 0600, the meta in a JSON file beside the bytes. For development and a single node."
readme = "README.md"

[dependencies]
orch-ports.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { workspace = true, features = ["io"] }
uuid.workspace = true

[dev-dependencies]
orch-core.workspace = true
orch-ports = { workspace = true, features = ["testkit"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
