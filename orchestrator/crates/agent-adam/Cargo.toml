[package]
name = "orch-agent-adam"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Local agents for the orchestrator (ADR 0015): AgentClient over adam-rs agents hosted in the orchestrator's own process, journaled in its Postgres under the prefix orch_agent_, on pools of orch-pg-connect."
readme = "README.md"

[features]
default = []
# The scripted agent, `LocalFixture`, `LocalWorld` and a Postgres test schema: what the
# conformance, durability and end-to-end tests run on. Enable as a dev-dependency feature.
# The embedded build (ADR 0076, ADR 0015): adam-engine on adam-store-sqlite, no server and no
# Postgres driver of adam's own. Wiring only; the adapter that uses it comes next.
embedded = ["dep:adam-engine", "dep:adam-store-sqlite"]
testkit = ["orch-ports/testkit", "dep:jiff", "dep:uuid"]

[dependencies]
orch-core.workspace = true
orch-ports.workspace = true
orch-a2a-mapping.workspace = true
orch-pg-connect.workspace = true
adam-core.workspace = true
adam-runtime.workspace = true
adam-a2a.workspace = true
adam-a2a-runtime.workspace = true
adam-store-postgres.workspace = true
adam-notify-postgres.workspace = true
adam-postgres.workspace = true
adam-engine = { workspace = true, optional = true }
adam-store-sqlite = { workspace = true, optional = true }
a2a-lf.workspace = true
async-trait.workspace = true
deadpool-postgres.workspace = true
futures.workspace = true
jiff = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid = { workspace = true, optional = true }

[dev-dependencies]
orch-store-postgres.workspace = true
orch-ports = { workspace = true, features = ["testkit"] }
orch-agent-adam = { path = ".", features = ["testkit"] }
# The parity test serves the local runtime over A2A HTTP and reads it back through the remote client.
orch-agent-a2a.workspace = true
axum.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
