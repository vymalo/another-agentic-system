[package]
name = "orch-agent-adam"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Local agents for the orchestrator (ADR 0015): AgentClient over adam-rs agents hosted in the orchestrator's own process, journaled in its Postgres under the prefix orch_agent_."
readme = "README.md"

[features]
default = []
# The scripted agent, `LocalFixture`, `LocalWorld` and a Postgres test schema: what the
# conformance, durability and end-to-end tests run on. Enable as a dev-dependency feature.
testkit = ["orch-ports/testkit", "dep:chrono", "dep:uuid"]

[dependencies]
orch-core.workspace = true
orch-ports.workspace = true
orch-a2a-mapping.workspace = true
adam-core.workspace = true
adam-runtime.workspace = true
adam-a2a.workspace = true
adam-a2a-runtime.workspace = true
adam-store-postgres.workspace = true
adam-notify-postgres.workspace = true
a2a-lf.workspace = true
async-trait.workspace = true
chrono = { workspace = true, optional = true }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid = { workspace = true, optional = true }

[dev-dependencies]
orch-store-postgres.workspace = true
orch-ports = { workspace = true, features = ["testkit"] }
orch-agent-adam = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
