[package]
name = "orch-tools-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "ToolServerClient over MCP (streamable HTTP, rmcp's client): the orchestrator lists the tools of an MCP server and calls one, with the server's credentials, a timeout and a bound on the result."
readme = "README.md"

[dependencies]
orch-ports.workspace = true
# The client side of rmcp, for this crate only (the surfaces use its server side).
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
thiserror.workspace = true

[dev-dependencies]
orch-ports = { workspace = true, features = ["testkit"] }
orch-testsupport.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
axum.workspace = true

[lints]
workspace = true
