[package]
name = "orch-surface-chat-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The legacy interaction surface of the chat API (createThread, postMessage, listEvents, streamEvents), mounted by ORCH_SURFACES=chat-api. Deprecated in favour of AG-UI."
readme = "README.md"

[dependencies]
orch-core.workspace = true
orch-app.workspace = true
orch-ports.workspace = true
orch-api.workspace = true
axum.workspace = true
serde.workspace = true
futures.workspace = true

[dev-dependencies]
orch-ports = { workspace = true, features = ["testkit"] }
serde_json.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["stream"] }
bytes = "1"
jsonschema.workspace = true
serde_norway.workspace = true
tokio-util.workspace = true
jiff.workspace = true

[lints]
workspace = true
