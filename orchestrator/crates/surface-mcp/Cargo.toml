[package]
name = "orch-surface-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The MCP server surface: list_agents, start_job, get_job, answer and cancel_job over streamable HTTP (stateless), guarded by static bearer tokens. Mounted by ORCH_SURFACES=mcp."
readme = "README.md"

[dependencies]
orch-core.workspace = true
orch-app.workspace = true
orch-ports.workspace = true
orch-api.workspace = true
rmcp.workspace = true
schemars.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
secrecy.workspace = true
subtle.workspace = true
sha2.workspace = true
uuid.workspace = true
futures.workspace = true
jiff.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
orch-ports = { workspace = true, features = ["testkit"] }
orch-testsupport.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest.workspace = true
# `test-util` gives tests/wait.rs its paused clock.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
