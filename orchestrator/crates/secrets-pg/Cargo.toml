[package]
name = "orch-secrets-pg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "SecretStore in the orchestrator's own Postgres (ADR 0046): each secret sealed with AES-256-GCM under a key from the configuration, bound to its owner, server and version, with key rotation by key id (rewrap)."
readme = "README.md"

[dependencies]
orch-core.workspace = true
orch-ports.workspace = true
aes-gcm.workspace = true
getrandom.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Postgres (ADR 0076, sys#382 E1): the connection string and TLS as sqlx read them, a deadpool pool,
# and the migrations in the history sqlx kept.
orch-pg-connect.workspace = true
orch-pg-migrate.workspace = true
# `with-jiff-0_2` binds the write's instant (a `jiff::Timestamp`, the store's clock) as a
# `timestamptz`, so the 24-hour grace of the vault is the clock's and not the database's.
tokio-postgres = { workspace = true, features = ["with-jiff-0_2"] }
deadpool-postgres.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
orch-ports = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
uuid.workspace = true

[lints]
workspace = true
