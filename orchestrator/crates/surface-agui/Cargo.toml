[package]
name = "orch-surface-agui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The AG-UI interaction surface: POST /agui/agents/{agentId} takes a RunAgentInput and answers an SSE stream of AG-UI events projected from the event log. Mounted by ORCH_SURFACES=agui."
readme = "README.md"

[dependencies]
orch-core.workspace = true
orch-app.workspace = true
orch-ports.workspace = true
orch-api.workspace = true
orch-agui-proto.workspace = true
orch-agui-projection.workspace = true
axum.workspace = true
futures.workspace = true
tracing.workspace = true

[dev-dependencies]
orch-ports = { workspace = true, features = ["testkit"] }
orch-agui-proto = { workspace = true, features = ["testkit"] }
serde_json.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["stream"] }
bytes = "1"
tokio-util.workspace = true

[lints]
workspace = true
