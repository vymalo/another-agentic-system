[package]
name = "orch-surface-agui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The AG-UI interaction surface: POST /agui/agents/{agentId} runs a RunAgentInput, GET /agui/threads/{threadId}/connect streams a thread (replay, Last-Event-ID, follow), GET /agui/agents/{agentId}/capabilities describes an agent. Mounted by ORCH_SURFACES=agui."
readme = "README.md"

[dependencies]
orch-core.workspace = true
orch-app.workspace = true
orch-ports.workspace = true
orch-api.workspace = true
orch-agui-proto.workspace = true
orch-agui-projection.workspace = true
axum.workspace = true
futures.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
orch-ports = { workspace = true, features = ["testkit"] }
orch-auth-header.workspace = true
orch-agui-proto = { workspace = true, features = ["testkit"] }
reqwest = { workspace = true, features = ["stream"] }
bytes = "1"
tokio-util.workspace = true
jsonschema.workspace = true
serde_norway.workspace = true
secrecy.workspace = true

[lints]
workspace = true
