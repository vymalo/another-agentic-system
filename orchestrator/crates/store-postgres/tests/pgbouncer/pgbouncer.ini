; PgBouncer in front of the test Postgres, for the suites that run through a transaction-mode pooler
; (ORCH_TEST_DIRECT_DATABASE_URL, issue 290). CI's `pooler` job mounts this file and userlist.txt into
; the pinned edoburu/pgbouncer image on the host network; README.md of this crate says how to do the same
; by hand. The credentials are the throwaway ones of the CI Postgres service.
[databases]
; every database the tests make (one per test) goes to the same name on the server
* = host=127.0.0.1 port=5432 user=postgres password=postgres

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres

; what the deployment must have (docs/api/config.md, "Database behind a pooler"): transaction pooling,
; and protocol-level prepared statements kept across server connections (PgBouncer 1.21 or later)
pool_mode = transaction
max_prepared_statements = 200

; one pool per database and every test has its own: keep the server connections few and let idle ones go
max_client_conn = 2000
default_pool_size = 10
max_db_connections = 10
max_user_connections = 150
server_idle_timeout = 2
server_lifetime = 300
