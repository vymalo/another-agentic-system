[package]
name = "orch-agent-a2a"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "AgentClient over the A2A protocol (a2a-client-lf): card and release discovery, streaming delegation, resubscribe, polling and cancel."
readme = "README.md"

[dependencies]
orch-core.workspace = true
orch-ports.workspace = true
orch-a2a-mapping.workspace = true
orch-thread-token.workspace = true
secrecy.workspace = true
a2a-lf.workspace = true
a2a-client-lf.workspace = true
async-trait.workspace = true
reqwest.workspace = true
jiff.workspace = true
rustls.workspace = true
futures.workspace = true
tokio.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
uuid.workspace = true
tracing-subscriber.workspace = true
orch-ports = { workspace = true, features = ["testkit"] }
orch-testsupport.workspace = true
tokio = { workspace = true, features = ["time", "io-util"] }

[lints]
workspace = true
