[package]
name = "orch-e2e"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "End-to-end tests: the AG-UI run route, the chat API, the dispatcher and the A2A adapter against an in-process fake A2A agent over real HTTP."
readme = "README.md"

[dependencies]

[dev-dependencies]
orch-core.workspace = true
orch-ports = { workspace = true, features = ["testkit"] }
orch-auth-header.workspace = true
orch-app.workspace = true
orch-api.workspace = true
orch-agui-proto = { workspace = true, features = ["testkit"] }
orch-agent-a2a.workspace = true
orch-artifacts-fs.workspace = true
tempfile = "3"
orch-registry-platform.workspace = true
orch-surface-mcp.workspace = true
orch-surface-thread-tools.workspace = true
orch-thread-token.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
secrecy.workspace = true
orch-agent-adam = { workspace = true, features = ["testkit"] }
orch-testsupport.workspace = true
orch-store-postgres.workspace = true
orch-surface-webhook.workspace = true
axum.workspace = true
sqlx.workspace = true
uuid.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
jiff.workspace = true
serde_json.workspace = true
futures.workspace = true
reqwest.workspace = true

[lints]
workspace = true
