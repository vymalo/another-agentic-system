[package]
name = "orchestrator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The orchestrator service: the composition root that wires the Postgres store, the A2A adapter, the dispatcher and the chat API."

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[dependencies]
orch-core.workspace = true
orch-ports.workspace = true
orch-app.workspace = true
orch-api.workspace = true
orch-agent-a2a.workspace = true
orch-store-postgres.workspace = true
anyhow.workspace = true
axum.workspace = true
serde.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
orch-testsupport.workspace = true
reqwest.workspace = true
sqlx.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
