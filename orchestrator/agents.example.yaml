# AGENTS_FILE: the agents users can target. One entry per A2A agent.
#
# The first entry is the default agent the chat UI preselects (ADR 0014). An agent whose card
# cannot be read stays in its place; it is never replaced by the next one.
#
#   id        lower-case letters, digits and dashes (^[a-z0-9][a-z0-9-]{0,62}$); the key in the API
#   name      shown in the chat
#   cardUrl   the agent's A2A agent card (https, or http inside the cluster)
#   tokenEnv  optional: the NAME of an environment variable holding the bearer token.
#             The variable must be set and non-empty, or the orchestrator refuses to start.
- id: coder
  name: Coder
  cardUrl: https://coder.example.com/.well-known/agent-card.json
  tokenEnv: CODER_A2A_TOKEN
