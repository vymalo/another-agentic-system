# AGENTS_FILE: the agents users can target. One entry per A2A agent.
#
# The first entry is the default agent the chat UI preselects (ADR 0014). An agent whose card
# cannot be read stays in its place; it is never replaced by the next one.
#
#   id        lower-case letters, digits and dashes (^[a-z0-9][a-z0-9-]{0,62}$); the key in the API
#   name      shown in the chat
#   aliases   optional: other names of the agent (each a slug like `id`). A request, a mention or a
#             thread that names one is about this agent; the agent is listed and a new thread is
#             created under `id` only (ADR 0049). An alias is never the id or the alias of another
#             entry: startup fails. Use it when an agent is renamed: threads made before keep the old
#             id in their log and keep working.
#   transport optional: how the orchestrator reaches the agent, `a2a` (the default when the key
#             is absent) or `local` (hosted in the orchestrator's own process, see below).
#   cardUrl   a2a only, required: the agent's A2A agent card (https, or http inside the cluster)
#   tokenEnv  a2a only, optional: the NAME of an environment variable holding the bearer token.
#             The variable must be set and non-empty, or the orchestrator refuses to start.
#   agent     local only, required: the kind of in-process agent (`echo`). A local agent has no
#             card and no token: `cardUrl` and `tokenEnv` next to `transport: local` are errors.
#   gate      optional: the verification gate of this agent (ADR 0018), on top of the deployment's
#             (ORCH_GATE, ORCH_MAX_ATTEMPTS). A job is not done until the required sources pass; a
#             failure sends the agent back with the findings, up to `maxAttempts` in all.
#               require       sources that must pass; at least the deployment's. This build honours
#                             `agent-checks` (the agent's own `checks` artifact), `ci` (a signed
#                             CI report about the pushed commit, POST /webhooks/ci, ADR 0017) and
#                             `verifier` (another agent reviews the pushed commit).
#               maxAttempts   1..=ORCH_MAX_ATTEMPTS_CAP (default 3, cap 10, at most 100)
#               verifier      the id of the agent that verifies this agent's work (required when
#                             `require` has `verifier`, unless ORCH_VERIFIER names one): another
#                             configured agent, never this one
#               ci            {required: [check names], timeoutSecs}: which checks must pass (a gate
#                             that requires `ci` must name at least one, or startup fails; a report of
#                             another name is a card and nothing else) and how long to wait for them
#                             before the job is blocked (default ORCH_CI_TIMEOUT_SECS)
#             Unknown keys are errors.
- id: adam
  name: Adam
  aliases: [coder]
  cardUrl: https://coder.example.com/.well-known/agent-card.json
  tokenEnv: CODER_A2A_TOKEN
  # gate:
  #   require: [agent-checks, ci]
  #   maxAttempts: 3
  #   ci: {required: [ci/build], timeoutSecs: 1800}   # a gate that requires ci names the checks that count

# A verifier (ADR 0018): `builder`'s work is not done until `reviewer`, another agent, passes the
# commit it pushed. `reviewer` has its own card and its own token, and is never sent the builder's.
# Its entry may also leave `verifier` out of `require` when the deployment requires it of every
# agent (ORCH_GATE=verifier ORCH_VERIFIER=reviewer): an agent cannot verify its own work.
#
# - id: builder
#   name: Builder
#   cardUrl: https://builder.example.com/.well-known/agent-card.json
#   tokenEnv: BUILDER_A2A_TOKEN
#   gate:
#     require: [verifier]
#     verifier: reviewer
# - id: reviewer
#   name: Reviewer
#   cardUrl: https://reviewer.example.com/.well-known/agent-card.json
#   tokenEnv: REVIEWER_A2A_TOKEN

# An agent hosted in-process (ADR 0015). It needs a build with the Cargo feature `agent-local`
# (`cargo run -p orchestrator --features agent-local`); without it the orchestrator refuses to
# start with this entry rather than skipping it. Its runs are kept in the orchestrator's own
# database, in the tables `orch_agent_*`. `dev/agents.local-echo.yaml` is a file to try it with.
#
# - id: helper
#   name: Helper
#   transport: local
#   agent: echo
