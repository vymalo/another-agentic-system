# The configuration of the compose `orchestrator` service when compose.live.yaml is used ("Going live" in dev/README.md):
# mounted at /etc/orchestrator/config.yaml INSTEAD of dev/orchestrator.yaml (compose.live.yaml replaces the volume), beside
# dev/agents.live.yaml at the same path as ever. A whole file, not a patch: there is no layering (ADR 0034).
#
# What differs from dev/orchestrator.yaml: no `models` and no `tasks`. The model that writes the thread titles is the real
# one, and its address, key and name come from `.env`, which a YAML file cannot read, so compose.live.yaml sets the
# variables ORCH_MODEL_BASE_URL, ORCH_MODEL_API_KEY and ORCH_TITLE_MODEL from MODEL_BASE_URL, MODEL_API_KEY and
# TITLE_MODEL (else MODEL). They are the legacy way to say `models.endpoints.default` and `tasks.title`, and the
# orchestrator logs one warning for each at startup; they stay until the variables are removed (ADR 0034), when this file
# names the endpoint and the model and reads the key with `apiKey: { env: MODEL_API_KEY }`.
#
# Every secret is a reference to a variable `.env` sets (CODER_A2A_TOKEN, WEBHOOK_GITHUB_SECRETS, MCP_TOKEN_DEV, ...): the
# values are in `.env`, never here.
#
# Check it: `orchestrator --config dev/orchestrator.live.yaml --print-config`.
version: 1

server:
  environment: development # the issuer below is plain http, which `production` refuses
  # The CI webhook that is used live is GitHub's; the generic one has a secret of its own that nothing knows.
  surfaces: [agui, mcp, thread-tools, webhook-generic, webhook-github]
  publicUrl: http://127.0.0.1:8080 # the edge on EDGE_PORT 8080; another port: set ORCH_PUBLIC_URL in the environment

log:
  format: text

database:
  url: { env: DATABASE_URL }

agents:
  file: agents.yaml # dev/agents.live.yaml, mounted at this path by compose.live.yaml
  registry:
    url: http://mock-registry:8080/registry/v1/agents
    agentToken: { env: AGENT_REGISTRY_AGENT_TOKEN }

# The files agents hand over (ADR 0032), as in dev/orchestrator.yaml: the named volume `orchestrator-artifacts`.
artifacts:
  store: fs
  fs: { root: /var/lib/orchestrator/artifacts }

threadTools:
  url: http://orchestrator:8080
  secret: { env: THREAD_TOOLS_SECRET }
  allowedHosts: [orchestrator:8080, 127.0.0.1:8080, localhost:8080]

# What a person may attach to a conversation (ADR 0024, docs/api/config.md "toolServers"). Live, `websearch` is `searxng-mcp` (dev/searxng-mcp:
# SearXNG, Brave or Tavily), the same server the researcher reads through its own mcp.json: the id and the icon are those of
# dev/orchestrator.yaml, so a thread's attachment means the same in both stacks. `fetch` (one page as plain text) is offered beside
# `web_search`. The bearer is SEARCH_MCP_TOKEN of `.env` (compose.live.yaml sets WEBSEARCH_TOKEN from it).
toolServers:
  - id: websearch
    name: Web search
    description: Search the web, and read a page.
    url: http://searxng-mcp:8080/mcp
    icon: data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNGE4YzRkIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PGNpcmNsZSBjeD0iMTEiIGN5PSIxMSIgcj0iNyIvPjxwYXRoIGQ9Im0yMCAyMC0zLjUtMy41Ii8+PC9zdmc+
    bearer: { env: WEBSEARCH_TOKEN }
    tools: [web_search, fetch]
    agents: [chat, coder]
    timeoutSecs: 60

mcp:
  tokensFile: mcp-tokens.yaml
  allowedHosts: [127.0.0.1, localhost]

webhooks:
  generic:
    secrets: [{ env: WEBHOOK_GENERIC_SECRETS }] # `.env`: WEBHOOK_GENERIC_SECRETS, else the GitHub secret
  github:
    secrets: [{ env: WEBHOOK_GITHUB_SECRETS }]

# Who is asking (ADR 0033): the same as dev/orchestrator.yaml, which says why. The edge is the same in front of this stack too:
# oauth2-proxy and the mock issuer `mock-oidc`; only the agents, the model and GitHub are real.
auth:
  mode: jwt
  jwt:
    issuer: http://mock-oidc:8080
    audiences: [dev-chat]
    rolesClaim: roles
  defaultRole: user
  roles:
    user: { permissions: [agent.read, agent.invoke, thread.read, thread.write, artifact.read], scope: own, agents: ["*"] }
    admin: { permissions: [agent.read, agent.invoke, thread.read, thread.write, artifact.read, admin], scope: { read: any, write: own }, agents: ["*"] }
    chat-only: { permissions: [agent.read, agent.invoke, thread.read, thread.write, artifact.read], scope: own, agents: [chat] }
