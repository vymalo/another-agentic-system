# AGENTS_FILE of the compose `orchestrator` service (format: orchestrator/agents.example.yaml).
#
# The FIRST entry is the default agent: GET /api/agents keeps this order and the chat UI preselects
# the first (ADR 0014). That is the coder, then `chat` and `researcher`, two agents that are only a folder each
# (dev/agents/, served by adam-agent: dev/README.md, "Several agents" and "Add a fourth agent by writing a folder");
# the WireMock mocks below are the scripted stand-ins to try the other thread endings (dev/README.md). The
# coder, the chat and the researcher need the `app` profile of compose.yaml.
#
# The mocks accept any non-empty bearer token; MOCK_AGENT_TOKEN, CODER_A2A_TOKEN, CHAT_A2A_TOKEN and
# RESEARCHER_A2A_TOKEN are dummies set in compose.yaml, and each equals A2A_BEARER_TOKENS of its service.
- id: coder
  name: Coder
  cardUrl: http://coder:8080/.well-known/agent-card.json
  tokenEnv: CODER_A2A_TOKEN
  # Under a gate of two sources (ADR 0017, ADR 0018): the job is done when the coder's own checks
  # passed on the pushed commit (`agent-checks`: since adam-rs ae540e9 the coder reports `run_checks` as a
  # `checks` artifact, and `commit_and_push` re-reports it bound to the commit it pushed) AND CI says that
  # commit is green (`ci`). In this stack CI is `mock-ci`, which reports every commit on `agent/*` of
  # git-server (`success`, or `failure` when the commit message contains CI_FAIL) as the check
  # `mock-ci/build`, and a red report sends the coder back with the report. A gate that requires `ci`
  # names the checks that count (`ci.required`): a report of any other name is a card and nothing else,
  # so no first report can pass a red commit. The scripted model (dev/coder/wiremock) runs the checks in
  # both variants, so both reach `done`; a real model that skips `run_checks` is sent back, three attempts
  # in all, with "no checks reported", and one that pushed nothing with "no pushed commit" (dev/agents.live.yaml
  # says how to loosen that).
  gate:
    require: [agent-checks, ci]
    ci:
      required: [mock-ci/build]
- id: chat
  name: Chat
  cardUrl: http://chat:8080/.well-known/agent-card.json
  tokenEnv: CHAT_A2A_TOKEN
  # A casual chat, an adam-agent over dev/agents/chat/agent. No gate: an agent with no gate is done when it says so,
  # so "hi" ends the thread `done`, where the coder (it asks which repository) leaves it `blocked`.
- id: researcher
  name: Researcher
  cardUrl: http://researcher:8080/.well-known/agent-card.json
  tokenEnv: RESEARCHER_A2A_TOKEN
  # Searches the web through the MCP server of its folder (dev/agents/researcher/agent/mcp.json: the mock web search)
  # and answers with the sources it found. No gate either: a question ends `done` with its answer.
- id: coder-share
  name: Coder (hands over files)
  cardUrl: http://coder:8080/.well-known/agent-card.json
  tokenEnv: CODER_A2A_TOKEN
  # The same coder as `coder`, with NO gate, for dev/artifact-e2e.sh (ADR 0032): a task that asks for a result, not for a change to a
  # repository, ends when the coder says so: it makes the files in a scratch project, shares them (`share_file`) and answers. Under
  # the gate of `coder` that job would be sent back for "no checks reported" and "no pushed commit", because nothing was pushed
  # and nothing is waiting for CI. The keyword `[mock:share]` selects the script (dev/wiremock/coder-share).
- id: mock-coder
  name: Mock coder
  cardUrl: http://mock-agent:8080/.well-known/agent-card.json
  tokenEnv: MOCK_AGENT_TOKEN
- id: mock-coder-gated
  name: Mock coder (gated)
  cardUrl: http://mock-agent:8080/.well-known/agent-card.json
  tokenEnv: MOCK_AGENT_TOKEN
  # The same mock as `mock-coder`, under the verification gate (ADR 0018): its own `checks` artifact
  # must pass, or the agent is sent back with the findings, three attempts in all. Try it with the
  # keywords `red-once` (fails once, then passes) and `red-always` (dev/README.md, "Verification").
  gate:
    require: [agent-checks]
- id: verifier
  name: Mock verifier
  cardUrl: http://mock-verifier:8080/.well-known/agent-card.json
  tokenEnv: MOCK_AGENT_TOKEN
  # The verifier agent of the gate (ADR 0018), a WireMock stand-in: it reviews the commit an agent
  # pushed and answers with a `verdict` artifact, findings for a commit of forty `a` and a pass for
  # any other. It is a configured agent like the others, so it can also be chatted with.
- id: mock-coder-verified
  name: Mock coder (verified)
  cardUrl: http://mock-agent:8080/.well-known/agent-card.json
  tokenEnv: MOCK_AGENT_TOKEN
  # The same mock as `mock-coder`, under a gate that asks the verifier (dev/README.md, "Verifier"): its
  # work is not done until `verifier` passes the commit it pushed, or the agent is sent back with the
  # findings, three attempts in all. The keywords `push-flawed` (the verifier finds something, the
  # rework is passed) and `push-clean` (passed at once) choose what the agent pushes.
  gate:
    require: [verifier]
    verifier: verifier
- id: mock-coder-ci
  name: Mock coder (CI gated)
  cardUrl: http://mock-agent:8080/.well-known/agent-card.json
  tokenEnv: MOCK_AGENT_TOKEN
  # The same mock again, under a CI gate (ADR 0017, ADR 0018): it pushes a commit and says it is done, and
  # the job then waits for a CI report about that very commit, posted to /webhooks/ci (dev/ci-webhook.sh).
  # A red report sends the agent back, a green one ends the job. `dev/ci-e2e.sh` drives it with the
  # keyword `red-once` (attempt 1 pushes commit 1111111, attempt 2 pushes 2222222). The check that
  # counts is `ci/build`, the name dev/ci-webhook.sh reports under by default.
  gate:
    require: [ci]
    ci:
      required: [ci/build]
- id: mock-coder-releases
  name: Mock coder (releases)
  cardUrl: http://mock-agent-releases:8080/.well-known/agent-card.json
  tokenEnv: MOCK_AGENT_TOKEN
