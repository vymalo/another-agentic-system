# AGENTS_FILE of the `orchestrator` service when compose.live.yaml is in use (dev/README.md, "Going live"):
# the coder, pointed at a real model and a real GitHub, and the scripted agents beside it, which still
# run on the WireMock mocks of the default profile.
#
# It differs from dev/agents.yaml in one thing, the coder's gate. There the coder waits for `mock-ci/build`,
# a check only the local `mock-ci` reports, and with no `mock-ci` running a live job would wait for it until
# the CI deadline and end blocked. Here the coder is gated on its own checks only:
#
#   * `agent-checks`: the coder runs the checks of the repository (`run_checks`) and reports them as a `checks`
#     artifact bound to the commit it pushed. Only PUSHED work is verified (ADR 0018, status note of 2026-10-04):
#     a job that pushed a commit is done when the checks passed on THAT commit, and a coder that pushes and skips
#     `run_checks` is sent back with "no checks reported", three attempts in all. A coder that pushed nothing
#     ("Hi" answered in plain text, a question, a demo, a chart shown in the chat) gave an answer: the job is done
#     on its first attempt and the gate says nothing about it. A rework that pushes nothing is still sent back
#     with "no pushed commit": it exists because an earlier push failed. (`gate: {}` is no longer needed to let
#     a coder only talk.)
#   * `ci`, opt-in: add it once the repository's GitHub webhook reaches the orchestrator (smee, dev/README.md)
#     AND you know the exact NAME of the check run that counts (GitHub shows it on the pull request, for
#     example `build` or `ci / test`). A gate that requires `ci` must name it, or the orchestrator refuses
#     to start:
#
#       gate:
#         require: [agent-checks, ci]
#         ci:
#           required: [build]     # the name of the check run, exactly as GitHub spells it
#
#     The repository in the agent's `branch` artifact must be the repository the webhook reports, as
#     `owner/name` (the orchestrator compares them spelling-insensitively; docs/api/webhooks.md).
#
# The tokens are CODER_A2A_TOKEN, CHAT_A2A_TOKEN and RESEARCHER_A2A_TOKEN from .env. `chat` and `researcher` are
# agents that are only a folder each (dev/agents/, adam-agent): live they talk to the real model of .env
# (CHAT_MODEL, RESEARCHER_MODEL; MODEL when those are unset), and have no gate: an agent with no gate is done when it says so.
# The researcher still searches the MOCK web search (canned results): there is no search provider credential in this
# stack. To search for real, point the `url` of dev/agents/researcher/agent/mcp.json at a search MCP server of your own
# and give the researcher its token (dev/README.md, "Going live").
- id: adam
  name: Adam
  aliases: [coder] # what the agent was called (ADR 0049)
  cardUrl: http://coder:8080/.well-known/agent-card.json
  tokenEnv: CODER_A2A_TOKEN
  gate:
    require: [agent-checks]
- id: chat
  name: Chat
  cardUrl: http://chat:8080/.well-known/agent-card.json
  tokenEnv: CHAT_A2A_TOKEN
- id: researcher
  name: Researcher
  cardUrl: http://researcher:8080/.well-known/agent-card.json
  tokenEnv: RESEARCHER_A2A_TOKEN
- id: mock-coder
  name: Mock coder
  cardUrl: http://mock-agent:8080/.well-known/agent-card.json
  tokenEnv: MOCK_AGENT_TOKEN
- id: mock-coder-gated
  name: Mock coder (gated)
  cardUrl: http://mock-agent:8080/.well-known/agent-card.json
  tokenEnv: MOCK_AGENT_TOKEN
  gate:
    require: [agent-checks]
- id: verifier
  name: Mock verifier
  cardUrl: http://mock-verifier:8080/.well-known/agent-card.json
  tokenEnv: MOCK_AGENT_TOKEN
- id: mock-coder-verified
  name: Mock coder (verified)
  cardUrl: http://mock-agent:8080/.well-known/agent-card.json
  tokenEnv: MOCK_AGENT_TOKEN
  gate:
    require: [verifier]
    verifier: verifier
