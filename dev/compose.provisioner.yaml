# A person's own agent on the message path (ANR-806, part 2): the stack with a platform to ask. The orchestrator is configured with a `provisioner`
# section (dev/orchestrator.provisioner.yaml), so a person's message to the agent called `coder` (here `adam`, whose alias it is) first makes
# or resumes the person's own agent on the platform and waits until it is ready, and only then is written and sent.
#
#   docker compose -f compose.yaml -f dev/compose.provisioner.yaml --profile app up -d --build --wait
#   dev/provisioner-e2e.sh        # a first message makes the agent, a suspended one resumes, a wait that runs out ends at readyTimeoutSecs
#
# Without this file the stack is what it was: no `provisioner` section, no platform, and a message goes straight to the agent.
#
# What it changes, and nothing else:
#   * mock-own-agent  a WireMock A2A agent that stands for the person's own agent, listed in `mock-registry` by the script (ANR-1061).
#   * mock-platform   a WireMock stand-in for the platform's owner routes (`/v1/owners/{owner}/agents/{name}`, the contract of
#                     another-agentic-platform's `docs/api/platform-api-v1.openapi.json`). It starts with no stub: dev/provisioner-e2e.sh adds
#                     the ones of each person through WireMock's admin API (a state machine per person: absent, saving, ready, suspended, stuck).
#   * orchestrator    dev/orchestrator.provisioner.yaml in place of dev/orchestrator.yaml (dev/check-provisioner-config.sh asserts that it is the
#                     same file plus the marked `provisioner` blocks: the section itself and `auth.jwt.userClaim: sub`, so that a person is the
#                     issuer's `sub`, the account their agent is charged to), dev/mcp-tokens.provisioner.yaml in place of
#                     dev/mcp-tokens.yaml (the same token, its user named by `sub`), PROVISIONER_CLIENT_SECRET (the secret `provisioner.credentials.clientSecret`
#                     names: the client secret of the mock issuer, which this stack's oauth2-proxy uses too, local development only), and a
#                     dependency on mock-platform.
#
# It does not combine with another override that replaces the orchestrator's configuration (compose.browser-auth.yaml, compose.live.yaml): the
# last one on the command line would win and the provisioner or the other change would be missing.

services:
  mock-platform:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3 # tag of x-wiremock in compose.yaml, digest of the index (read from the registry 2026-11-27)
    command: ["--global-response-templating", "--disable-banner", "--verbose"]
    ports:
      - "127.0.0.1:${MOCK_PLATFORM_PORT:-8105}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # The person's own agent (ANR-1061): a WireMock A2A agent, the researcher's mappings (one fixed answer, `Data: ...`) under a journal of its own.
  # dev/provisioner-e2e.sh lists it in `mock-registry` under `coder-<owner>`, the name the platform gives the agent it makes, and asserts that the
  # person's message reached it (and not the deployment's `adam`). Nothing else in the stack names it.
  mock-own-agent:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3 # tag of x-wiremock in compose.yaml, digest of the index (read from the registry 2026-11-27)
    command: ["--global-response-templating", "--disable-banner"]
    ports:
      - "127.0.0.1:${MOCK_OWN_AGENT_PORT:-8106}:8080"
    volumes:
      - ./dev/wiremock/researcher/mappings:/home/wiremock/mappings:ro
      - ./dev/wiremock/researcher/__files:/home/wiremock/__files:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  orchestrator:
    # The same mount points as the base file's: Compose replaces each entry with this one.
    volumes:
      - ./dev/orchestrator.provisioner.yaml:/etc/orchestrator/config.yaml:ro
      - ./dev/mcp-tokens.provisioner.yaml:/etc/orchestrator/mcp-tokens.yaml:ro
    environment:
      PROVISIONER_CLIENT_SECRET: dev-client-secret # the mock issuer's secret for `dev-chat`; local development only
    depends_on:
      mock-platform:
        condition: service_healthy
      mock-own-agent:
        condition: service_healthy
