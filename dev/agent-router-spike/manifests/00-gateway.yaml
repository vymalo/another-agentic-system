# The gateway of the spike: Envoy Gateway's GatewayClass, a Gateway, and the AI Gateway's
# ClientTrafficPolicy (a model answer is larger than Envoy's 32 KiB buffer).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: spike
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: spike
  namespace: default
spec:
  gatewayClassName: spike
  listeners:
    - name: http
      protocol: HTTP
      port: 80
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: spike
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: spike
  namespace: default
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          # A kind cluster has no room for Envoy's production requests.
          resources: {}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: spike
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: spike
  connection:
    bufferLimit: 50Mi
