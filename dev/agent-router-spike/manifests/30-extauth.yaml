# The external authorizer of the spike: a stub that stands where Authorino will stand. It answers
# 401 without `X-Run-Id` (the run is not bound) and 200 with `Authorization: Bearer injected-by-extauth`
# and `X-Auth-User: run-<id>` when it is. The SecurityPolicy copies those two response headers to the
# upstream request — the question is whether Agent Router's generated route carries them to the model.
#
# The stub is not Authorino: Authorino's `response.success.headers` is documented and verified by its
# docs; what this spike tests is the transport through Agent Router's routes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spike-extauth
  namespace: default
data:
  extauth.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Auth(BaseHTTPRequestHandler):
        def log_message(self, *args):
            pass

        def _reply(self, code, body, headers=()):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("content-type", "application/json")
            for name, value in headers:
                self.send_header(name, value)
            self.send_header("content-length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path == "/healthz":
                return self._reply(200, {"ok": True})
            self._check()

        def do_POST(self):
            length = int(self.headers.get("content-length") or 0)
            if length:
                self.rfile.read(length)
            self._check()

        def _check(self):
            run = self.headers.get("X-Run-Id")
            if not run:
                # What Envoy actually sent, so a lost header is visible in the log rather than guessed.
                seen = {name: self.headers.get_all(name)
                        for name in ("X-Run-Id", "X-Ai-Eg-Model", "Authorization", "Host", "Path")}
                return self._reply(401, {"code": "run_not_bound", "seen": seen,
                                         "path": self.path})
            self._reply(200, {"ok": True}, headers=[
                ("Authorization", "Bearer injected-by-extauth"),
                ("X-Auth-User", "run-" + run),
            ])

    ThreadingHTTPServer(("0.0.0.0", 9002), Auth).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spike-extauth
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spike-extauth
  template:
    metadata:
      labels:
        app: spike-extauth
    spec:
      containers:
        - name: extauth
          image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
          command: ["python", "/opt/extauth/extauth.py"]
          ports:
            - containerPort: 9002
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9002
            periodSeconds: 2
          volumeMounts:
            - name: code
              mountPath: /opt/extauth
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: spike-extauth
---
apiVersion: v1
kind: Service
metadata:
  name: spike-extauth
  namespace: default
spec:
  selector:
    app: spike-extauth
  ports:
    - port: 9002
      targetPort: 9002
---
# Targets the Gateway, because the AIGatewayRoute is not a kind Envoy Gateway's SecurityPolicy
# accepts. Whether a policy can target the generated route instead is one of the spike's findings.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: spike-extauth
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: spike
  extAuth:
    # The default HTTP ext-auth check forwards only Host, Method, Path, Content-Length and
    # Authorization; without this line the authorizer never sees the run id.
    headersToExtAuth: ["X-Run-Id"]
    http:
      backendRefs:
        - name: spike-extauth
          port: 9002
      headersToBackend: ["Authorization", "X-Auth-User"]
