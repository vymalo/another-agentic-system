# Cancels what is still running for a branch once its pull request is closed or merged,
# or once the branch is deleted. A newer push to an open pull request is cancelled by the
# `concurrency` block of each workflow; this covers the two events a push never signals.
#
# Owner instruction, 2026-11-27: "add a line in all PR that cancels all running workflows
# when a newer job lands, or when the PR get merged, or when the branch is deleted".
#
# Needs `actions: write` only. A fork's pull request gets a read-only token: the cancel
# calls then fail and each failure is a warning, never a failed job. The default branch is
# never touched, and neither is this run.
name: Cancel stale runs

on:
  pull_request:
    types: [closed]
  delete:

permissions: {}

jobs:
  cancel:
    # A `delete` event also fires for tags: only a branch is handled.
    if: github.event_name == 'pull_request' || github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Cancel queued and running workflow runs of the branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          DELETED_REF: ${{ github.event.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BRANCH="$HEAD_REF"
          else
            BRANCH="$DELETED_REF"
          fi
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::notice::Nothing to cancel: the branch is empty or is the default branch."
            exit 0
          fi
          for status in queued in_progress waiting pending requested; do
            ids=$(gh run list -R "$REPO" --branch "$BRANCH" --status "$status" --limit 100 \
              --json databaseId --jq '.[].databaseId') || {
              echo "::warning::Could not list $status runs of $BRANCH."
              continue
            }
            for id in $ids; do
              [ "$id" = "$SELF_RUN_ID" ] && continue
              if gh run cancel -R "$REPO" "$id"; then
                echo "Cancelled run $id ($status)."
              else
                echo "::warning::Could not cancel run $id (a fork's read-only token, or it already ended)."
              fi
            done
          done
