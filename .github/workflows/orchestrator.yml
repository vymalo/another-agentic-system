name: Orchestrator

# check: fmt, clippy and the tests of the orchestrator workspace, with a Postgres service so
#        the store, end-to-end and binary tests all run against a real database, and a RustFS service
#        so the S3 artifact store's testkit runs against a real S3-compatible server; on pull
#        requests also the guard that applied migrations are never edited.
# pooler: the suites that talk to Postgres, through a real PgBouncer in transaction mode (issue 290): the pooled URL
#        for queries and the direct URL for what must be direct (the migrations, the LISTEN connection). A pinned
#        edoburu/pgbouncer image (tag and digest) with the configuration of crates/store-postgres/tests/pgbouncer;
#        its version and its pool mode are asserted before the tests run.
# signed-request-interop: the signed requests to a tool server (ADR 0080) against the real cratestack-cose 0.17.2, which needs
#        Rust 1.98 where the workspace is on 1.94.1: a crate of its own, outside the workspace, with its own toolchain
#        (orchestrator/crates/signed-request/interop). The real `open_claims` opens what the orchestrator signs and the real
#        `sign_claims` writes the same bytes.
# image: builds the container image (pull requests: build only, to validate the Dockerfile;
#        main: build and push to ghcr.io) and, before anything is pushed, runs it against a
#        Postgres service: non-root, /healthz and /readyz answer, SIGTERM exits cleanly.
# bump:  on main, after the image is pushed, sets `orchestrator.image.tag` in deploy/chart/values.yaml (ADR 0041).
# embed: the library composition root (ADR 0076 E3): its example runs a thread on the in-process scripted agent and
#        asserts the AG-UI events, with no HTTP server; the job also fails when the embedded build's normal dependency
#        tree holds axum, sqlx or tokio-postgres.
#
# Path filters mean this check must not be made "required" for unrelated PRs.

on:
  pull_request:
    paths:
      - "orchestrator/**"
      - "docs/api/chat-api.yaml"
      - "docs/api/examples/**"
      # the e2e suite reads the web's UI catalog (crates/e2e/tests/ui_catalog.rs)
      - "web/src/features/chat/lib/a2ui/catalog/**"
      # the configuration file (ADR 0034): orch-config's tests compare its schema and read the example of
      # its document, and the binary's tests run --print-config on the dev files compose mounts
      - "docs/api/config.md"
      - "docs/api/config.schema.json"
      - "dev/orchestrator.yaml"
      - "dev/orchestrator.live.yaml"
      - "dev/agents.yaml"
      - "dev/agents.live.yaml"
      - "dev/mcp-tokens.yaml"
      - "tools/projection-digests-check.sh"
      - "tools/sqlx-out-check.sh"
      - "tools/embedded-deps/check.sh"
      - ".github/workflows/orchestrator.yml"
  push:
    branches: [main]
    paths:
      - "orchestrator/**"
      - "docs/api/chat-api.yaml"
      - "docs/api/examples/**"
      # the e2e suite reads the web's UI catalog (crates/e2e/tests/ui_catalog.rs)
      - "web/src/features/chat/lib/a2ui/catalog/**"
      # the configuration file (ADR 0034): orch-config's tests compare its schema and read the example of
      # its document, and the binary's tests run --print-config on the dev files compose mounts
      - "docs/api/config.md"
      - "docs/api/config.schema.json"
      - "dev/orchestrator.yaml"
      - "dev/orchestrator.live.yaml"
      - "dev/agents.yaml"
      - "dev/agents.live.yaml"
      - "dev/mcp-tokens.yaml"
      - "tools/sqlx-out-check.sh"
      - "tools/embedded-deps/check.sh"
      - ".github/workflows/orchestrator.yml"

permissions:
  contents: read

concurrency:
  group: orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # RustFS, an S3-compatible server, for the S3 artifact store's testkit (orch-artifacts-s3 reads ORCH_TEST_S3_URL; without it
      # those cases are skipped). The pin of compose.yaml (tag and digest); dummy credentials; its version check is sent to a port
      # nobody listens on (compose.yaml says why). The bucket is made by a step below.
      rustfs:
        image: rustfs/rustfs:1.0.1-preview.17@sha256:662587e2bdb0262fbb570cd2e7d34467e601ff32b8256e3203dbde40557e0cd2
        env:
          RUSTFS_ACCESS_KEY: ci-access-key
          RUSTFS_SECRET_KEY: ci-secret-key-0123456789
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_OBS_LOG_DIRECTORY: ""
          HTTPS_PROXY: http://127.0.0.1:9
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS -o /dev/null http://127.0.0.1:9000/health/ready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # A dev-mode OpenBao (KV v2 at `secret/`, in memory, root token below) for orch-secrets-openbao's testkit; without
      # ORCH_TEST_OPENBAO_URL those cases are skipped. Dummy token, CI only.
      openbao:
        image: openbao/openbao:2.4.1
        env:
          BAO_DEV_ROOT_TOKEN_ID: ci-dev-only-token
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
    env:
      ORCH_TEST_OPENBAO_URL: http://127.0.0.1:8200
      ORCH_TEST_OPENBAO_TOKEN: ci-dev-only-token
      ORCH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/orch_test
      ORCH_TEST_S3_URL: http://127.0.0.1:9000
      ORCH_TEST_S3_BUCKET: orch-test
      ORCH_TEST_S3_ACCESS_KEY: ci-access-key
      ORCH_TEST_S3_SECRET_KEY: ci-secret-key-0123456789
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v7
        with:
          # The migrations guard diffs against the base branch.
          fetch-depth: 0
      - name: Applied migrations stay append-only
        if: github.event_name == 'pull_request'
        # A migration that has run anywhere is history: editing, renaming or deleting it makes
        # sqlx refuse to start against a database that applied the old bytes. Only additions pass.
        # Two directories, two histories: the store's, and the sealed secret store's (ADR 0046).
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status "origin/${BASE_REF}...HEAD" -- orchestrator/crates/store-postgres/migrations orchestrator/crates/secrets-pg/migrations | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "::error::Applied migrations must not be modified, renamed or deleted; add a new numbered migration instead."
            echo "$changed"
            exit 1
          fi
      - name: The projection's pinned frames change only with its version
        # Rule 7 of docs/api/history.md: a client that stored frames trusts that the frames written for an
        # event already in a log do not change while the version stays. A line of the digest table that was
        # there and changed needs a higher version.
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: sh tools/projection-digests-check.sh "origin/${BASE_REF}"
      - name: sqlx stays out of the workspace
        # ADR 0076, sys#382 E1: every Postgres crate is on tokio-postgres; a package named sqlx or sqlx-* in
        # the lockfile, a dev-dependency's included, brings it back.
        working-directory: .
        run: sh tools/sqlx-out-check.sh
      - name: the embedded build stays a library, not a server
        # ADR 0076, sys#382 E3: `orch-embed` composes the app and the SQLite store and speaks no protocol, so its
        # normal edges hold no axum, sqlx, hyper or tokio-postgres, and exactly one libsqlite3-sys. Counts the set
        # (E5 measures it from here).
        working-directory: .
        run: sh tools/embedded-deps/check.sh
      - name: Create the S3 test bucket on RustFS
        # SigV4 with curl's own signer, path style (`<endpoint>/<bucket>`); a bucket that exists answers 200 again.
        run: |
          curl -fsS -o /dev/null --aws-sigv4 'aws:amz:us-east-1:s3' --user "$ORCH_TEST_S3_ACCESS_KEY:$ORCH_TEST_S3_SECRET_KEY" \
            -X PUT "$ORCH_TEST_S3_URL/$ORCH_TEST_S3_BUCKET"
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.94.1 --profile minimal -c rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "orchestrator -> target"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The binary without its surfaces (each is a Cargo feature): it must still build and its
      # configuration must still be valid. A control plane needs an authenticator (ADR 0033: the
      # default mode, `proxy_header`, is the feature `auth-header`), so the tests keep that one.
      - run: cargo clippy -p orchestrator --no-default-features --features auth-header --bins --locked -- -D warnings
      - run: cargo test -p orchestrator --no-default-features --features auth-header --bins --locked
      # The other combinations of the authenticators must build: only tokens, and none (a worker).
      - run: cargo clippy -p orchestrator --no-default-features --features auth-jwt --bins --locked -- -D warnings
      - run: cargo clippy -p orchestrator --no-default-features --bins --locked -- -D warnings
      # The thread-tools surface without the relay (feature `tool-relay`): it must build and say, at
      # startup, that listed servers give an agent no tools.
      - run: cargo clippy -p orchestrator --no-default-features --features auth-header,surface-thread-tools --bins --locked -- -D warnings
      - run: cargo test --workspace --locked
      # In-process agents (ADR 0015) are a Cargo feature of the binary, off by default and so
      # not covered by the workspace commands above: lint it, and run its own tests (the
      # binary hosting an echo agent, and the roles splitting the work) against the database.
      - run: cargo clippy -p orchestrator --features agent-local --all-targets --locked -- -D warnings
      - run: cargo test -p orchestrator --features agent-local --locked

  # The library composition root (ADR 0076 decision 4, slice E3). No service: SQLite is a file.
  embed:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.94.1 --profile minimal -c rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "orchestrator -> target"
      - run: cargo fmt --all --check
      - run: cargo clippy -p orch-embed --all-targets --locked -- -D warnings
      - run: cargo test -p orch-embed --locked
      - run: cargo run -p orch-embed --example run_thread --locked
      - name: The embedded build carries no HTTP server, Postgres driver or sqlx
        # ADR 0076 decision 4: the normal tree, dev-dependencies excluded (the example's scripted
        # agent is one). A crate that brings any of these back fails here.
        run: |
          tree=$(cargo tree -p orch-embed -e normal --locked --prefix none)
          found=$(printf '%s\n' "$tree" | grep -E '^(axum|sqlx(-[a-z0-9-]+)?|tokio-postgres) v' || true)
          if [ -n "$found" ]; then
            echo "::error::the embedded build must not depend on an HTTP server, a Postgres driver or sqlx"
            printf '%s\n' "$found"
            exit 1
          fi

  signed-request-interop:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: orchestrator/crates/signed-request/interop
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain the crate pins
        # not the workspace's 1.94.1: cratestack-cose 0.17.2 has rust-version 1.98.0
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "orchestrator/crates/signed-request/interop -> target"
      - run: cargo +1.98.1 test --locked

  pooler:
    runs-on: ubuntu-latest
    env:
      # What the tests are told: queries go through PgBouncer, and the database itself is for what a transaction-mode
      # pooler cannot carry. Each test gets a database of its own (a pooler cannot carry a search_path).
      ORCH_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:6432/orch_test
      ORCH_TEST_DIRECT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/orch_test
      # Maintained image of PgBouncer 1.26.1 (docker.io/edoburu/pgbouncer, *verified 2026-10-28* on Docker Hub: pushed
      # 2026-10-19, the tag's manifest list is this digest). The setting that matters is max_prepared_statements, PgBouncer 1.21.
      PGBOUNCER_IMAGE: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v7
      - name: Postgres 16 and PgBouncer
        # Postgres is run by hand and not as a service: its max_connections is raised (one pool per test database, and
        # the listeners and migrations connect directly). Both containers are on the host network, as the tests expect.
        working-directory: .
        run: |
          # wait_for <what> <container> <attempts> <command...>: the command answers, or the job fails HERE, naming the
          # container's state and its log. A loop whose last command is `sleep` swallows its own timeout (issue 412: the
          # step passed and the next one died on a bare "connection refused", which read as the pooler's fault).
          # The command's output is kept in a file and printed only when it never answered, so a first attempt that is
          # refused is not read as a failure.
          wait_for() {
            what=$1; container=$2; attempts=$3; shift 3
            for _ in $(seq "$attempts"); do
              if "$@" > "$RUNNER_TEMP/wait-$container.out" 2>&1; then
                echo "$what is ready"
                return 0
              fi
              sleep 1
            done
            echo "::error::$what did not answer within ${attempts}s"
            echo "--- the last answer ---"
            cat "$RUNNER_TEMP/wait-$container.out" || true
            echo "--- docker ps ---"
            docker ps -a --filter "name=$container" || true
            echo "--- docker inspect ---"
            docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' "$container" || true
            echo "--- docker logs $container ---"
            docker logs "$container" || true
            return 1
          }
          docker run -d --name postgres --network host -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=orch_test \
            postgres:16 -c max_connections=300 -c fsync=off
          # pg_isready is the PostgreSQL protocol's own readiness answer, and it is what PgBouncer's image itself probes:
          # a TCP connect is not (a listener accepts before the server is ready), and a query through the pooler is more
          # than readiness (it needs a pool and a server connection, which is what the tests then exercise).
          wait_for "Postgres on 127.0.0.1:5432" postgres 60 \
            docker exec postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres -d orch_test
          docker run -d --name pgbouncer --network host \
            -v "$PWD/orchestrator/crates/store-postgres/tests/pgbouncer:/etc/pgbouncer:ro" "$PGBOUNCER_IMAGE"
          wait_for "PgBouncer on 127.0.0.1:6432" pgbouncer 60 \
            docker exec postgres pg_isready -h 127.0.0.1 -p 6432 -U postgres -d orch_test
      - name: The pooler is what the tests assume
        # A pooler in session mode, or one without protocol-level prepared statements, would make the suites pass for the wrong
        # reason (or fail for it): say what runs, and refuse what is not transaction mode with max_prepared_statements.
        working-directory: .
        run: |
          admin() { docker exec -e PGPASSWORD=postgres postgres psql -h 127.0.0.1 -p 6432 -U postgres -d pgbouncer -Atc "$1"; }
          version=$(admin 'show version')
          mode=$(admin 'show config' | awk -F'|' '$1 == "pool_mode" {print $2}')
          prepared=$(admin 'show config' | awk -F'|' '$1 == "max_prepared_statements" {print $2}')
          echo "$version, pool_mode=$mode, max_prepared_statements=$prepared"
          echo "### $version, pool_mode=$mode, max_prepared_statements=$prepared" >> "$GITHUB_STEP_SUMMARY"
          test "$mode" = transaction
          test "$prepared" -gt 0
          # 1.21 is the first release with protocol-level prepared statements in transaction mode
          echo "$version" | awk '{split($2, v, "."); exit !(v[1] > 1 || (v[1] == 1 && v[2] >= 21))}'
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.94.1 --profile minimal -c rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "orchestrator -> target"
          key: pooler
      # The thread store, the sealed secret store, the in-process agents' routing, and the binary (with its in-process
      # agents): their Postgres suites, through the pooler. The other crates' suites need no pooler (they use the in-memory
      # ports or are covered by `check`), and the in-process agents' own suites share a journal by a schema, which a
      # pooler cannot carry (`orch-agent-adam`'s tests/direct.rs is the one that runs here).
      - run: cargo test -p orch-store-postgres -p orch-secrets-pg -p orch-secrets-openbao --locked
      - run: cargo test -p orch-agent-adam --test direct --locked
      - run: cargo test -p orch-e2e --locked
      - run: cargo test -p orchestrator --features agent-local --locked
      - name: PgBouncer's log
        if: failure()
        run: docker logs --tail 200 pgbouncer

  image:
    needs: check
    runs-on: ubuntu-latest
    # The only job that may write packages; it gets the token only through docker/login-action.
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IMAGE: ghcr.io/vymalo/another-agentic-system/orchestrator
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: orchestrator
          file: orchestrator/Dockerfile
          platforms: linux/amd64
          # Loaded into the local daemon so the smoke test below runs what would be pushed.
          load: true
          push: false
          # The commit the binary says it was built from (a thread export carries it, ADR 0053); the push below
          # passes the same value, so it is the same build and the same layers.
          build-args: |
            ORCH_BUILD_REVISION=${{ github.sha }}
          tags: orchestrator:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator
      - name: Smoke test the image
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/orch
          # The card is only fetched when a thread is delegated, never at boot.
          CODER_A2A_TOKEN: dummy-token-for-the-smoke-test
        run: |
          set -euo pipefail
          expected_user=65532:65532
          user=$(docker inspect -f '{{.Config.User}}' orchestrator:smoke)
          [ "$user" = "$expected_user" ] || { echo "::error::image user is '$user', expected $expected_user"; exit 1; }

          cid=$(docker run -d --network host \
            -e DATABASE_URL -e CODER_A2A_TOKEN \
            -e AGENTS_FILE=/agents.yaml -e LISTEN_ADDR=127.0.0.1:8080 \
            -v "$PWD/orchestrator/agents.example.yaml:/agents.yaml:ro" \
            orchestrator:smoke)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          curl --silent --show-error --fail --output /dev/null --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8080/healthz

          # The running process, not just the image metadata, is not root.
          # `docker top` needs the pid column in its ps options.
          uid=$(docker top "$cid" -eo pid,uid | awk 'NR > 1 { print $2; exit }')
          [ "$uid" = "65532" ] || { echo "::error::the process runs as uid '$uid', expected 65532"; exit 1; }

          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = 200 ]
          # /readyz also needs the database (migrated at boot).
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz)" = 200 ]
          # Fail closed: the API needs the identity header the proxy adds.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/agents)" = 401 ]

          # SIGTERM drains and exits 0 well inside the timeout (137 would mean it was killed).
          docker stop --time 20 "$cid" >/dev/null
          code=$(docker inspect -f '{{.State.ExitCode}}' "$cid")
          [ "$code" = 0 ] || { echo "::error::exit code $code after SIGTERM, expected 0"; exit 1; }
          # Read the whole log first: `docker logs | grep -q` under pipefail fails whenever grep exits on its
          # match while docker logs is still writing (SIGPIPE), which reported a clean shutdown as missing.
          logs=$(docker logs "$cid" 2>&1)
          grep -q 'shutting down' <<<"$logs" || { echo "::error::no clean shutdown in the log"; exit 1; }
      - name: Push (main only)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: orchestrator
          file: orchestrator/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            ORCH_BUILD_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=orchestrator

  # The image that was just pushed is the one the chart deploys: set `orchestrator.image.tag` in deploy/chart/values.yaml to
  # `sha-<first 7 of the commit>` and push `chore(deploy): bump orchestrator to sha-xxxxxxx` to main as github-actions. It
  # is a no-op when the tag is already current, and it cannot loop: the push is made with GITHUB_TOKEN (which does not
  # trigger workflows). Argo CD tracks this repository's HEAD (home-os) and rolls the new tag out. Whether main accepts a
  # push from github-actions is *unverified* for this repository (adam-rs's coder.yml does it in the same organisation).
  bump:
    name: bump the tag in the deploy chart
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-bump
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set orchestrator.image.tag and push
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          tag="sha-$(printf '%s' "$SHA" | cut -c1-7)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # A newer commit that changes what this workflow builds makes its own image and bumps for itself; do not put the tag
            # back to this older one (image jobs can finish out of order). Commits elsewhere (the chart, the web image) do not count.
            newer="$(git log --format=%s "$SHA..origin/main" -- orchestrator docs/api/chat-api.yaml docs/api/examples web/src/features/chat/lib/a2ui/catalog docs/api/config.md docs/api/config.schema.json dev/orchestrator.yaml dev/orchestrator.live.yaml dev/agents.yaml dev/agents.live.yaml dev/mcp-tokens.yaml .github/workflows/orchestrator.yml | grep -v '^chore(deploy): bump ' || true)"
            if [ -n "$newer" ]; then
              echo "main has moved on since $SHA; the newer build will bump"
              exit 0
            fi
            result="$(sh deploy/chart/bump-tag.sh deploy/chart/values.yaml orchestrator "$tag")"
            echo "$result"
            case "$result" in
              unchanged*) exit 0 ;;
            esac
            git add deploy/chart/values.yaml
            git commit -m "chore(deploy): bump orchestrator to $tag"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push raced with another commit (attempt $attempt); retrying"
            sleep $((attempt * 3))
          done
          echo "could not push the bump" >&2
          exit 1
