name: Orchestrator

# check: fmt, clippy and the tests of the orchestrator workspace, with a Postgres service so
#        the store, end-to-end and binary tests all run against a real database; on pull
#        requests also the guard that applied migrations are never edited.
# image: builds the container image (pull requests: build only, to validate the Dockerfile;
#        main: build and push to ghcr.io) and, before anything is pushed, runs it against a
#        Postgres service: non-root, /healthz and /readyz answer, SIGTERM exits cleanly.
#
# Path filters mean this check must not be made "required" for unrelated PRs.

on:
  pull_request:
    paths:
      - "orchestrator/**"
      - "docs/api/chat-api.yaml"
      - "docs/api/examples/**"
      # the e2e suite reads the web's UI catalog (crates/e2e/tests/ui_catalog.rs)
      - "web/src/features/chat/lib/a2ui/catalog/**"
      - ".github/workflows/orchestrator.yml"
  push:
    branches: [main]
    paths:
      - "orchestrator/**"
      - "docs/api/chat-api.yaml"
      - "docs/api/examples/**"
      # the e2e suite reads the web's UI catalog (crates/e2e/tests/ui_catalog.rs)
      - "web/src/features/chat/lib/a2ui/catalog/**"
      - ".github/workflows/orchestrator.yml"

permissions:
  contents: read

concurrency:
  group: orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ORCH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/orch_test
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v7
        with:
          # The migrations guard diffs against the base branch.
          fetch-depth: 0
      - name: Applied migrations stay append-only
        if: github.event_name == 'pull_request'
        # A migration that has run anywhere is history: editing, renaming or deleting it makes
        # sqlx refuse to start against a database that applied the old bytes. Only additions pass.
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status "origin/${BASE_REF}...HEAD" -- orchestrator/crates/store-postgres/migrations | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "::error::Applied migrations must not be modified, renamed or deleted; add a new numbered migration instead."
            echo "$changed"
            exit 1
          fi
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.94.1 --profile minimal -c rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "orchestrator -> target"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The binary without its surfaces (each is a Cargo feature): it must still build and its
      # configuration must still be valid.
      - run: cargo clippy -p orchestrator --no-default-features --bins --locked -- -D warnings
      - run: cargo test -p orchestrator --no-default-features --bins --locked
      - run: cargo test --workspace --locked
      # In-process agents (ADR 0015) are a Cargo feature of the binary, off by default and so
      # not covered by the workspace commands above: lint it, and run its own tests (the
      # binary hosting an echo agent, and the roles splitting the work) against the database.
      - run: cargo clippy -p orchestrator --features agent-local --all-targets --locked -- -D warnings
      - run: cargo test -p orchestrator --features agent-local --locked

  image:
    needs: check
    runs-on: ubuntu-latest
    # The only job that may write packages; it gets the token only through docker/login-action.
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IMAGE: ghcr.io/vymalo/another-agentic-system/orchestrator
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: orchestrator
          file: orchestrator/Dockerfile
          platforms: linux/amd64
          # Loaded into the local daemon so the smoke test below runs what would be pushed.
          load: true
          push: false
          tags: orchestrator:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=orchestrator
          cache-to: type=gha,mode=max,scope=orchestrator
      - name: Smoke test the image
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/orch
          # The card is only fetched when a thread is delegated, never at boot.
          CODER_A2A_TOKEN: dummy-token-for-the-smoke-test
        run: |
          set -euo pipefail
          expected_user=65532:65532
          user=$(docker inspect -f '{{.Config.User}}' orchestrator:smoke)
          [ "$user" = "$expected_user" ] || { echo "::error::image user is '$user', expected $expected_user"; exit 1; }

          cid=$(docker run -d --network host \
            -e DATABASE_URL -e CODER_A2A_TOKEN \
            -e AGENTS_FILE=/agents.yaml -e LISTEN_ADDR=127.0.0.1:8080 \
            -v "$PWD/orchestrator/agents.example.yaml:/agents.yaml:ro" \
            orchestrator:smoke)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          curl --silent --show-error --fail --output /dev/null --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8080/healthz

          # The running process, not just the image metadata, is not root.
          # `docker top` needs the pid column in its ps options.
          uid=$(docker top "$cid" -eo pid,uid | awk 'NR > 1 { print $2; exit }')
          [ "$uid" = "65532" ] || { echo "::error::the process runs as uid '$uid', expected 65532"; exit 1; }

          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = 200 ]
          # /readyz also needs the database (migrated at boot).
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/readyz)" = 200 ]
          # Fail closed: the API needs the identity header the proxy adds.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/agents)" = 401 ]

          # SIGTERM drains and exits 0 well inside the timeout (137 would mean it was killed).
          docker stop --time 20 "$cid" >/dev/null
          code=$(docker inspect -f '{{.State.ExitCode}}' "$cid")
          [ "$code" = 0 ] || { echo "::error::exit code $code after SIGTERM, expected 0"; exit 1; }
          # Read the whole log first: `docker logs | grep -q` under pipefail fails whenever grep exits on its
          # match while docker logs is still writing (SIGPIPE), which reported a clean shutdown as missing.
          logs=$(docker logs "$cid" 2>&1)
          grep -q 'shutting down' <<<"$logs" || { echo "::error::no clean shutdown in the log"; exit 1; }
      - name: Push (main only)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: orchestrator
          file: orchestrator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=orchestrator
