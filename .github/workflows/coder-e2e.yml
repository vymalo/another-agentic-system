name: Coder E2E

# A chat message becomes a pull request (ADR 0014). The compose `app` profile runs the real edge,
# web UI, orchestrator and Postgres, and the PUBLISHED adam-coder image pinned in compose.yaml,
# beside mocks vendored from the same adam-rs commit (dev/coder/UPSTREAM): a scripted model, a
# GitHub API stand-in and a git server, and `mock-ci`, a CI stand-in that reports the pushed commit to the
# orchestrator's GitHub webhook (the coder is gated on CI, ADR 0017). dev/coder-e2e.sh then creates a
# thread through the AG-UI run route and checks the thread, the artifacts, the CI card, the mocks'
# journals and the pushed branch. Two more agents run beside the coder from the SAME image (`adam-agent`, a folder
# each: a chat and a researcher, on a scripted model and a mock web search), and dev/agents-e2e.sh asserts each
# answers in its role. The coder also asks with Choices: dev/choices-e2e.sh sends the web's UI catalog with a run,
# and asserts one form of three questions, the person's answers as one action, and a newer catalog recorded; the
# researcher answers with cards and a graph: dev/cards-e2e.sh asserts one surface of a Text, three cards and a Mermaid
# graph under the same catalog, an older screen leaving the thread's catalog alone, and words only for a screen without Cards.
# A file the coder makes reaches the person (dev/artifact-e2e.sh, ADR 0032): the coder (as `coder-share`, no gate) makes an SVG, a PNG and
# a JSON report, shares them with `share_file`, and the orchestrator keeps them in the volume `orchestrator-artifacts`; the thread's log holds
# the references, a surface places two as Images after the files, and the API serves the bytes to the owner (the SVG sanitized) and to nobody
# else. It runs a second time on the split stack, where a worker keeps the file and the control plane serves it.
# The stack signs people in: a real oauth2-proxy (pinned by tag and digest in compose.yaml) behind the edge, a mock OIDC issuer
# (dev/mock-oidc) that approves everybody, and the orchestrator as an OAuth2 resource server (`auth.mode: jwt`, ADR 0033); every script
# gets a token of the mock (dev/auth-header.sh), and dev/rbac-e2e.sh asserts the roles (a user sees only their threads, an administrator
# reads all and acts on none of another's, a wrong audience is 401, `chat-only` is refused the coder).
# A repository's own devcontainer is the coder's work environment (ADR 0028, dev/devcontainer-e2e.sh): the stack runs again with
# dev/compose.devcontainer.yaml, a rootless Podman service (no `privileged`, no `cap_add`, no `devices`) the coder builds
# `.devcontainer/devcontainer.json` on, and the script asserts the devcontainer (`local/devbox`), the default image
# (`local/sandbox`), a stopped service (the run goes on in the coder's own container, and says so), a devcontainer.json that cannot be
# used (`local/devbox-broken`: the person decides), the teardown, and the service's privileges. Ubuntu 24.04 restricts unprivileged user
# namespaces under AppArmor: the job turns that off when the key exists. It runs on every run, on the small MCR base image as the
# default environment (the real `workspace` image, about 9 GB more, is for a run by hand: dev/README.md, "Devcontainers").
# The coder needs no repository to start (dev/workspace-e2e.sh): it builds in a scratch project, creates a repository only after the person
# says yes to a form, and adds a second repository to its workspace only after a yes; GitHub is read over MCP (the mock `mock-github-mcp`),
# and the coder pass is run twice, once with the coder's GitHub credential a token and once as a GitHub App installation
# (dev/compose.github-app.yaml: mock-github trades the coder's signed JWT for an installation token).
#
#   vendored   the vendored files still equal upstream and compose.yaml pins the matching image
#   coder-e2e  build orchestrator + web, pull the coder (about 2.9 GB; the chat and the researcher use the same image),
#              run dev/e2e-all.sh (every scenario: the roles of the sign-in (dev/rbac-e2e.sh), the coder's greeting, the three agents each answering in its role,
#              a web search attached to a chat (dev/tools-e2e.sh),
#              the coder asking with Choices, the researcher answering with cards and a graph, forking a thread (the first message of the fork reaches the mock agent with the conversation it continues), the platform's agent registry (an agent added
#              to the mock registry shows up with no restart, a registry that is down leaves the static agents), the coder twice, with OpenCode and NO_OPENCODE=1, the verification gate, the verifier, MCP through
#              the edge, the CI webhook, the coder's workspaces (a repository created or a second one added only after a yes), the files the coder
#              hands over (kept, referenced, served, the SVG sanitized, another user's request a 404), and the coder
#              restarted on a copy of its agent folder with another name), then run the coder, with and without OpenCode, and the workspaces again
#              with the coder as a GitHub App (`-f dev/compose.github-app.yaml`; GITHUB_AUTH=app), then
#              the work environments (the stack with `-f dev/compose.devcontainer.yaml`, the AppArmor sysctl set first, and
#              dev/devcontainer-e2e.sh), then
#              restart the orchestrator as a control plane beside two workers (profile `split`) and run
#              dev/split-e2e.sh, which SIGKILLs the worker that holds a task (ADR 0015)
#
# The path filters are broad on purpose: a change to the orchestrator, the web UI, the API contract
# or the dev stack must meet the coder. Path filters mean this check must not be made "required"
# for unrelated PRs.

on:
  pull_request:
    paths:
      - "compose.yaml"
      - "compose.live.yaml"
      - ".env.example"
      - "dev/**"
      - "orchestrator/**"
      - "web/**"
      - "docs/api/chat-api.yaml"
      - ".github/workflows/coder-e2e.yml"
  push:
    branches: [main]
    paths:
      - "compose.yaml"
      - "compose.live.yaml"
      - ".env.example"
      - "dev/**"
      - "orchestrator/**"
      - "web/**"
      - "docs/api/chat-api.yaml"
      - ".github/workflows/coder-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coder-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendored:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Vendored mocks equal upstream, none is missing, and the coder image pin matches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dev/coder/check-vendored.sh

  coder-e2e:
    needs: vendored
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COMPOSE_PROFILES: app
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        # The coder image is about 2.9 GB and the two builds add several more: drop what the job never uses.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /
      - uses: docker/setup-buildx-action@v4
      # The tags are the ones compose.yaml names, so `up --no-build` uses these images. The cache
      # scopes are those of the Orchestrator and Web workflows; this job only reads them.
      - name: Build the orchestrator image
        uses: docker/build-push-action@v7
        with:
          context: orchestrator
          file: orchestrator/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: another-agentic-system/orchestrator:dev
          cache-from: type=gha,scope=orchestrator
      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: another-agentic-system/web:dev
          # as `build.args` of the `web` service in compose.yaml: a 401 sends the page to oauth2-proxy's sign-in
          build-args: NEXT_PUBLIC_SIGN_IN_PATH=/oauth2/start
          cache-from: type=gha,scope=web
      - name: Pull the coder and build the git server, the mock CI, the mock web search and the mock OIDC issuer
        # One adam-rs image is the coder and, with another entrypoint, the chat and the researcher (compose.yaml,
        # `x-adam-image`): pulling `coder` pulls all three. The model mock of the two is WireMock, pulled by `up`.
        run: |
          docker compose pull coder
          docker compose build git-server mock-ci mock-mcp-search mock-oidc
      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 600
      - name: Every scenario of the local stack (dev/e2e-all.sh)
        # The command the README gives an owner, so it is what CI runs: "hi" gets the coder's greeting, the chat and the
        # researcher answer in their role (the researcher searches the mock web search and cites a result), the coder asks three
        # questions as one form from the web's catalog and goes on with the answers of one action (dev/choices-e2e.sh; a newer
        # catalog is recorded too, and the coder's thread tools, plain http to the orchestrator, are offered to its model), the researcher
        # searches the mock web search and answers with one surface of a Text, three cards and a Mermaid graph (dev/cards-e2e.sh; a screen
        # without Cards gets words only), a web search attached to a conversation (dev/tools-e2e.sh: GET /api/tool-servers lists `websearch`
        # with its icon; a chat created with `vymalo.tools` calls the relayed tool `websearch__web_search` of the thread's endpoint on the scripted
        # model, answers from its result and ends done; the export has `tools_attached` and exactly one tool step, running then completed, with the
        # icon `mcp-server:websearch`, the input and the output; the mock search is sent the configured bearer and header; no secret value is
        # in the export, the frames or the model's requests; after `PUT /api/threads/{id}/tools` with no servers the chat answers "No web search
        # attached"; a plain agent's capabilities have no thread-tools key), the orchestrator's own model call (dev/title-e2e.sh: a thread is titled by `mock-title` after the agent's
        # first reply, a model with no topic or a failing one leaves the first words, a person's rename is final), the thread's description (dev/description-e2e.sh: when a job ends `mock-description` writes one at its own endpoint, with the guidance of the configuration and the core's form, data clause and language line around it; a person's description or clearing it is final and a fork has it), a thread forked through the API
        # (dev/fork-e2e.sh: the first message of the fork reaches the mock agent with the conversation it continues, read from the mock's request journal),
        # chat -> coder ->
        # branch -> mock-ci -> green -> pull request (OpenCode, then the check command alone; the coder's work as a tree of steps with OpenCode a
        # sub-agent step, and its answer shown live, then completed by the log's message), red once -> sent back -> green and red always -> failed (the mock
        # agent behind `mock-coder-gated`, which a run may not weaken), the verifier's findings -> rework -> pass
        # (`mock-coder-verified`), an MCP client following a job with progress, and a signed CI report that sends an
        # agent back and then ends the job (`mock-coder-ci`, dev/ci-webhook.sh through the edge's /webhooks/*), and, last, the
        # coder restarted by `docker compose up -d --no-build coder` on a copy of dev/coder/agent that gives it another name
        # (dev/agent-folder-e2e.sh: a folder change needs a restart, no rebuild), then put back on its own folder. Before that, the coder's
        # workspaces (dev/workspace-e2e.sh): a task that names no repository is built in a scratch project and the coder asks where to put it;
        # a repository it creates (POST /orgs/scratch/repos on mock-github, then an empty repository on git-server) only after the person
        # answers yes to a form, and none after no; a second repository (local/library) joins the workspace only after a yes, and
        # git-server's log shows it was never asked for after a no; the gate, the CI card (mock-ci found the new repository) and the pull
        # request are those of the repository the work reached. The coder's read of GitHub over MCP is asserted by dev/coder-e2e.sh.
        # The files a person is handed (dev/artifact-e2e.sh): the coder makes an SVG (with a script and handlers in it), a PNG and a JSON report
        # in a scratch project and shares them; each is kept by its hash and the log holds only the reference; the surface that places two as
        # Images comes after the files; GET on the reference returns the bytes with the right type, nosniff and the sandboxing CSP (the SVG
        # sanitized inline, the original as a download), and another user, another thread and a wrong hash get a 404.
        # The gates are the orchestrator's, so scripted agents are enough for all but the coder's scenarios; the script also reads the mock
        # verifier's request journal. VERBOSE=1 streams every script's own output into this log.
        env:
          VERBOSE: "1"
        run: dev/e2e-all.sh
      - name: The coder as a GitHub App (the coder scenarios again, dev/compose.github-app.yaml)
        # The same coder with `GITHUB_TOKEN` off and an App installation instead: an init service makes a throwaway key, the coder signs a JWT
        # with it and mock-github trades it for an installation token (it lasts four minutes, so the coder renews it all the time). `up coder`
        # recreates only the coder. Each script asserts the trade and that every call to /repos/... and /orgs/... carried the installation
        # token, never the JWT (GITHUB_AUTH=app); the credential is the coder's own and is nowhere in a thread's log.
        env:
          GITHUB_AUTH: app
        run: |
          docker compose -f compose.yaml -f dev/compose.github-app.yaml up -d --no-build --wait --wait-timeout 300 coder
          sh dev/coder-e2e.sh
          NO_OPENCODE=1 sh dev/coder-e2e.sh
          sh dev/workspace-e2e.sh
      - name: Work environments (a rootless Podman service beside the coder, dev/compose.devcontainer.yaml; dev/devcontainer-e2e.sh)
        # `up` starts `podman` (built from dev/coder/podman: Podman's own image, pinned) and recreates the coder (it now builds a repository's
        # devcontainer on the service), mock-ci (it now watches `local/devbox`, where the gate waits for CI) and mock-openai (OpenCode,
        # inside a devcontainer, reaches it on the service's network). The script first asserts that the service has no privileged, cap_add
        # or devices, then runs the four scenarios (devcontainer, default-env, broken-env, no-runtime). The default environment of a
        # repository without a devcontainer is the small MCR base image (367 MiB; the override's DEVCONTAINER_DEFAULT_IMAGE): the real
        # workspace image is about 9 GB more, for a run by hand. Rootless Podman needs unprivileged user namespaces, and Ubuntu 24.04
        # runners set kernel.apparmor_restrict_unprivileged_userns=1 (*unverified*, a secondary source: this step is the proof), so it is
        # turned off where the key exists; without it the coder would fall back to its own container and the scenarios would fail saying so.
        # The next step brings the base stack back (its `up` recreates the coder without the override).
        timeout-minutes: 40
        env:
          COMPOSE_FILES: -f compose.yaml -f dev/compose.devcontainer.yaml
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES build podman
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES up -d --no-build --wait --wait-timeout 300 podman coder mock-ci
          dev/devcontainer-e2e.sh
          # shellcheck disable=SC2086
          docker compose $COMPOSE_FILES stop podman
      - name: Split roles (a control plane and two workers; the worker that holds a task is killed; a file a worker keeps is served by the control plane)
        # `up` recreates `orchestrator` with ORCHESTRATOR_ROLE=control-plane (compose.yaml) and starts the
        # two workers from the same image; the script then needs every process to deliver through them.
        env:
          COMPOSE_PROFILES: app,split
          ORCHESTRATOR_ROLE: control-plane
        run: |
          docker compose up -d --no-build --wait --wait-timeout 300
          dev/split-e2e.sh
          # a file kept by a worker and served by the control plane: they must see the same directory (the volume orchestrator-artifacts)
          dev/artifact-e2e.sh
      - name: Logs and journals
        if: failure()
        # The split profile is named here too, so the workers' logs are in the output.
        env:
          COMPOSE_PROFILES: app,split
        run: |
          # the override is named so that the Podman service's logs are in the output too
          docker compose -f compose.yaml -f dev/compose.devcontainer.yaml ps --all || true
          docker compose -f compose.yaml -f dev/compose.devcontainer.yaml logs --no-color || true
          for m in 8091 8092 8083 8094 8085; do
            echo "== journal of the mock on port $m"
            curl -s "http://127.0.0.1:$m/__admin/requests" | jq -c '.requests[] | {method: .request.method, url: .request.url, status: .response.status, body: (.request.body // "" | .[0:300])}' || true
          done
          echo "== unmatched requests of mock-openai (the coder's model) and of mock-model (the chat's and the researcher's)"
          for m in 8091 8094; do
            curl -s "http://127.0.0.1:$m/__admin/requests/unmatched" | jq -c '.requests[] | {method: .method, url: .url, body: (.body // "" | .[0:300])}' || true
          done
          echo "== calls of the mock web search (the researcher's tool, and the one attached to a chat)"
          curl -s http://127.0.0.1:8096/__journal | jq -c '.calls[]' || true
      - name: Tear down
        if: always()
        env:
          COMPOSE_PROFILES: app,split
        run: docker compose -f compose.yaml -f dev/compose.devcontainer.yaml down -v --remove-orphans
