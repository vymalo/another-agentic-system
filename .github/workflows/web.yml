name: Web

# Chat surface (web/): Biome, typecheck (types generated from the API contract), unit tests,
# production build, Playwright + accessibility checks against the contract mock, and the
# container image (pushed only from main), then the tag bump in the deploy chart (deploy/chart,
# ADR 0041). See web/README.md.

on:
  pull_request:
    paths: ["web/**", "docs/api/chat-api.yaml", "orchestrator/crates/agui-proto/schema/ag-ui-1.0.schema.json", "docs/api/examples/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", "docs/api/chat-api.yaml", "orchestrator/crates/agui-proto/schema/ag-ui-1.0.schema.json", "docs/api/examples/**", ".github/workflows/web.yml"]

permissions:
  contents: read

# A pull request run is replaced by the next push to its branch. A push to main has a group of its own, its sha, and is
# never cancelled or replaced: release.yml copies the sha-<7> image of the newest commit that changed this workflow's paths,
# and no one can say in advance which commit that is. A shared group would not be enough: it keeps one running and one
# pending run, and a newer pending run cancels the older pending one even with cancel-in-progress false (ANR-1197, ADR 0106
# amended 2026-11-27).
concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - name: Biome
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    needs: check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright and Lighthouse against the mock
        run: pnpm test:e2e
        env:
          CI: "true"
      # its own build, with the edge's sign-in built in (web/README.md "Signing in again")
      - name: Session refresh and sign-in popup against the mock
        run: pnpm test:e2e:session
        env:
          CI: "true"
      # its own build and its own mock, which is the issuer too (web/README.md "Signing in itself")
      - name: The web's own tokens, DPoP and the policy against the mock issuer
        run: pnpm test:e2e:browser
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/playwright-report-session
            web/playwright-report-browser

  # The committed screenshots (web/e2e/__screens__) are generated in the `screens` target of web/Dockerfile, never on a host: this
  # regenerates them there and fails when a still differs by more than the bound: at most 0.05 % of its pixels beyond 8/255, or a
  # missing still or other dimensions (web/README.md "screens-docker.sh").
  screens:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Generate the screens in the image and compare
        env:
          SCREENS_KEEP: ${{ runner.temp }}/screens-generated
        run: sh web/scripts/screens-docker.sh check
      # what the image drew, kept when the comparison fails, so the set is committed from the image and never by hand
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screens-generated
          path: ${{ runner.temp }}/screens-generated
          retention-days: 7
          if-no-files-found: ignore

  image:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # The static export served by Caddy (ADR 0047), tried as the chart runs it before anything is pushed: read-only, unprivileged,
      # the shells of /threads/* and /s/*, the headers and the content security policy's two halves (web/tests/image-smoke.sh).
      - name: Build the image to try it
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          load: true
          tags: web:smoke
          build-args: |
            NEXT_PUBLIC_SIGN_IN_PATH=/oauth2/start
            NEXT_PUBLIC_BUILD_REVISION=${{ github.sha }}
          # the same labels as the push below, so the image tried is the image pushed
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
      - name: The image serves the export
        run: sh web/tests/image-smoke.sh web:smoke
      # PRs build (proving the Dockerfile) but do not push.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          # Next inlines NEXT_PUBLIC_* at build time, so the sign-in redirect of a deployment (oauth2-proxy at the edge, ADR 0033)
          # is part of the image: without it a 401 is an error line, not a redirect to sign in. compose.yaml builds with the same.
          # NEXT_PUBLIC_BUILD_REVISION is the commit the web is built from: the web sends it with an export so that the
          # file says which web saved it (ADR 0053).
          build-args: |
            NEXT_PUBLIC_SIGN_IN_PATH=/oauth2/start
            NEXT_PUBLIC_BUILD_REVISION=${{ github.sha }}
          # The commit this image is built from, read by release.yml before it copies `sha-<7>` to a release tag (ADR 0106), as the
          # orchestrator's image carries it from docker/metadata-action.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/vymalo/another-agentic-system/web:sha-${{ steps.tag.outputs.short }}
            ghcr.io/vymalo/another-agentic-system/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # The image that was just pushed is the one the chart deploys: set `web.image.tag` in deploy/chart/values.yaml to
  # `sha-<first 7 of the commit>` and push `chore(deploy): bump web to sha-xxxxxxx` to main as github-actions. It is a no-op
  # when the tag is already current, and it cannot loop: the push is made with GITHUB_TOKEN (which does not trigger
  # workflows). Argo CD tracks this repository's HEAD (home-os) and rolls the new tag out. Whether main accepts a push from
  # github-actions is *unverified* for this repository (adam-rs's coder.yml does it in the same organisation).
  bump:
    name: bump the tag in the deploy chart
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-bump-web
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set web.image.tag and push
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          tag="sha-$(printf '%s' "$SHA" | cut -c1-7)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # A newer commit that changes what this workflow builds makes its own image and bumps for itself; do not put the tag
            # back to this older one (image jobs can finish out of order). Commits elsewhere (the chart, the other image) do not count.
            # The paths are read from this workflow's own on.push.paths (tools/release-source.sh), so the list cannot drift.
            newest="$(sh tools/release-source.sh .github/workflows/web.yml origin/main)"
            if [ "$newest" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$newest"; then
              echo "main has moved on since $SHA; the newer build will bump"
              exit 0
            fi
            result="$(sh deploy/chart/bump-tag.sh deploy/chart/values.yaml web "$tag")"
            echo "$result"
            case "$result" in
              unchanged*) exit 0 ;;
            esac
            git add deploy/chart/values.yaml
            git commit -m "chore(deploy): bump web to $tag"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push raced with another commit (attempt $attempt); retrying"
            sleep $((attempt * 3))
          done
          echo "could not push the bump" >&2
          exit 1
