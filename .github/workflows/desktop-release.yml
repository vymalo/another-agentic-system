name: Desktop release

# release-please publishes the vX.Y.Z GitHub Release with the GitHub App token.
# This workflow starts from that published release (never a bare tag), then only
# attaches tested assets; it never publishes Windows bundles or creates a
# competing release.

on:
  release:
    types: [published]

concurrency:
  group: desktop-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-preflight:
    name: Verify the release-please publication
    runs-on: ubuntu-24.04
    steps:
      - name: Require the release GitHub App and a semantic-version tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          AUTHOR: ${{ github.event.release.author.login }}
          APP_SLUG: ${{ vars.RELEASE_PLEASE_APP_SLUG }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "expected a vX.Y.Z release tag, got $TAG" >&2
            exit 1
          fi
          test -n "$APP_SLUG"
          test "$AUTHOR" = "${APP_SLUG}[bot]"

  bundle:
    name: ${{ matrix.name }} bundle
    needs: release-preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            bundles: dmg
            artifact: another-agentic-macos-arm64
            path: apps/tauri/src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS Intel
            runner: macos-15-intel
            bundles: dmg
            artifact: another-agentic-macos-x64
            path: apps/tauri/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux x86_64
            runner: ubuntu-24.04
            bundles: deb,appimage
            artifact: another-agentic-linux-x64
            path: |
              apps/tauri/src-tauri/target/release/bundle/deb/*.deb
              apps/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev file
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6.0.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            apps/tauri/pnpm-lock.yaml
      - name: Install the pinned Rust toolchain
        working-directory: apps/tauri/src-tauri
        run: rustup toolchain install 1.94.1 --profile minimal -c rustfmt,clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.8.1
        with:
          workspaces: "apps/tauri/src-tauri -> target"
      - name: Install the Tauri CLI
        working-directory: apps/tauri
        run: pnpm install --frozen-lockfile
      - name: Build the web for the app
        working-directory: apps/tauri
        run: pnpm build:web
      - name: Check the Rust app
        working-directory: apps/tauri/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Bundle the release assets
        working-directory: apps/tauri
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.deployment.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    name: attach release assets
    needs: bundle
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.assets.outputs.version }}
      macos_arm64_sha: ${{ steps.assets.outputs.macos_arm64_sha }}
      macos_x64_sha: ${{ steps.assets.outputs.macos_x64_sha }}
      linux_x64_sha: ${{ steps.assets.outputs.linux_x64_sha }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Mint the release GitHub App token for both repositories
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: vymalo
          repositories: another-agentic-system,homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          path: release-assets
      - name: Verify the release created by release-please exists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" > /dev/null
      - name: Normalize, checksum, and attach all assets
        id: assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing non-semver tag: $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          mkdir release-upload
          cp release-assets/another-agentic-macos-arm64/*.dmg "release-upload/another-agentic_${version}_macos_arm64.dmg"
          cp release-assets/another-agentic-macos-x64/*.dmg "release-upload/another-agentic_${version}_macos_x64.dmg"
          cp release-assets/another-agentic-linux-x64/*.deb "release-upload/another-agentic_${version}_linux_x64.deb"
          cp release-assets/another-agentic-linux-x64/*.AppImage "release-upload/another-agentic_${version}_linux_x64.AppImage"
          (
            cd release-upload
            shasum -a 256 another-agentic_* > SHA256SUMS
          )
          assets=(
            "release-upload/another-agentic_${version}_macos_arm64.dmg"
            "release-upload/another-agentic_${version}_macos_x64.dmg"
            "release-upload/another-agentic_${version}_linux_x64.deb"
            "release-upload/another-agentic_${version}_linux_x64.AppImage"
            release-upload/SHA256SUMS
          )
          gh release upload "$TAG" --clobber "${assets[@]}"
          {
            echo "version=$version"
            echo "macos_arm64_sha=$(awk '$2 ~ /_macos_arm64\.dmg$/ { print $1 }' release-upload/SHA256SUMS)"
            echo "macos_x64_sha=$(awk '$2 ~ /_macos_x64\.dmg$/ { print $1 }' release-upload/SHA256SUMS)"
            echo "linux_x64_sha=$(awk '$2 ~ /_linux_x64\.AppImage$/ { print $1 }' release-upload/SHA256SUMS)"
          } >> "$GITHUB_OUTPUT"

  verify-homebrew-linux:
    name: install the Linux Homebrew formula
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Generate and install the formula from the attached release asset
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          MACOS_ARM64_SHA: ${{ needs.publish.outputs.macos_arm64_sha }}
          MACOS_X64_SHA: ${{ needs.publish.outputs.macos_x64_sha }}
          LINUX_X64_SHA: ${{ needs.publish.outputs.linux_x64_sha }}
        run: |
          set -euo pipefail
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          test "$(command -v brew)" = /home/linuxbrew/.linuxbrew/bin/brew
          brew --version
          node apps/tauri/scripts/write-homebrew-tap.mjs homebrew-smoke "$VERSION" "$MACOS_ARM64_SHA" "$MACOS_X64_SHA" "$LINUX_X64_SHA"
          brew install --build-from-source --formula ./homebrew-smoke/Formula/another-agentic.rb
          test -x "$(brew --prefix)/bin/another-agentic"

  verify-homebrew-macos:
    name: install the macOS Homebrew Cask (${{ matrix.name }})
    needs: publish
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-14
          - name: Intel
            runner: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Generate and install the unsigned Cask from the attached release asset
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          MACOS_ARM64_SHA: ${{ needs.publish.outputs.macos_arm64_sha }}
          MACOS_X64_SHA: ${{ needs.publish.outputs.macos_x64_sha }}
          LINUX_X64_SHA: ${{ needs.publish.outputs.linux_x64_sha }}
        run: |
          set -euo pipefail
          brew --version
          node apps/tauri/scripts/write-homebrew-tap.mjs homebrew-smoke "$VERSION" "$MACOS_ARM64_SHA" "$MACOS_X64_SHA" "$LINUX_X64_SHA"
          brew install --cask --no-quarantine ./homebrew-smoke/Casks/another-agentic.rb
          test -d /Applications/another-agentic.app
          test -x /Applications/another-agentic.app/Contents/MacOS/another-agentic

  update-homebrew-tap:
    name: propose the Homebrew tap update
    needs: [publish, verify-homebrew-linux, verify-homebrew-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Mint the release GitHub App token for both repositories
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: vymalo
          repositories: another-agentic-system,homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - name: Discover the tap default branch
        id: tap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          echo "base=$(gh api repos/vymalo/homebrew-tap --jq .default_branch)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vymalo/homebrew-tap
          ref: ${{ steps.tap.outputs.base }}
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Write, commit, and push the bot branch
        id: branch
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ steps.tap.outputs.base }}
          VERSION: ${{ needs.publish.outputs.version }}
          MACOS_ARM64_SHA: ${{ needs.publish.outputs.macos_arm64_sha }}
          MACOS_X64_SHA: ${{ needs.publish.outputs.macos_x64_sha }}
          LINUX_X64_SHA: ${{ needs.publish.outputs.linux_x64_sha }}
        run: |
          set -euo pipefail
          bot_branch='bot/another-agentic-desktop'
          cd homebrew-tap
          git_auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: bearer ${TOKEN}")
          if git "${git_auth[@]}" ls-remote --exit-code --heads origin "$bot_branch" > /dev/null; then
            git "${git_auth[@]}" fetch origin "$bot_branch"
            # This branch is owned solely by this workflow. Recreate it from the current tap default
            # branch so an older open update PR is replaced deterministically instead of asking
            # release delivery to resolve a rebase conflict.
            git checkout -B "$bot_branch" "origin/$BASE"
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -b "$bot_branch" "origin/$BASE"
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi
          node ../source/apps/tauri/scripts/write-homebrew-tap.mjs . "$VERSION" "$MACOS_ARM64_SHA" "$MACOS_X64_SHA" "$LINUX_X64_SHA"
          if git diff --quiet -- Casks/another-agentic.rb Formula/another-agentic.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "branch=$bot_branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'release-please[bot]'
          git config user.email 'release-please[bot]@users.noreply.github.com'
          git add Casks/another-agentic.rb Formula/another-agentic.rb
          git commit -m "chore: update another-agentic to ${VERSION}"
          git "${git_auth[@]}" push --force-with-lease origin "HEAD:refs/heads/$bot_branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$bot_branch" >> "$GITHUB_OUTPUT"
      - name: Open or update the tap pull request
        if: steps.branch.outputs.changed == 'true' || steps.branch.outputs.branch_exists == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ steps.tap.outputs.base }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo vymalo/homebrew-tap --state open --head 'vymalo:bot/another-agentic-desktop' --json url --jq '.[0].url')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore: update another-agentic to ${VERSION}" \
              --body "Updates the macOS Cask and Linux Formula from the verified GitHub Release assets for v${VERSION}."
          else
            gh pr create --repo vymalo/homebrew-tap --base "$BASE" --head 'bot/another-agentic-desktop' \
              --title "chore: update another-agentic to ${VERSION}" \
              --body "Updates the macOS Cask and Linux Formula from the verified GitHub Release assets for v${VERSION}."
          fi
