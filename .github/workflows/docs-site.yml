name: Docs site

# The VitePress site of docs/ (see docs/.vitepress/STRUCTURE.md). A pull request builds it (a dead link
# fails the build); main publishes it to GitHub Pages.

on:
  pull_request:
    paths: ['docs/**', '.github/workflows/docs-site.yml']
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs-site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the pinned site dependencies
        run: npm --prefix docs ci --no-fund --no-audit
      - name: Build the site
        run: npm --prefix docs run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
