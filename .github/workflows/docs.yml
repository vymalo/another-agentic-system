name: Docs

# Every Mermaid diagram must parse and every relative Markdown link, and every relative image of an
# HTML tag (<img src>, <source srcset>), must resolve. Same script agents and humans run locally
# (see CLAUDE.md).
#
# The development agents (.agents/agents, ADR 0038) must match their links and generated adapters
# (tools/agents/sync.mjs --check); it needs no npm install.
#
# The AG-UI golden streams (docs/api/examples/agui) must also read cleanly through the
# reference client, @ag-ui/client 1.0.0 (tools/agui-conformance). That is a behavioural check the
# Rust schema tests cannot make: ordering, balanced runs, and what a standard client ends up holding.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the agent definitions, their links and adapters
        run: node tools/agents/sync.mjs --check
      - name: Install pinned checker dependencies
        run: npm --prefix tools/docs-check ci --no-fund --no-audit
      - name: Check diagrams, links and images
        run: node tools/docs-check/check-docs.mjs

  agui-goldens:
    name: AG-UI goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the pinned reference client
        run: npm --prefix tools/agui-conformance ci --no-fund --no-audit
      - name: Read every golden through the reference client
        run: node tools/agui-conformance/check.mjs
