name: Deploy

# The Helm chart of a real deployment (deploy/chart, ADR 0041): lint, the render checked against Kubernetes and CRD
# schemas, the guarantees asserted on the render (no secret value, a production configuration, images pinned,
# nothing exposed that should not be, the public link's three edge routes the same in dev/Caddyfile as in the chart's), the rendered configuration read by the orchestrator image the chart deploys
# (`--print-config`, no connection; also with the tool servers on, and with `model.baseUrlFromSecret` as soon as the pinned
# image accepts it), the Keycloak exports checked for secrets, and a dry run of the tag bump that orchestrator.yml and
# web.yml make on main (searxng-mcp.yml's is the same script), and the files host's Caddyfile run in the pinned Caddy image in front of a stub upstream
# (deploy/chart/tests/files-host-ci.sh). The database backups' objects and the two restore examples are validated against the vendored CRD schemas too
# (issue #151), and so is the Pooler of the database scaled out (issue #290). Nothing here touches a cluster.
#
# The bump itself is the last job of orchestrator.yml and web.yml: it sets `<component>.image.tag` in
# deploy/chart/values.yaml to `sha-<first 7 of the commit>` after that workflow pushed the image (the pattern of
# vymalo/another-adam-rs coder.yml). Argo CD, in home-os, tracks this repository's HEAD and rolls the new tag out.

on:
  pull_request:
    paths:
      - deploy/**
      - dev/agents/chat/**
      - dev/agents/browser/**
      - dev/Caddyfile
      - docs/api/config.schema.json
      - .github/workflows/deploy.yml
  push:
    branches: [main]
    paths:
      - deploy/**
      - dev/agents/chat/**
      - dev/agents/browser/**
      - dev/Caddyfile
      - docs/api/config.schema.json
      - .github/workflows/deploy.yml

env:
  HELM_VERSION: v3.19.0
  KUBECONFORM_VERSION: v0.7.0
  # The Kubernetes version the rendered manifests are validated against.
  KUBERNETES_VERSION: 1.31.0

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  chart:
    name: helm lint, template and render checks
    runs-on: ubuntu-latest
    steps:
      # The whole history: the step that reads the model's address through the pinned image asks whether the tag is past a commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      # `mobileAppLinks` is live by default and production intentionally refuses to render without the real Android
      # certificate and Apple Team ID. CI layers shape-only identities through this PATH wrapper; they live only in the
      # test fixture and can never be an input to home-os or a deployment command. render-check explicitly opts out so
      # it can prove the absent and malformed identity refusals.
      - name: Layer test-only mobile app-link identities into chart checks
        run: |
          set -eu
          real_helm=$(command -v helm)
          bin="$RUNNER_TEMP/chart-test-bin"
          mkdir -p "$bin"
          cat > "$bin/helm" <<EOF
          #!/bin/sh
          if [ "\${AGENTIC_SKIP_MOBILE_LINK_FIXTURE:-}" = 1 ]; then
            exec "$real_helm" "\$@"
          fi
          exec "$real_helm" "\$@" -f "$GITHUB_WORKSPACE/deploy/chart/tests/mobile-app-links.values.yaml"
          EOF
          chmod 755 "$bin/helm"
          echo "$bin" >> "$GITHUB_PATH"
      - name: helm lint
        run: helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml
      - name: helm template (the values of the netcup Application)
        run: helm template another-agentic-system deploy/chart --namespace another-agentic-system -f deploy/chart/examples/netcup.values.yaml > /dev/null
      # The limit per client address on (deploy/chart/tests/ratelimit.values.yaml): off by default, so this is the render a deployment gets when it turns it on.
      - name: helm lint and template with the rate limit on
        run: |
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/ratelimit.values.yaml
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/ratelimit.values.yaml > /dev/null
      # The search pod and both tool servers on (deploy/chart/tests/web-search.values.yaml): off by default, so these are the
      # renders a deployment gets when it turns them on.
      - name: helm lint and template with the search pod and the tool servers on
        run: |
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/web-search.values.yaml
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/web-search.values.yaml > /dev/null
      # The model's address from the AWS secret (`model.baseUrlFromSecret`): off by default. Lint and template here. The pinned
      # orchestrator image reads it with `--print-config` below only once `orchestrator.image.tag` is at or after the commit that
      # made `baseUrl` accept `{ file }`: that check is automatic (deploy/chart/README.md, "The pinned orchestrator image").
      - name: helm lint and template with the model's address from the AWS secret on
        run: |
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml --set model.baseUrl= --set model.baseUrlFromSecret=true
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml --set model.baseUrl= --set model.baseUrlFromSecret=true > /dev/null
      # Sharing (public, the widest) and the coder's database (deploy/chart/tests/sharing.values.yaml, coder-db.values.yaml): both off by
      # default, so these are the renders a deployment gets when it turns them on.
      - name: helm lint and template with sharing and the coder's database on
        run: |
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/sharing.values.yaml -f deploy/chart/tests/coder-db.values.yaml
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/sharing.values.yaml -f deploy/chart/tests/coder-db.values.yaml > /dev/null
      # Several coders, one per GitHub owner (deploy/chart/tests/coders.values.yaml): each a database of the one cluster, a token of its
      # own and a role that names it. Off by default (`sharedDatabase.coders: []`).
      - name: helm lint and template with two coders
        run: |
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/coders.values.yaml
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/coders.values.yaml > /dev/null
      # oauth2-proxy's sessions in Redis (deploy/chart/tests/redis.values.yaml; with and without a volume): off by default (the cookie
      # store), so these are the renders a deployment gets when it turns it on, after adding the AWS property oauth2_redis_password.
      - name: helm lint and template with oauth2-proxy's sessions in Redis on
        run: |
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/redis.values.yaml
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/redis.values.yaml > /dev/null
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/redis.values.yaml \
            --set oauth2Proxy.redis.persistence.enabled=true
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/redis.values.yaml \
            --set oauth2Proxy.redis.persistence.enabled=true > /dev/null
      # The browser agent and its obscura sidecar (deploy/chart/tests/browser.values.yaml, ADR 0057): off by default, so this is the render a
      # deployment gets when it turns it on, after adding the AWS properties browser_a2a_token and obscura_mcp_token.
      - name: helm lint and template with the browser agent on
        run: |
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/browser.values.yaml
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/browser.values.yaml > /dev/null
          # and the chat's remote sub-agent `browser` (browser.chatSubagent, ADR 0057 amended 2026-10-09)
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/browser.values.yaml --set browser.chatSubagent=true
      # The artifact store in S3 on the bundled RustFS (deploy/chart/tests/rustfs.values.yaml, ADR 0032 amended 2026-10-09): off by default
      # (the directory store), so this is the render a deployment gets after adding the two AWS properties of the S3 credentials.
      - name: helm lint and template with the artifacts in S3 on RustFS
        run: |
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/rustfs.values.yaml
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/rustfs.values.yaml > /dev/null
      # The keys of the stored secrets (deploy/chart/tests/user-secrets.values.yaml, ADR 0046 slice 3): off by default (no `secrets` section, no property asked
      # of the AWS secret), so these are the renders a deployment gets after adding the property user_secrets_key, and in the middle of a rotation.
      - name: helm lint and template with the keys of the stored secrets on
        run: |
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/user-secrets.values.yaml
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/user-secrets.values.yaml > /dev/null
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/user-secrets.values.yaml \
            -f deploy/chart/tests/user-secrets-rotation.values.yaml
      # The Job that moves the directory store's files into the bucket (ADR 0058 A5.4): off by default (nothing of it is rendered). Two orders, and the first is
      # the one to use: migrate-before.values.yaml is the sync that turns the Job and the S3 target on while the orchestrator is still on `store: fs` (the Job has a
      # configuration of its own that says `s3`, and is scheduled beside the orchestrator's pod); migrate.values.yaml is the sync after the switch, where the Job
      # copies only what was written in between. With `dryRun` the plan before anything moves, with `allowEmpty` the claim that holds no file.
      - name: helm lint and template with the migration Job on
        run: |
          for shape in migrate-before migrate; do
            helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f "deploy/chart/tests/$shape.values.yaml"
            helm template another-agentic-system deploy/chart --namespace another-agentic-system \
              -f deploy/chart/examples/netcup.values.yaml -f "deploy/chart/tests/$shape.values.yaml" > /dev/null
            helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f "deploy/chart/tests/$shape.values.yaml" \
              --set orchestrator.artifacts.migrate.dryRun=true
            helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f "deploy/chart/tests/$shape.values.yaml" \
              -f deploy/chart/tests/migrate-allow-empty.values.yaml
          done
      # The public files host of RustFS (deploy/chart/tests/files-host.values.yaml, files-host-uploads.values.yaml, ADR 0058 A5.2): off by default
      # (nothing of it is rendered), so these are the renders a deployment gets when it names a host for the bucket, and then turns uploads and CORS on.
      - name: helm lint and template with the files host on
        run: |
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/rustfs.values.yaml -f deploy/chart/tests/files-host.values.yaml
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/rustfs.values.yaml -f deploy/chart/tests/files-host.values.yaml > /dev/null
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/rustfs.values.yaml -f deploy/chart/tests/files-host.values.yaml \
            -f deploy/chart/tests/files-host-uploads.values.yaml
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/rustfs.values.yaml -f deploy/chart/tests/files-host.values.yaml \
            -f deploy/chart/tests/files-host-uploads.values.yaml > /dev/null
      # The database backups to S3 by the barman-cloud plugin (deploy/chart/tests/backup.values.yaml, backup-aws.values.yaml, issue #151): off by default (nothing of
      # it is rendered), so these are the renders a deployment gets when it names a bucket: an S3-compatible server with every knob set, and AWS with the defaults.
      - name: helm lint and template with the database backups on
        run: |
          for shape in backup backup-aws; do
            helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f "deploy/chart/tests/$shape.values.yaml"
            helm template another-agentic-system deploy/chart --namespace another-agentic-system \
              -f deploy/chart/examples/netcup.values.yaml -f "deploy/chart/tests/$shape.values.yaml" > /dev/null
          done
      # The database scaled out and behind a connection pooler (deploy/chart/tests/pooler.values.yaml, issue #290): three instances with resources, a CloudNativePG Pooler
      # in transaction mode, and the orchestrator's two URLs composed from the app Secret. Off by default: nothing of it is rendered then.
      - name: helm lint and template with the database scaled out and the pooler on
        run: |
          helm lint deploy/chart -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/pooler.values.yaml
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/pooler.values.yaml > /dev/null
      - name: A render with no values is refused
        run: |
          if helm template another-agentic-system deploy/chart --namespace another-agentic-system > /dev/null 2>&1; then
            echo "::error::the chart rendered with no host and no issuer"; exit 1
          fi
      - name: The rendered chart keeps its guarantees
        run: sh deploy/chart/tests/render-check.sh
      # Core kinds against the Kubernetes schemas, the CNPG Cluster, Database, Pooler, ScheduledBackup, the plugin's ObjectStore and the ExternalSecret against the CRD
      # schemas vendored in deploy/chart/tests/schemas (a pinned copy of the datreeio catalog, see its README). A kind without a schema
      # fails (no -ignore-missing-schemas), so a new CRD in the chart needs its schema there. The core schemas are
      # downloaded; a download failure (not a validation failure) is retried.
      - name: kubeconform
        env:
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
        run: |
          set -eu
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tgz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$RUNNER_TEMP" kubeconform
          # The default render, with the chat agent and its database, with the search pod and the tool servers on, and without
          # the chat agent and without ExternalSecrets and NetworkPolicies (the other shapes the values allow).
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml > "$RUNNER_TEMP/rendered.yaml"
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/web-search.values.yaml > "$RUNNER_TEMP/rendered-search.yaml"
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml \
            --set chat.enabled=false --set 'agents[0].id=coder' --set 'agents[0].name=Coder' \
            --set 'agents[0].cardUrl=http://coder.another-agentic-system.svc:8080/c' --set 'agents[0].tokenEnv=CODER_A2A_TOKEN' \
            --set externalSecrets.enabled=false --set networkPolicy.enabled=false \
            > "$RUNNER_TEMP/rendered-minimal.yaml"
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml --set model.baseUrl= --set model.baseUrlFromSecret=true \
            > "$RUNNER_TEMP/rendered-model-secret.yaml"
          # Sharing and the coder's database on: a CNPG `Database` and managed roles, which need their schema.
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/sharing.values.yaml -f deploy/chart/tests/coder-db.values.yaml \
            > "$RUNNER_TEMP/rendered-sharing.yaml"
          # Two coders: two more managed roles, `Database` objects and ExternalSecrets.
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/coders.values.yaml \
            > "$RUNNER_TEMP/rendered-coders.yaml"
          # oauth2-proxy's sessions in Redis, without and with a volume: a Deployment, a ConfigMap, a Service, a claim, a NetworkPolicy
          # and an ExternalSecret more than the default render.
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/redis.values.yaml \
            > "$RUNNER_TEMP/rendered-redis.yaml"
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/redis.values.yaml \
            --set oauth2Proxy.redis.persistence.enabled=true \
            > "$RUNNER_TEMP/rendered-redis-volume.yaml"
          # The browser agent: a Deployment with a native sidecar, a Service, a NetworkPolicy, a ConfigMap and an ExternalSecret more.
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/browser.values.yaml \
            > "$RUNNER_TEMP/rendered-browser.yaml"
          # ... with the chat's remote sub-agent: the chat's ConfigMap, environment and Secret, and the browser's policy, change.
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/browser.values.yaml --set browser.chatSubagent=true \
            > "$RUNNER_TEMP/rendered-browser-chat.yaml"
          # The artifacts in S3 on RustFS: a StatefulSet with a claim template, a Service, a hook Job, a NetworkPolicy and an ExternalSecret.
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/rustfs.values.yaml \
            > "$RUNNER_TEMP/rendered-rustfs.yaml"
          # The files host: an Ingress, a Deployment, a Service, a ConfigMap and a NetworkPolicy more than the RustFS render, without and with uploads and CORS.
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/rustfs.values.yaml -f deploy/chart/tests/files-host.values.yaml \
            > "$RUNNER_TEMP/rendered-files-host.yaml"
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/rustfs.values.yaml -f deploy/chart/tests/files-host.values.yaml \
            -f deploy/chart/tests/files-host-uploads.values.yaml \
            > "$RUNNER_TEMP/rendered-files-host-uploads.yaml"
          # The keys of the stored secrets: a key of the orchestrator's ExternalSecret and a mount more, in the middle of a rotation (two keys).
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/user-secrets.values.yaml \
            -f deploy/chart/tests/user-secrets-rotation.values.yaml \
            > "$RUNNER_TEMP/rendered-user-secrets.yaml"
          # The migration Job: a hook Job, its ConfigMap, its ExternalSecret and one line of RustFS's policy more than the RustFS render, after the switch to the bucket
          # (store s3) and before it (store fs, the Job beside the orchestrator's pod by a pod affinity).
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/migrate.values.yaml \
            > "$RUNNER_TEMP/rendered-migrate.yaml"
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/migrate-before.values.yaml \
            > "$RUNNER_TEMP/rendered-migrate-before.yaml"
          # The database backups: an ObjectStore, a ScheduledBackup, an ExternalSecret and the plugin on the Cluster, to an S3-compatible server and to AWS.
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/backup.values.yaml \
            > "$RUNNER_TEMP/rendered-backup.yaml"
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/backup-aws.values.yaml \
            > "$RUNNER_TEMP/rendered-backup-aws.yaml"
          # The limit per client address: a Traefik Middleware more than the default render, and the Ingress naming it.
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/ratelimit.values.yaml \
            > "$RUNNER_TEMP/rendered-ratelimit.yaml"
          # The database scaled out and behind a pooler: a CloudNativePG Pooler more than the default render, three instances with resources on the Cluster, and the orchestrator's
          # Deployment with the two URLs it composes from the app Secret.
          helm template another-agentic-system deploy/chart --namespace another-agentic-system \
            -f deploy/chart/examples/netcup.values.yaml -f deploy/chart/tests/pooler.values.yaml \
            > "$RUNNER_TEMP/rendered-pooler.yaml"
          for attempt in 1 2 3; do
            status=0
            "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
                -schema-location default \
                -schema-location 'deploy/chart/tests/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                "$RUNNER_TEMP/rendered.yaml" "$RUNNER_TEMP/rendered-search.yaml" "$RUNNER_TEMP/rendered-minimal.yaml" \
                "$RUNNER_TEMP/rendered-model-secret.yaml" "$RUNNER_TEMP/rendered-sharing.yaml" \
                "$RUNNER_TEMP/rendered-coders.yaml" "$RUNNER_TEMP/rendered-redis.yaml" "$RUNNER_TEMP/rendered-redis-volume.yaml" \
                "$RUNNER_TEMP/rendered-browser.yaml" "$RUNNER_TEMP/rendered-browser-chat.yaml" "$RUNNER_TEMP/rendered-rustfs.yaml" \
                "$RUNNER_TEMP/rendered-files-host.yaml" "$RUNNER_TEMP/rendered-files-host-uploads.yaml" \
                "$RUNNER_TEMP/rendered-migrate.yaml" "$RUNNER_TEMP/rendered-migrate-before.yaml" \
                "$RUNNER_TEMP/rendered-user-secrets.yaml" \
                "$RUNNER_TEMP/rendered-backup.yaml" "$RUNNER_TEMP/rendered-backup-aws.yaml" \
                "$RUNNER_TEMP/rendered-ratelimit.yaml" "$RUNNER_TEMP/rendered-pooler.yaml" \
                deploy/chart/examples/restore-cluster.yaml deploy/chart/examples/restore-cutover.yaml \
                > "$RUNNER_TEMP/kubeconform.out" 2>&1 || status=$?
            cat "$RUNNER_TEMP/kubeconform.out"
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! grep -q 'failed downloading schema' "$RUNNER_TEMP/kubeconform.out"; then exit "$status"; fi
            echo "schema download failed (attempt $attempt of 3); retrying in 20 s"
            sleep 20
          done
          exit 1
      # The orchestrator that will run this configuration reads it: the image the chart names, the rendered
      # config.yaml and agents.yaml, dummy secret files and variables. `--print-config` opens no connection.
      - name: The orchestrator image reads the rendered configuration
        run: |
          set -eu
          tag=$(awk '/^orchestrator:/ { c = 1; next } c && /^[^ #]/ { c = 0 } c && /^    tag:/ { print $2; exit }' deploy/chart/values.yaml)
          echo "orchestrator image tag: $tag"
          docker pull "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag"
          sh deploy/chart/tests/print-config.sh deploy/chart/examples/netcup.values.yaml docker \
            "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" > /dev/null
          # The same image reads the configuration with `toolServers` in it (deploy-ordering hazard: the chart may only write
          # what the image it pins accepts; the default render has no such key, this one has both servers).
          sh deploy/chart/tests/print-config.sh \
            deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/web-search.values.yaml docker \
            "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" | grep -q '^toolServers:'
          # Two coders: the image reads the agents, each with its own `tokenEnv`, and the roles that name them.
          sh deploy/chart/tests/print-config.sh \
            deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/coders.values.yaml docker \
            "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" > /dev/null
          # Sharing on (public): the image reads `sharing` with its secret file and the `thread.share` permission of the roles.
          sh deploy/chart/tests/print-config.sh \
            deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/sharing.values.yaml docker \
            "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" | grep -q '^  mode: public'
          # The browser agent on: the image reads the agents file with the browser in it, and its token variable.
          sh deploy/chart/tests/print-config.sh \
            deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/browser.values.yaml docker \
            "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" > /dev/null
          # The artifacts in S3 on RustFS: the image reads `artifacts.s3` with its endpoint and the two credential files.
          sh deploy/chart/tests/print-config.sh \
            deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/rustfs.values.yaml docker \
            "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" | grep -q '^  store: s3'
          # The public files host: the image reads `artifacts.s3.publicEndpoint` (6a, sha-312ad2a) that the chart derives from the host, and with
          # uploads on `artifacts.maxPerJobBytes` and `artifacts.upload`. `downloads` and `presignTtlSecs` are 6b's keys, which this image refuses
          # (exit 78): the chart writes them only when asked, and the step after the model's address reads that render once the tag is past 6b.
          sh deploy/chart/tests/print-config.sh \
            deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/rustfs.values.yaml,deploy/chart/tests/files-host.values.yaml docker \
            "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" | grep -q '^    publicEndpoint: https://agentic-files.example.org$'
          sh deploy/chart/tests/print-config.sh \
            deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/rustfs.values.yaml,deploy/chart/tests/files-host.values.yaml,deploy/chart/tests/files-host-uploads.values.yaml docker \
            "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" | grep -q '^  upload:$'
          # The migration Job on: the orchestrator's configuration is the one without it, byte for byte (render-check.sh asserts it), and the Job's own is that
          # configuration with `artifacts` set to the bucket, so the pinned image reads both whatever its tag. What the pinned image may not have is the Job's
          # COMMAND (`artifacts migrate`, ADR 0058 A5.4): it is run below, and only for a tag at or after the commit that built it. A tag before it would exit 2
          # on the first flag, which is no news about the chart.
          sh deploy/chart/tests/print-config.sh \
            deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/migrate.values.yaml docker \
            "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" | grep -q '^  store: s3'
          # Before the switch the orchestrator is still on the directory: the image reads `store: fs` beside the RustFS the Job will copy into.
          sh deploy/chart/tests/print-config.sh \
            deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/migrate-before.values.yaml docker \
            "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" | grep -q '^  store: fs'
          # A model with no task model writes no `tasks` key (an empty one is null, which the image refuses).
          sh deploy/chart/tests/print-config.sh \
            deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/no-tasks.values.yaml docker \
            "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" > /dev/null
          # The model's address from the AWS secret writes `baseUrl: { file }`, which an image built before the change refuses
          # (exit 78). It is read through the pinned image only when the tag is at or after the commit that introduced the
          # key's `UrlRef` type, so this switches itself on at the first bump past that commit, and says why until then.
          intro=$(git log --format=%H -S 'pub enum UrlRef' -- orchestrator/crates/config/src/types.rs | tail -1)
          tag_sha=${tag#sha-}
          short=$(printf '%.7s' "$intro")
          if [ -z "$intro" ]; then
            echo "::warning::model.baseUrlFromSecret is not read through the pinned image: no commit introduces 'pub enum UrlRef' in orchestrator/crates/config/src/types.rs (renamed or moved? update this step)"
          elif ! git rev-parse --verify --quiet "${tag_sha}^{commit}" > /dev/null; then
            echo "::warning::model.baseUrlFromSecret is not read through the pinned image: the commit $tag_sha named by orchestrator.image.tag is not in this checkout"
          elif git merge-base --is-ancestor "$intro" "$tag_sha"; then
            echo "orchestrator.image.tag ($tag) is at or after $short, which reads baseUrl { file }: reading the model-address render"
            sh deploy/chart/tests/print-config.sh \
              deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/model-secret.values.yaml docker \
              "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" | grep -q 'file: /run/secrets/orchestrator/model-base-url'
          else
            echo "::notice::model.baseUrlFromSecret is not read through the pinned image yet: orchestrator.image.tag ($tag) is before the commit that made baseUrl accept { file } ($short). This step reads it by itself at the first bump at or after that commit."
          fi
          # The migration Job's own command (ADR 0058 A5.4): `artifacts migrate --from fs --to s3 --fs-root ...` as the rendered Job has it, run in the pinned
          # image on the Job's own rendered configuration, with dummy files for its two S3 credentials and nothing else, and an empty directory for the claim,
          # in both orders (before the switch the orchestrator's configuration says fs and the Job's says s3). There is no bucket here, so the claim holds no
          # file: an empty claim is exit 66 with `"complete":false` and `"empty":true` (a claim that is not the store's must not be a success), and exit 0 with
          # `"complete":true` once the render has `--allow-empty`. Either way it loaded the store alone, built it and read the directory without a connection
          # to any bucket. Run only once the tag is at or after the commit that introduced `--allow-empty` (`pub allow_empty`, which is after the subcommand
          # itself); until then it says so.
          intro=$(git log --format=%H -S 'pub allow_empty' -- orchestrator/bin/orchestrator/src/migrate.rs | tail -1)
          short=$(printf '%.7s' "$intro")
          if [ -z "$intro" ]; then
            echo "::warning::the migration Job's command is not run in the pinned image: no commit introduces 'pub allow_empty' in orchestrator/bin/orchestrator/src/migrate.rs (renamed or moved? update this step)"
          elif ! git rev-parse --verify --quiet "${tag_sha}^{commit}" > /dev/null; then
            echo "::warning::the migration Job's command is not run in the pinned image: the commit $tag_sha named by orchestrator.image.tag is not in this checkout"
          elif git merge-base --is-ancestor "$intro" "$tag_sha"; then
            echo "orchestrator.image.tag ($tag) is at or after $short, which has \`artifacts migrate --allow-empty\`: running the Job's command"
            for shape in migrate migrate-before; do
              values="deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/$shape.values.yaml"
              sh deploy/chart/tests/print-config.sh "$values,deploy/chart/tests/migrate-allow-empty.values.yaml" docker \
                "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" job | grep -q '"complete":true,"empty":true'
              # and without it the same empty claim is refused: exit 66, never a success
              status=0
              report=$(sh deploy/chart/tests/print-config.sh "$values" docker "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" job 2> /dev/null) || status=$?
              [ "$status" -eq 66 ] || { echo "an empty claim must be exit 66, got $status ($shape)" >&2; exit 1; }
              printf '%s\n' "$report" | grep -q '"complete":false,"empty":true'
            done
          else
            echo "::notice::the migration Job's command is not run in the pinned image yet: orchestrator.image.tag ($tag) is before the commit that built \`artifacts migrate --allow-empty\` ($short). This step runs it by itself at the first bump at or after that commit; until then do not set orchestrator.artifacts.migrate.enabled."
          fi
          # The redirect of downloads and the lifetime of its URL are keys of 6b (`ArtifactDownloads`): the same, read only once the tag is at or after the
          # commit that introduced them.
          intro=$(git log --format=%H -S 'pub enum ArtifactDownloads' -- orchestrator/crates/config/src/types.rs | tail -1)
          short=$(printf '%.7s' "$intro")
          if [ -z "$intro" ]; then
            echo "::warning::artifacts.s3.downloads is not read through the pinned image: no commit introduces 'pub enum ArtifactDownloads' in orchestrator/crates/config/src/types.rs (renamed or moved? update this step)"
          elif ! git rev-parse --verify --quiet "${tag_sha}^{commit}" > /dev/null; then
            echo "::warning::artifacts.s3.downloads is not read through the pinned image: the commit $tag_sha named by orchestrator.image.tag is not in this checkout"
          elif git merge-base --is-ancestor "$intro" "$tag_sha"; then
            echo "orchestrator.image.tag ($tag) is at or after $short, which reads artifacts.s3.downloads: reading the redirect render"
            sh deploy/chart/tests/print-config.sh \
              deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/rustfs.values.yaml,deploy/chart/tests/files-host.values.yaml,deploy/chart/tests/files-host-redirect.values.yaml docker \
              "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" | grep -q '^    downloads: redirect$'
          else
            echo "::notice::artifacts.s3.downloads is not read through the pinned image yet: orchestrator.image.tag ($tag) is before the commit that introduced it ($short). This step reads it by itself at the first bump at or after that commit."
          fi
          # `database.directUrl` (issue #290) is a key of the commit that introduced it: the render with the pooler on writes it, with `{ env }` references for the two URLs, and an
          # older image refuses the key (exit 78). Read through the pinned image only once the tag is at or after that commit; until then do not set database.pooler.enabled.
          intro=$(git log --format=%H -S 'directUrl' -- docs/api/config.schema.json | tail -1)
          short=$(printf '%.7s' "$intro")
          if [ -z "$intro" ]; then
            echo "::warning::database.directUrl is not read through the pinned image: no commit introduces 'directUrl' in docs/api/config.schema.json (renamed or moved? update this step)"
          elif ! git rev-parse --verify --quiet "${tag_sha}^{commit}" > /dev/null; then
            echo "::warning::database.directUrl is not read through the pinned image: the commit $tag_sha named by orchestrator.image.tag is not in this checkout"
          elif git merge-base --is-ancestor "$intro" "$tag_sha"; then
            echo "orchestrator.image.tag ($tag) is at or after $short, which reads database.directUrl: reading the pooler render"
            sh deploy/chart/tests/print-config.sh \
              deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/pooler.values.yaml docker \
              "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" | grep -q '^  directUrl:$'
          else
            echo "::notice::database.directUrl is not read through the pinned image yet: orchestrator.image.tag ($tag) is before the commit that introduced it ($short). This step reads it by itself at the first bump at or after that commit; until then do not set database.pooler.enabled."
          fi
          # The `secrets` section (ADR 0046, slice 3) is a key of the commit that introduced `UserSecrets`: the render with the keys on is read through the
          # pinned image only once the tag is at or after it (an older image refuses the key, exit 78), and says why until then. Do not set
          # orchestrator.userSecrets.enabled before that tag.
          intro=$(git log --format=%H -S 'pub struct UserSecrets' -- orchestrator/crates/config/src/types.rs | tail -1)
          short=$(printf '%.7s' "$intro")
          if [ -z "$intro" ]; then
            echo "::warning::secrets is not read through the pinned image: no commit introduces 'pub struct UserSecrets' in orchestrator/crates/config/src/types.rs (renamed or moved? update this step)"
          elif ! git rev-parse --verify --quiet "${tag_sha}^{commit}" > /dev/null; then
            echo "::warning::secrets is not read through the pinned image: the commit $tag_sha named by orchestrator.image.tag is not in this checkout"
          elif git merge-base --is-ancestor "$intro" "$tag_sha"; then
            echo "orchestrator.image.tag ($tag) is at or after $short, which reads the secrets section: reading the render with the keys on"
            sh deploy/chart/tests/print-config.sh \
              deploy/chart/examples/netcup.values.yaml,deploy/chart/tests/user-secrets.values.yaml,deploy/chart/tests/user-secrets-rotation.values.yaml docker \
              "ghcr.io/vymalo/another-agentic-system/orchestrator:$tag" | grep -q '^    current: k2$'
          else
            echo "::notice::secrets is not read through the pinned image yet: orchestrator.image.tag ($tag) is before the commit that introduced it ($short). This step reads it by itself at the first bump at or after that commit; until then do not set orchestrator.userSecrets.enabled."
          fi

  # The public files host of RustFS (ADR 0058, A5.2): its Caddyfile is a wall in front of a preview S3 server, and render-check.sh can only read its text
  # (a `respond` deleted from a block, the goldens regenerated over it, passes). This job RUNS it: `caddy validate` of each shape in the chart's pinned
  # image (edge.image, tag and digest), then that image in front of a stub upstream that logs what reaches it, and a matrix of requests: an OPTIONS never
  # reaches the upstream, a subresource, an unsigned query, a path with a % or outside the key prefix and a method that is not served are refused, a
  # PUT over the limit is cut, a GET with a body is cut, the security headers are on every answer Caddy gives (the 413 and the 502 too), CORS answers a
  # listed origin only, and the logs hold no signature. No RustFS (deploy/chart/tests/files-host-proof.sh runs the same Caddyfile on the real one, by hand).
  files-host:
    name: the files host's Caddyfile, run in the pinned Caddy image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: The Caddyfiles validate, and the proxy does what the matrix says
        run: sh deploy/chart/tests/files-host-ci.sh

  scripts:
    name: shell scripts, bump and Keycloak exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck deploy/chart/bump-tag.sh deploy/chart/tests/*.sh deploy/chart/tests/backup-e2e/*.sh deploy/chart/tests/ratelimit-e2e/*.sh deploy/keycloak/tests/*.sh
      - name: bump-tag.sh is idempotent and edits only the image tags
        run: sh deploy/chart/tests/bump-tag-test.sh
      - name: The Keycloak exports are JSON and hold no secret
        run: |
          set -eu
          for f in deploy/keycloak/*.json; do
            jq empty "$f"
            # No `secret` member with a value, no credential, no key material: Keycloak exports client secrets as "**********" at most.
            if jq -e '[.. | objects | to_entries[] | select((.key | test("secret|password|credential|privateKey"; "i")) and (.value | type == "string") and (.value != "") and (.value != "**********"))] | length > 0' "$f" > /dev/null; then
              echo "::error file=$f::the export holds a secret-looking member"
              jq '[.. | objects | to_entries[] | select((.key | test("secret|password|credential|privateKey"; "i")) and (.value | type == "string") and (.value != ""))] | map(.key)' "$f"
              exit 1
            fi
          done

  keycloak-import:
    name: the Keycloak exports import into Keycloak 26.6.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Keycloak (the version of home-os's operator, verified 2026-10-09 by pulling the tag; dev mode, an in-memory database)
        run: |
          docker run -d --name kc -p 127.0.0.1:8180:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.6.1@sha256:dea26401d06341095cc4ea9d66896200b55de5ca1daa1d2fcbe58493afa6e0ad start-dev
      - name: Import every export as the owner does, and read back the web's client
        run: sh deploy/keycloak/tests/import-check.sh
      - name: Keycloak's log
        if: failure()
        run: docker logs kc 2>&1 | tail -200

  bump-dry-run:
    name: show the tag bumps
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: What the bumps would change on main
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tag="sha-$(printf '%s' "$SHA" | cut -c1-7)"
          sh deploy/chart/bump-tag.sh deploy/chart/values.yaml orchestrator "$tag"
          sh deploy/chart/bump-tag.sh deploy/chart/values.yaml web "$tag"
          sh deploy/chart/bump-tag.sh deploy/chart/values.yaml webSearch "$tag"
          {
            echo "### Tag bump dry run"
            echo
            echo "On main the image workflows would set the tags to \`$tag\` (each only after its own image is pushed):"
            echo
            echo '```diff'
            git diff --unified=1 -- deploy/chart/values.yaml
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
