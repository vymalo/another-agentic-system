name: Compose

# The local development stack (compose.yaml, dev/): every compose profile must parse, the WireMock
# stand-in agents and the mock web-search MCP server (and the mock OIDC issuer's tests) must answer as documented, and the REAL orchestrator client
# must still work against the agents, so the mocks cannot drift from the protocol code they exist to test.
# The `app` and `split` profiles build the orchestrator and web images, which the Orchestrator and Web
# workflows already build; here they are only validated with `docker compose config` (every profile, and the
# live override compose.live.yaml against .env.example). They are RUN by the
# Coder E2E workflow (coder-e2e.yml), which also checks the mocks vendored under dev/coder and runs the
# split roles (dev/split-e2e.sh).
#
# Path filters mean this check must not be made "required" for unrelated PRs.

on:
  pull_request:
    paths:
      - "compose.yaml"
      - "compose.live.yaml"
      - ".env.example"
      - "dev/**"
      - "orchestrator/crates/a2a-mapping/**"
      - "orchestrator/crates/agent-a2a/**"
      - "orchestrator/crates/e2e/tests/wiremock_agent.rs"
      - ".github/workflows/compose.yml"
  push:
    branches: [main]
    paths:
      - "compose.yaml"
      - "compose.live.yaml"
      - ".env.example"
      - "dev/**"
      - "orchestrator/crates/a2a-mapping/**"
      - "orchestrator/crates/agent-a2a/**"
      - "orchestrator/crates/e2e/tests/wiremock_agent.rs"
      - ".github/workflows/compose.yml"

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "orchestrator -> target"
      - name: Every profile parses
        run: |
          docker compose config -q
          docker compose --profile app config -q
          docker compose --profile split config -q
          docker compose --profile app --profile split config -q
          docker compose --profile '*' config -q
          # the coder as a GitHub App (dev/compose.github-app.yaml; the Coder E2E workflow runs it)
          docker compose -f compose.yaml -f dev/compose.github-app.yaml --profile '*' config -q
          # the coder's work environments on a rootless Podman service (dev/compose.devcontainer.yaml; the Coder E2E workflow runs it)
          docker compose -f compose.yaml -f dev/compose.devcontainer.yaml --profile '*' config -q
          # ... and that service is given no more than it needs: no `privileged`, no `cap_add`, no `devices`, and no Docker socket anywhere
          docker compose -f compose.yaml -f dev/compose.devcontainer.yaml --profile '*' config --format json > "$RUNNER_TEMP/compose-devcontainer.json"
          jq -e '.services.podman | (.privileged // false) == false and ((.cap_add // []) | length) == 0 and ((.devices // []) | length) == 0' "$RUNNER_TEMP/compose-devcontainer.json"
          jq -e '[.services[] | (.volumes // [])[] | (.source // "") | select(test("docker\\.sock"))] | length == 0' "$RUNNER_TEMP/compose-devcontainer.json"
      - name: The live override parses against the example environment
        # compose.live.yaml (going live, dev/README.md) needs Compose v2.24.4 or newer for `!override`; .env.example
        # stands in for a real .env, so the `:?` checks pass. The result must also drop the mocks from the coder.
        run: |
          docker compose -f compose.yaml -f compose.live.yaml --env-file .env.example config -q
          docker compose -f compose.yaml -f compose.live.yaml --env-file .env.example --profile app config --services | tee services.txt
          # the chat and the researcher stay, on the real model of .env
          grep -E '^chat$' services.txt
          grep -E '^researcher$' services.txt
          # the coder reads GitHub through its sidecar (github-mcp, the real server, no credential), not the mock: the sidecar stays, the
          # coder names no GITHUB_MCP_URL (its default is the sidecar) and mounts no mock mcp.json
          grep -E '^github-mcp$' services.txt
          docker compose -f compose.yaml -f compose.live.yaml --env-file .env.example --profile app config --format json > "$RUNNER_TEMP/compose-live.json"
          jq -e '.services.coder.environment | (has("GITHUB_MCP_URL") or has("MCP_ALLOW_STDIO") or has("GITHUB_MCP_HOST")) | not' "$RUNNER_TEMP/compose-live.json"
          jq -e '[.services.coder.volumes[] | select(.target == "/etc/adam/agent/mcp.json")] | length == 0' "$RUNNER_TEMP/compose-live.json"
          # the offline stand-ins go (last, so that this line's status is the step's: `set -e` ignores a negated command)
          ! grep -E '^(mock-openai|mock-github|mock-github-mcp|git-server|mock-ci|mock-model)$' services.txt
      - name: Start the infrastructure and the mocks
        run: docker compose up -d --wait postgres mock-agent mock-agent-releases mock-verifier mock-registry mock-researcher mock-browser
      - name: Every mock scenario answers as documented
        run: dev/check-mocks.sh http://127.0.0.1:8081 http://127.0.0.1:8082 http://127.0.0.1:8083 http://127.0.0.1:8084 http://127.0.0.1:8086 http://127.0.0.1:8087
      - name: The mock web-search MCP server (built here) and the scripted models of the agents (WireMock) answer as documented
        # `mock-persona` greets from the persona lines of an agent folder, `mock-researcher` calls the search tool and
        # names the first link of the results (dev/wiremock/model, dev/README.md, "Several agents"), and the `[mock:share]` script of
        # the coder's `mock-coder` (mock-openai, beside the vendored scripts: dev/wiremock/coder-share) makes three files, shares them and
        # shows two as Images, with the bytes it writes compared with dev/wiremock/coder-share/files.
        run: |
          docker compose --profile app build mock-mcp-search
          docker compose --profile app up -d --wait mock-mcp-search mock-model mock-openai
          dev/check-agent-mocks.sh http://127.0.0.1:8096 http://127.0.0.1:8094 http://127.0.0.1:8091
      - name: The real orchestrator client against the mocks
        run: |
          cd orchestrator
          ORCH_TEST_MOCK_AGENT_URL=http://127.0.0.1:8081 \
          ORCH_TEST_MOCK_AGENT_RELEASES_URL=http://127.0.0.1:8082 \
          ORCH_TEST_MOCK_VERIFIER_URL=http://127.0.0.1:8083 \
            cargo test -p orch-e2e --test wiremock_agent --locked
      - name: Logs
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Tear down
        if: always()
        run: docker compose --profile app down -v

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck the dev scripts
        run: shellcheck dev/*.sh dev/coder/*.sh dev/mock-ci/*.sh dev/smee/*.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The mock web-search server parses and passes its tests
        run: |
          node --check dev/mock-mcp-search/server.mjs
          node --test dev/mock-mcp-search/server.test.mjs
      - name: The mock OIDC issuer (discovery, keys, the code flow with PKCE, client_credentials for a user) parses and passes its tests
        run: |
          node --check dev/mock-oidc/server.mjs
          node --test dev/mock-oidc/server.test.mjs
      - name: The live web-search server (SearXNG, Brave, Tavily and a page reader) parses and passes its tests
        run: |
          node --check dev/searxng-mcp/server.mjs
          node --test dev/searxng-mcp/server.test.mjs
