name: Compose

# The local development stack (compose.yaml, dev/): every compose profile must parse, the WireMock
# stand-in agents and the mock web-search MCP server must answer as documented, and the REAL orchestrator client
# must still work against the agents, so the mocks cannot drift from the protocol code they exist to test.
# The `app` and `split` profiles build the orchestrator and web images, which the Orchestrator and Web
# workflows already build; here they are only validated with `docker compose config` (every profile, and the
# live override compose.live.yaml against .env.example). They are RUN by the
# Coder E2E workflow (coder-e2e.yml), which also checks the mocks vendored under dev/coder and runs the
# split roles (dev/split-e2e.sh).
#
# Path filters mean this check must not be made "required" for unrelated PRs.

on:
  pull_request:
    paths:
      - "compose.yaml"
      - "compose.live.yaml"
      - ".env.example"
      - "dev/**"
      - "orchestrator/crates/a2a-mapping/**"
      - "orchestrator/crates/agent-a2a/**"
      - "orchestrator/crates/e2e/tests/wiremock_agent.rs"
      - ".github/workflows/compose.yml"
  push:
    branches: [main]
    paths:
      - "compose.yaml"
      - "compose.live.yaml"
      - ".env.example"
      - "dev/**"
      - "orchestrator/crates/a2a-mapping/**"
      - "orchestrator/crates/agent-a2a/**"
      - "orchestrator/crates/e2e/tests/wiremock_agent.rs"
      - ".github/workflows/compose.yml"

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "orchestrator -> target"
      - name: Every profile parses
        run: |
          docker compose config -q
          docker compose --profile app config -q
          docker compose --profile split config -q
          docker compose --profile app --profile split config -q
          docker compose --profile '*' config -q
          # the coder as a GitHub App (dev/compose.github-app.yaml; the Coder E2E workflow runs it)
          docker compose -f compose.yaml -f dev/compose.github-app.yaml --profile '*' config -q
      - name: The live override parses against the example environment
        # compose.live.yaml (going live, dev/README.md) needs Compose v2.24.4 or newer for `!override`; .env.example
        # stands in for a real .env, so the `:?` checks pass. The result must also drop the mocks from the coder.
        run: |
          docker compose -f compose.yaml -f compose.live.yaml --env-file .env.example config -q
          docker compose -f compose.yaml -f compose.live.yaml --env-file .env.example --profile app config --services | tee services.txt
          # the chat and the researcher stay, on the real model of .env
          grep -E '^chat$' services.txt
          grep -E '^researcher$' services.txt
          # the offline stand-ins go (last, so that this line's status is the step's: `set -e` ignores a negated command)
          ! grep -E '^(mock-openai|mock-github|mock-github-mcp|git-server|mock-ci|mock-model)$' services.txt
      - name: Start the infrastructure and the mocks
        run: docker compose up -d --wait postgres mock-agent mock-agent-releases mock-verifier mock-registry
      - name: Every mock scenario answers as documented
        run: dev/check-mocks.sh http://127.0.0.1:8081 http://127.0.0.1:8082 http://127.0.0.1:8083 http://127.0.0.1:8084
      - name: The mock web-search MCP server (built here) and the scripted models of the agents (WireMock) answer as documented
        # `mock-persona` greets from the persona lines of an agent folder, `mock-researcher` calls the search tool and
        # names the first link of the results (dev/wiremock/model, dev/README.md, "Several agents").
        run: |
          docker compose --profile app build mock-mcp-search
          docker compose --profile app up -d --wait mock-mcp-search mock-model
          dev/check-agent-mocks.sh http://127.0.0.1:8096 http://127.0.0.1:8094
      - name: The real orchestrator client against the mocks
        run: |
          cd orchestrator
          ORCH_TEST_MOCK_AGENT_URL=http://127.0.0.1:8081 \
          ORCH_TEST_MOCK_AGENT_RELEASES_URL=http://127.0.0.1:8082 \
          ORCH_TEST_MOCK_VERIFIER_URL=http://127.0.0.1:8083 \
            cargo test -p orch-e2e --test wiremock_agent --locked
      - name: Logs
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Tear down
        if: always()
        run: docker compose --profile app down -v

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck the dev scripts
        run: shellcheck dev/*.sh dev/coder/*.sh dev/mock-ci/*.sh dev/smee/*.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The mock web-search server parses and passes its tests
        run: |
          node --check dev/mock-mcp-search/server.mjs
          node --test dev/mock-mcp-search/server.test.mjs
