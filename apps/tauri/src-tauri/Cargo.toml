[package]
name = "another-agentic-desktop"
version = "0.1.0"
description = "The desktop app of another-agentic-system: the web's static export in a Tauri 2 window (ADR 0047)"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false
readme = "../README.md"

# Its own workspace: the orchestrator's workspace never builds it, and it pins its own dependencies (Cargo.lock).
[workspace]

[lib]
name = "agentic_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-opener = "=2.7.0"
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
url = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
